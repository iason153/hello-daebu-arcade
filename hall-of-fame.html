<style>
  :root {

  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--ink);

  a { color: inherit; }
  img { display: block; max-width: 100%; }

  .pediment { position: relative; z-index: 1; }
  .pediment svg { width: 100%; height: auto; display: block; }
  .pediment .inscription {
    position: absolute; left: 0; right: 0; bottom: 20%;

  /* ---------- 성소(게임별) ---------- */
  main { max-width: 560px; margin: 0 auto; padding: 22px 16px 40px; }
  .shrine { position: relative; margin-top: 26px; }
  .shrine-frame {
    position: relative;
    display: grid; grid-template-columns: 26px 1fr 26px;
    background: var(--marble);
    border-radius: 6px 6px 4px 4px;

  .column {
    background:
      repeating-linear-gradient(90deg, var(--marble) 0 4px, var(--marble-shade) 4px 6px, var(--marble) 6px 9px);
    border-left: 1px solid var(--marble-shade); border-right: 1px solid var(--marble-shade);
  }
  .column::before, .column::after { content: ""; display: block; height: 12px; background: var(--marble-shade); margin: 0 -4px; border-radius: 2px; }

  .niche { padding: 18px 12px 20px; text-align: center; position: relative; overflow: hidden; }
  .niche::before { /* 벽감 안쪽의 아치 그림자 */
    content: ""; position: absolute; left: 12%; right: 12%; top: 58px; height: 200px;
    border-radius: 999px 999px 0 0;
    background: radial-gradient(ellipse at 50% 30%, #fff9e8 0%, #ede3cf 55%, #e2d5bc 100%);
    box-shadow: inset 0 10px 24px rgba(120,95,50,.22);

  .niche > * { position: relative; }
  .game-name { font-family: 'Jua', sans-serif; font-size: 22px; color: var(--ink); }
  .guardian { font-size: 12px; color: var(--ink-soft); margin-top: -2px; }

  .statue-wrap { position: relative; height: 200px; margin: 8px auto 0; display: flex; align-items: flex-end; justify-content: center; }
  /* 황금 조각상: 캐릭터 그림 모양대로 금빛 그라디언트를 오려내고(mask), 원래 그림을 곱하기로
     얹어서 선은 살리고 흰 몸통만 금으로 바꾼다 */
  .statue {
    position: relative; display: inline-block; line-height: 0;
    background: linear-gradient(135deg, #fff1b8 0%, #f2c14e 28%, #b9811f 55%, #f7d77a 72%, #9a6614 100%);
    background-size: 220% 220%;
    -webkit-mask-image: var(--src); mask-image: var(--src);
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;

  .statue img { max-height: 150px; max-width: 100%; width: auto; mix-blend-mode: multiply; }
  .statue-cell { max-width: 54%; margin-bottom: 22px; filter: drop-shadow(0 8px 10px rgba(110,70,10,.4)); } /* 받침대에 붙지 않게 살짝 띄움 */

  .plaque .record { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 17px; color: #7a5412; }
  .plaque .reign { font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .plaque.empty .name { font-size: 18px; color: var(--ink-soft); }

  .challenge {
    display: inline-block; margin-top: 16px; padding: 11px 22px; border-radius: 999px;

  .share-card {

  #toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: rgba(43,36,51,.92); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); z-index: 10; }
  #toast.show { opacity: 1; }

  /* 신전 계단 — 성소 아래 받침 */
  .steps span { display: block; height: 9px; margin: 0 auto; background: var(--marble-shade); border-bottom: 1px solid var(--marble-deep); }
  .steps span:nth-child(1) { width: 96%; }
  .steps span:nth-child(2) { width: 100%; background: var(--marble-deep); }

  /* ---------- 성소 아래 기록 ---------- */
  .records { background: rgba(255,251,242,.92); border-radius: 0 0 10px 10px; padding: 16px 16px 18px; font-size: 14px; }
  .records h3 { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 15px; margin: 0 0 8px; }
  .records section + section { margin-top: 16px; padding-top: 14px; border-top: 1px solid #eadfc9; }
  .podium { list-style: none; display: grid; gap: 4px; }
  .podium li { display: flex; justify-content: space-between; gap: 10px; }
  .podium .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .pts { font-variant-numeric: tabular-nums; font-weight: 700; color: #7a5412; }
  .rank-mark { display: inline-block; margin-right: 8px; font-weight: 700; color: var(--gold); }

  .ascended { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .ascended li {
    padding: 4px 10px 4px 8px; border-radius: 999px; font-size: 13px;
    background: linear-gradient(#fff4d6, #f3dfa6); border: 1px solid #e0bf6b;
  }
  .ascended li b { color: var(--gold); font-weight: 700; margin-right: 4px; }

  details summary { cursor: pointer; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 15px; list-style: none; }
  details summary::-webkit-details-marker { display: none; }
  details summary::after { content: " ＋"; color: var(--gold); }
  details[open] summary::after { content: " －"; }
  .history { list-style: none; margin-top: 10px; border-left: 2px solid #e6d3a3; padding-left: 14px; }
  .history li { position: relative; padding: 3px 0; display: flex; gap: 10px; justify-content: space-between; }
  .history li::before { content: ""; position: absolute; left: -19px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .history li:first-child::before { background: var(--gold-bright); box-shadow: 0 0 0 3px rgba(242,193,78,.35); }
  .history .when { color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
  .note { font-size: 12px; color: var(--ink-soft); }

  .loading, .error { text-align: center; color: #fff; padding: 40px 0; text-shadow: 0 1px 6px rgba(20,30,70,.4); }

  footer { max-width: 560px; margin: 0 auto; padding: 8px 16px 48px; text-align: center; font-size: 13px; color: var(--ink-soft); }

  @media (prefers-reduced-motion: no-preference) {

  .card-show { display: block; margin: 12px auto 6px; text-decoration: none; color: inherit; }
  .cs-fan { display: flex; justify-content: center; padding: 6px 0 4px; }
  .cs-card { position: relative; width: 78px; aspect-ratio: 2 / 3; border-radius: 9px; overflow: hidden; border: 3px solid #cfd6e2; margin: 0 -9px; box-shadow: 0 6px 14px rgba(43, 36, 51, 0.35); transition: transform .2s ease; background: #1a2148; }
  .cs-card.rare { border-color: #f2b61e; box-shadow: 0 0 14px rgba(242, 182, 30, 0.65), 0 6px 14px rgba(43, 36, 51, 0.35); }
  .cs-card.legend { border-color: #ff7ad9; box-shadow: 0 0 16px rgba(255, 122, 217, 0.75), 0 6px 14px rgba(43, 36, 51, 0.35); }
  .cs-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cs-card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, 0.75) 50%, transparent 65%); background-size: 280% 100%; animation: csSweep 3.6s ease-in-out infinite; mix-blend-mode: screen; }
  @keyframes csSweep { 0%, 30% { background-position: 140% 0; } 80%, 100% { background-position: -140% 0; } }
  .cs-fan .cs-card:nth-child(1):not(:only-child) { transform: rotate(-9deg) translateY(5px); }
  .cs-fan .cs-card:nth-child(2):not(:last-child) { transform: translateY(-4px); z-index: 1; }
  .cs-fan .cs-card:last-child:not(:only-child) { transform: rotate(9deg) translateY(5px); }
  .card-show:hover .cs-card { transform: translateY(-6px); }
  .cs-cap { display: block; margin-top: 8px; font-size: 13px; color: #7a5412; }
  .cs-cap b { color: #a8650a; }
  .cs-plain { display: inline-block; margin-top: 6px; font-size: 13px; color: #7a5412; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) { .cs-card::after { animation: none; } .cs-card { transition: none; } }
  .cb-link { color: inherit; text-decoration: underline; text-decoration-color: rgba(201, 146, 44, 0.6); text-underline-offset: 4px; }
</style>

<script>
// 게임별 성소 구성 — 게임을 추가하면 여기에 한 줄 더 넣으면 된다.
const SHRINES = [
  {
    key: 'hello_tower', name: '헬로타워', unit: '층', href: 'games/hello-tower/',
    statue: 'games/hello-tower/assets/blocks/hello.png',

    ascendedTitle: '올림포스 꼭대기에 선 자들',

    reachedTitle: '하늘나라에 닿은 자들',
    reachedNote: '100층, 1막을 넘어 신들의 나라에 닿은 이들이에요. 먼저 닿은 순서대로 새겼어요.',
  },
  {
    key: 'hello_run', name: '헬로런', unit: 'm', href: 'games/hello-run/',
    statue: 'games/hello-run/assets/hello_jump_peak.png',
    god: 'games/hello-tower/assets/bg/gods/poseidon.png', godName: '포세이돈', godSide: 'right',
    guardian: '바다의 신 포세이돈이 지키는 성소',
  },
  {
    key: 'hello_bird', name: '헬로버드', unit: '점', href: 'games/hello-bird/',
    statue: 'games/hello-bird/assets/hello_flap_up.png',
    god: 'games/hello-tower/assets/bg/gods/apollo.png', godName: '아폴론', godSide: 'left',
    guardian: '태양의 신 아폴론이 지키는 성소',
  },
  {
    key: 'hello_munch', name: '헬로먼치', unit: 'm', href: 'games/hello-munch/',
    statue: 'games/hello-munch/assets/hello_round.webp',
    god: 'games/hello-tower/assets/bg/gods/athena.png', godName: '아테나', godSide: 'right',
    guardian: '지혜의 신 아테나가 지키는 성소',
    ascendedTitle: '신들의 나라에 닿은 자들',
    ascendedNote: '500m, 괴물을 따돌리고 신들의 나라까지 도망친 이들이에요. 먼저 닿은 순서대로 새겼어요.',
  },
];

function el(tag, attrs = {}, ...children) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  for (const c of children) if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  return n;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return '';
  return `${d.getMonth() + 1}월 ${d.getDate()}일`;
}
// 카드첩이 있는 사람(로그인하고 기록을 올린 사람)은 이름을 누르면 올림포스 카드첩으로 이동
function whoNode(e) {
  if (e && /^[a-z0-9]{4,16}$/.test(e.wid || '')) return el('a', { class: 'cb-link', href: '/cardbook.html?w=' + e.wid, title: '카드첩 구경하기' }, e.nickname + ' 🎴');
  return document.createTextNode(e.nickname);
}
// 왕좌의 주인이 올림포스 카드첩 회원이면, 가진 카드 중 가장 귀한 3장을 부채꼴로 보여 주고 카드첩으로 연결
const GOD_RANK = ['hello', 'starfish', 'crab', 'gull', 'zeus', 'athena', 'hermes', 'poseidon', 'aphrodite', 'm_chomp', 'm_sky', 'm_cloud', 'm_rocket', 'jellyfish', 'apollo', 'hades', 'artemis', 'dionysus', 'm_space', 'm_near', 'm_gull', 'm_gods', 'hera']; // 귀한 순서(뒤로 갈수록 귀함)
const CARD_GRADE = { jellyfish: 'rare', apollo: 'rare', hades: 'rare', artemis: 'rare', dionysus: 'rare', hera: 'legend', m_space: 'rare', m_near: 'rare', m_gull: 'rare', m_gods: 'legend' };
const CARD_FALLBACK = { m_chomp: 'm0_wide', m_sky: 'hello_tall', m_cloud: 'ledge_ice', m_rocket: 'shell_gold', m_space: 'hello_round', m_near: 'm3_closing', m_gull: 'gull_flap', m_gods: 'god_zeus' }; // 카드 그림이 아직 없을 때 쓰는 게임 그림
function cardShow(e) {
  if (!e || !/^[a-z0-9]{4,16}$/.test(e.wid || '')) return null;
  const gods = GOD_RANK.filter((g) => (e.gods || []).includes(g));
  const href = '/cardbook.html?w=' + e.wid;
  if (!gods.length) return el('a', { class: 'cs-plain', href }, '🎴 카드첩 구경하기 →');
  const a = el('a', { class: 'card-show', href, 'aria-label': `${e.nickname}님의 올림포스 카드첩 구경하기 — 카드 ${gods.length}장 보유` });
  const fan = el('span', { class: 'cs-fan' });
  gods.slice(-3).forEach((g) => {
    const c = el('span', { class: 'cs-card ' + (CARD_GRADE[g] || 'normal') }, el('img', { src: `/assets/cards/${g}.webp`, alt: '', loading: 'lazy' }));
    if (CARD_FALLBACK[g]) c.querySelector('img').addEventListener('error', (ev) => { const im = ev.target; if (!im.dataset.fb) { im.dataset.fb = '1'; im.style.objectFit = 'contain'; im.src = `/games/hello-munch/assets/${CARD_FALLBACK[g]}.webp`; } });
    fan.appendChild(c);
  });
  a.append(fan, el('span', { class: 'cs-cap' }, el('b', { text: `카드 ${gods.length}장 보유` }), ' · 카드첩 구경하기 →'));
  a.addEventListener('click', () => track('hall_cardbook_click', { cards: gods.length }));
  return a;
}
function reignText(iso) {
  if (!iso) return '';
  const start = new Date(iso);
  if (isNaN(start)) return '';
  const days = Math.floor((Date.now() - start.getTime()) / 86400000);
  if (days < 1) return `${fmtDate(iso)} 즉위, 오늘 새로 오른 왕좌예요`;
  return `${fmtDate(iso)} 즉위, ${days}일째 왕좌를 지키는 중`;
}

function track(name, params) {
  try { if (typeof gtag === 'function') gtag('event', name, params || {}); } catch (e) {}
}

function renderShrine(cfg, data) {
  const champ = data && data.champion;

  const niche = el('div', { class: 'niche' },
    el('h2', { class: 'game-name', text: cfg.name }),
    el('p', { class: 'guardian', text: cfg.guardian }),
  );

  const statueWrap = el('div', { class: 'statue-wrap' },
    el('img', { class: `god ${cfg.godSide}`, src: cfg.god, alt: cfg.godName, loading: 'lazy' }),
    el('div', { class: 'statue-cell' },
      el('div', { class: 'statue', style: `--src:url('${cfg.statue}')` },
        el('img', { src: cfg.statue, alt: `${cfg.name} 1위를 기리는 황금 헬로 조각상` }))),
  );
  niche.appendChild(statueWrap);
  niche.appendChild(el('div', { class: 'pedestal' }));

  const plaque = el('div', { class: 'plaque' + (champ ? '' : ' empty') });
  if (champ) {
    plaque.append(
      el('div', { class: 'title', text: champ.reign ? `제${champ.reign}대 왕좌의 주인` : '현재 왕좌의 주인' }),
      el('div', { class: 'name', text: champ.nickname }),
      ...[cardShow(champ)].filter(Boolean),
      el('div', { class: 'record', text: `${champ.score}${cfg.unit}` }),
      el('div', { class: 'reign', text: reignText(champ.at) }),
    );
  } else {
    plaque.append(
      el('div', { class: 'title', text: '비어 있는 왕좌' }),
      el('div', { class: 'name', text: '첫 번째 주인을 기다려요' }),
    );
  }
  niche.appendChild(plaque);

  const cta = el('a', { class: 'challenge', href: cfg.href, text: champ ? '왕좌에 도전하기' : '첫 주인 되기' });
  cta.addEventListener('click', () => track('hall_challenge_click', { game: cfg.key }));
  niche.appendChild(cta);

  if (champ) {
    const share = el('button', { class: 'share-card', type: 'button', text: '👑 왕좌 카드 카톡으로 자랑하기' });
    share.addEventListener('click', () => shareThroneCard(cfg, champ, share));
    niche.appendChild(share);
    niche.appendChild(el('p', { class: 'share-hint', text: '왕좌에 오른 기념 카드를 친구들에게 보내 보세요' }));
  }

  const frame = el('div', { class: 'shrine-frame' },
    el('div', { class: 'column', 'aria-hidden': 'true' }), niche, el('div', { class: 'column', 'aria-hidden': 'true' }));

  const steps = el('div', { class: 'steps', 'aria-hidden': 'true' }, el('span'), el('span'));

  // 성소 아래 기록들
  const records = el('div', { class: 'records' });

  if (cfg.ascendedTitle && data && data.ascended && data.ascended.length) {
    const list = el('ol', { class: 'ascended' });
    data.ascended.forEach((e, i) => list.appendChild(el('li', {}, el('b', { text: `제${i + 1}호` }), e.nickname)));
    records.appendChild(el('section', {},
      el('h3', { text: `${cfg.ascendedTitle} (${data.ascended.length}명)` }),
      el('p', { class: 'note', text: cfg.ascendedNote, style: 'margin:-4px 0 8px' }),
      list));
  }

  if (cfg.reachedTitle && data && data.reached && data.reached.length) {
    const list = el('ol', { class: 'ascended' });
    data.reached.forEach((e, i) => list.appendChild(el('li', {}, el('b', { text: `제${i + 1}호` }), e.nickname)));
    records.appendChild(el('section', {},
      el('h3', { text: `${cfg.reachedTitle} (${data.reached.length}명)` }),
      el('p', { class: 'note', text: cfg.reachedNote, style: 'margin:-4px 0 8px' }),
      list));
  }

  if (data && data.podium && data.podium.filter((e) => !champ || e.nickname !== champ.nickname).length) {
    const list = el('ol', { class: 'podium' });
    data.podium.filter((e) => !champ || e.nickname !== champ.nickname).slice(0, 2).forEach((e, i) => {
      list.appendChild(el('li', {},
        el('span', { class: 'who' }, el('span', { class: 'rank-mark', text: `${i + 2}위` }), whoNode(e)),
        el('span', { class: 'pts', text: `${e.score}${cfg.unit}` })));
    });
    records.appendChild(el('section', {}, el('h3', { text: '왕좌 곁을 지키는 이들' }), list));
  }

  if (data && data.history && data.history.length) {
    const list = el('ol', { class: 'history' });
    data.history.forEach((e) => {
      list.appendChild(el('li', {},
        el('span', {}, e.reign ? `제${e.reign}대 ${e.nickname} ` : `${e.nickname} `, el('b', { text: `${e.score}${cfg.unit}` })),
        el('span', { class: 'when', text: fmtDate(e.at) })));
    });
    const det = el('details', {}, el('summary', { text: `왕좌의 역사 (지금까지 ${data.reign || data.history.length}대)` }), list);
    records.appendChild(el('section', {}, det));
  }

  if (data && data.players) {
    records.appendChild(el('p', { class: 'note', text: `지금까지 ${data.players}명이 이 왕좌에 도전했어요.` }));
  }

  const shrine = el('article', { class: 'shrine', id: `shrine-${cfg.key}`, 'aria-label': `${cfg.name} 성소` }, frame, steps);
  if (records.childNodes.length) shrine.appendChild(records);
  return shrine;
}

async function load() {
  const root = document.getElementById('shrines');
  try {
    const res = await fetch('/api/hall');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { games } = await res.json();
    root.innerHTML = '';
    SHRINES.forEach((cfg) => root.appendChild(renderShrine(cfg, games[cfg.key])));
    const g = new URLSearchParams(location.search).get('g');
    const target = g && document.getElementById(`shrine-${g}`);
    if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
  } catch (e) {
    root.innerHTML = '';
    root.appendChild(el('p', { class: 'error', text: '신전 문이 잠시 닫혀 있어요. 잠시 후 새로고침해 주세요.' }));
  }
}

// =====================================================================
// 왕좌 카드 — 캔버스로 그려서 카카오톡으로 공유(안 되면 기기 공유 → 이미지 저장 순서로 폴백).
// 흐름은 게임들의 "친구에게 자랑하기"와 같고, 이미지 업로드도 같은 /api/kakao-upload를 쓴다.
// =====================================================================
const CARD_W = 640, CARD_H = 800;
const SITE = 'https://daebugame.com';

function loadImg(src) {
  return new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = src; });
}

// 흰 캐릭터 그림 → 금빛 조각상(선은 살리고 몸통만 금색)
function goldStatue(img, w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, w, h);
  x.globalCompositeOperation = 'source-in';
  const g = x.createLinearGradient(0, 0, w, h);
  g.addColorStop(0, '#fff1b8'); g.addColorStop(.3, '#f2c14e'); g.addColorStop(.55, '#b9811f'); g.addColorStop(.75, '#f7d77a'); g.addColorStop(1, '#9a6614');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.globalCompositeOperation = 'multiply';
  x.drawImage(img, 0, 0, w, h);
  x.globalCompositeOperation = 'destination-in';
  x.drawImage(img, 0, 0, w, h);
  return c;
}

function fitText(ctx, text, maxW, startPx, font) {
  let px = startPx;
  do { ctx.font = `700 ${px}px ${font}`; px -= 2; } while (ctx.measureText(text).width > maxW && px > 18);
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function buildThroneCard(cfg, champ) {
  try {
    await Promise.all([
      document.fonts.load('700 40px "Gowun Batang"'),
      document.fonts.load('40px "Jua"'),
    ]);
  } catch (e) { /* 글꼴이 없으면 기본 글꼴로 */ }
  const [statueImg, godImg] = await Promise.all([loadImg(cfg.statue), loadImg(cfg.god)]);

  const c = document.createElement('canvas'); c.width = CARD_W; c.height = CARD_H;
  const ctx = c.getContext('2d');
  const SERIF = '"Gowun Batang", serif', ROUND = '"Jua", sans-serif';

  // 하늘
  const sky = ctx.createLinearGradient(0, 0, 0, CARD_H);
  sky.addColorStop(0, '#233f7a'); sky.addColorStop(.35, '#6f88bf'); sky.addColorStop(.62, '#f6d49a'); sky.addColorStop(1, '#f8ecd4');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, CARD_W, CARD_H);

  // 조각상 뒤 후광
  const cx = CARD_W / 2, cy = 360;
  ctx.save(); ctx.translate(cx, cy);
  for (let i = 0; i < 18; i++) {
    ctx.rotate(Math.PI * 2 / 18);
    ctx.fillStyle = i % 2 ? 'rgba(255,236,170,.22)' : 'rgba(255,255,255,.10)';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-26, -330); ctx.lineTo(26, -330); ctx.closePath(); ctx.fill();
  }
  const halo = ctx.createRadialGradient(0, 0, 10, 0, 0, 170);
  halo.addColorStop(0, 'rgba(255,248,215,.95)'); halo.addColorStop(1, 'rgba(255,248,215,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(0, 0, 170, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // 신전 박공
  ctx.fillStyle = '#f5f0e6'; ctx.strokeStyle = '#b3a68f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(40, 132); ctx.lineTo(cx, 34); ctx.lineTo(CARD_W - 40, 132); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#e8dfcd'; ctx.fillRect(28, 132, CARD_W - 56, 18); ctx.strokeRect(28, 132, CARD_W - 56, 18);
  ctx.fillStyle = '#5a4a36'; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.font = `700 34px ${SERIF}`; ctx.fillText('헬로 신전', cx, 118);

  // 게임 + 대수 리본
  const ribbon = `${cfg.name} 제${champ.reign || 1}대 왕좌`;
  ctx.font = `28px ${ROUND}`;
  const rw = ctx.measureText(ribbon).width + 48;
  ctx.fillStyle = '#2b2433'; roundRect(ctx, cx - rw / 2, 170, rw, 48, 24); ctx.fill();
  ctx.fillStyle = '#f2c14e'; ctx.fillText(ribbon, cx, 204);

  // 금빛 조각상 + 지키는 신
  const sh = 200, sw = Math.min(260, statueImg.width * sh / statueImg.height);
  const shh = statueImg.height * sw / statueImg.width;
  ctx.save(); ctx.shadowColor = 'rgba(110,70,10,.45)'; ctx.shadowBlur = 18; ctx.shadowOffsetY = 8;
  // 받침대(460)에 붙지 않게 살짝 띄워서 후광 한가운데에 오도록
  ctx.drawImage(goldStatue(statueImg, Math.round(sw), Math.round(shh)), cx - sw / 2, 440 - shh, sw, shh);
  ctx.restore();
  const gw = 118, gh = godImg.height * gw / godImg.width;
  const gx = cfg.godSide === 'right' ? CARD_W - gw - 26 : 26;
  ctx.drawImage(godImg, gx, 470 - gh, gw, gh);

  // 받침대
  ctx.fillStyle = '#c9bfae'; ctx.fillRect(cx - 150, 460, 300, 18);

  // 명판
  const px = 70, py = 488, pw = CARD_W - 140, ph = 196;
  const plate = ctx.createLinearGradient(0, py, 0, py + ph);
  plate.addColorStop(0, '#fff6df'); plate.addColorStop(1, '#f0dcae');
  ctx.fillStyle = plate; roundRect(ctx, px, py, pw, ph, 8); ctx.fill();
  ctx.strokeStyle = '#c9922c'; ctx.lineWidth = 4; ctx.stroke();
  ctx.strokeStyle = 'rgba(201,146,44,.5)'; ctx.lineWidth = 1.5; roundRect(ctx, px + 9, py + 9, pw - 18, ph - 18, 5); ctx.stroke();

  ctx.fillStyle = '#c9922c'; ctx.font = `500 20px 'Noto Sans KR', sans-serif`;
  ctx.fillText('왕좌의 주인', cx, py + 44);
  ctx.fillStyle = '#2b2433'; fitText(ctx, champ.nickname, pw - 60, 54, SERIF);
  ctx.fillText(champ.nickname, cx, py + 108);
  ctx.fillStyle = '#7a5412'; ctx.font = `700 32px ${SERIF}`;
  ctx.fillText(`${champ.score}${cfg.unit}`, cx, py + 150);
  const d = champ.at ? new Date(champ.at) : null;
  if (d && !isNaN(d)) {
    ctx.fillStyle = '#6a5f70'; ctx.font = `400 18px 'Noto Sans KR', sans-serif`;
    ctx.fillText(`${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 즉위`, cx, py + 180);
  }

  // 하단 바
  ctx.fillStyle = '#1c2748'; ctx.fillRect(0, CARD_H - 92, CARD_W, 92);
  ctx.fillStyle = '#ffd166'; ctx.font = `28px ${ROUND}`;
  ctx.fillText('이 왕좌, 빼앗을 수 있을까?', cx, CARD_H - 50);
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.font = `400 17px 'Noto Sans KR', sans-serif`;
  ctx.fillText('헬로 대부도 오락실 · daebugame.com', cx, CARD_H - 20);
  return c;
}

function blobToBase64(blob) {
  return new Promise((ok, fail) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = fail; r.readAsDataURL(blob); });
}

function toast(text) {
  const t = document.getElementById('toast');
  t.textContent = text; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2600);
}

async function shareThroneCard(cfg, champ, btn) {
  track('throne_card_share', { game: cfg.key });
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '카드 만드는 중…';
  try {
    const canvas = await buildThroneCard(cfg, champ);
    const blob = await new Promise((ok) => canvas.toBlob(ok, 'image/png'));
    if (!blob) throw new Error('no blob');
    const hallUrl = `${SITE}/hall-of-fame.html?g=${cfg.key}`;
    const gameUrl = `${SITE}/${cfg.href}`;

    // 1) 카카오톡
    if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
      try {
        const up = await fetch('/api/kakao-upload', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imageBase64: await blobToBase64(blob) }),
        });
        if (up.ok) {
          const { url } = await up.json();
          window.Kakao.Share.sendDefault({
            objectType: 'feed',
            content: {
              title: `👑 ${champ.nickname}님, ${cfg.name} 제${champ.reign || 1}대 왕좌에 오르다! (${champ.score}${cfg.unit})`,
              description: '헬로 신전에 이름이 새겨졌어요. 이 왕좌, 빼앗을 수 있을까요?',
              imageUrl: url,
              link: { mobileWebUrl: hallUrl, webUrl: hallUrl },
            },
            buttons: [
              { title: '왕좌 빼앗으러 가기', link: { mobileWebUrl: gameUrl, webUrl: gameUrl } },
              { title: '신전 구경하기', link: { mobileWebUrl: hallUrl, webUrl: hallUrl } },
            ],
          });
          toast('카카오톡 공유창을 열었어요 👑');
          return;
        }
      } catch (e) { /* 아래 폴백으로 */ }
    }
    // 2) 기기 공유 시트
    const file = new File([blob], `throne-${cfg.key}.png`, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: `${cfg.name} 왕좌 카드`, text: `${champ.nickname}님이 ${cfg.name} 왕좌에 올랐어요! ${hallUrl}` });
        toast('공유했어요 👑');
        return;
      } catch (e) { if (e && e.name === 'AbortError') return; }
    }
    // 3) 이미지 저장
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = u; a.download = `throne-${cfg.key}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(u), 4000);
    toast('왕좌 카드를 이미지로 저장했어요');
  } catch (e) {
    toast('카드를 만들지 못했어요. 잠시 후 다시 눌러 주세요.');
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
}

load();
</script>

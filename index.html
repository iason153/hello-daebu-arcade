<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-5YPGVVP49T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag("js", new Date());
  gtag("config", "G-5YPGVVP49T");
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>헬로 대부도 오락실</title>
<meta name="description" content="대부도 곳곳을 배경으로 한 가벼운 미니게임들. 첫 번째 게임 헬로버드를 지금 바로 즐겨보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0f1a30;
    --navy-card:#1a2947;
    --navy-card-dim:#16213a;
    --coral:#ff6b4a;
    --gold:#ffc857;
    --teal:#2ec4b6;
    --cream:#f6efe0;
    --dim:#8fa0c4;
    --line: rgba(246,239,224,0.1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--navy-deep);
    color:var(--cream);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.6;
    overflow-x:hidden;
  }
  .display{ font-family:'Jua', sans-serif; }

  a{ color:inherit; }
  img{ max-width:100%; display:block; }

  .wrap{ max-width:640px; margin:0 auto; padding:0 24px; }

  /* ---------- hero ---------- */
  .hero{
    padding:56px 24px 40px;
    text-align:center;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, rgba(255,107,74,0.18), transparent 60%),
      var(--navy-deep);
  }
  .hero .eyebrow-free-title{
    font-family:'Jua', sans-serif;
    font-size:clamp(32px, 8vw, 44px);
    letter-spacing:-0.01em;
    color:var(--cream);
  }
  .hero .title-accent{ color:var(--coral); }
  .hero p.tagline{
    margin-top:14px;
    color:var(--dim);
    font-size:16px;
    max-width:38ch;
    margin-left:auto; margin-right:auto;
  }

  .cabinet{
    margin:36px auto 0;
    max-width:280px;
    position:relative;
  }
  .cabinet-frame{
    background:linear-gradient(160deg, #24345c, #16213a);
    border-radius:22px;
    padding:14px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px var(--line);
    animation: floaty 5s ease-in-out infinite;
  }
  .cabinet-frame img{
    border-radius:12px;
    width:100%;
    display:block;
  }
  @keyframes floaty{
    0%,100%{ transform: translateY(0) rotate(-1.2deg); }
    50%{ transform: translateY(-10px) rotate(1deg); }
  }

  /* ---------- section headings ---------- */
  .section{ padding:8px 24px 48px; }
  .section h2{
    font-family:'Jua', sans-serif;
    font-size:22px;
    margin-bottom:18px;
    color:var(--cream);
  }

  /* ---------- featured game ---------- */
  .game-featured{
    background:var(--navy-card);
    border-radius:20px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .game-featured .shot{
    aspect-ratio: 900 / 514;
    background:#0c1526;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .game-featured .shot img{ width:100%; height:100%; object-fit:cover; }
  .game-featured .body{ padding:22px 22px 24px; }
  .game-featured h3{
    font-family:'Jua', sans-serif;
    font-size:24px;
    margin-bottom:8px;
  }
  .game-featured p{
    color:var(--dim);
    font-size:15px;
    margin-bottom:18px;
  }
  .btn-play{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--gold);
    color:#2a1c00;
    font-family:'Jua', sans-serif;
    font-size:17px;
    padding:13px 26px;
    border-radius:999px;
    text-decoration:none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 0 0 #c99425;
  }
  .btn-play:active{
    transform: translateY(6px);
    box-shadow: 0 2px 0 0 #c99425;
  }

  /* ---------- teaser (coming soon) ---------- */
  .game-teaser{
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 18px;
    border-radius:16px;
    border:1px dashed var(--line);
    color:var(--dim);
  }
  .game-teaser .icon{
    width:44px; height:44px;
    border-radius:10px;
    background:var(--navy-card-dim);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    flex-shrink:0;
  }
  .game-teaser .txt strong{
    display:block;
    color:var(--cream);
    font-family:'Jua', sans-serif;
    font-size:16px;
    font-weight:normal;
    margin-bottom:2px;
  }
  .game-teaser .txt span{ font-size:13px; }

  /* ---------- cross links ---------- */
  .crosslinks p.lead{ color:var(--dim); font-size:15px; margin-bottom:16px; }
  .linklist{ display:flex; flex-direction:column; gap:10px; }
  .linklist a{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:var(--navy-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px 18px;
    text-decoration:none;
  }
  .linklist .name{
    font-family:'Jua', sans-serif;
    font-size:16px;
  }
  .linklist .desc{
    font-size:13px;
    color:var(--dim);
    margin-top:2px;
  }
  .linklist .go{
    font-size:20px;
    color:var(--teal);
  }

  footer{
    text-align:center;
    padding:20px 24px 40px;
    color:var(--dim);
    font-size:12px;
  }

  @media (min-width:520px){
    .hero{ padding:72px 24px 48px; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <h1 class="eyebrow-free-title">헬로 대부도<br><span class="title-accent">오락실</span></h1>
    <p class="tagline">대부도 곳곳을 배경으로 한 아주 가벼운 미니게임들을 하나씩 만들고 있어요.</p>
    <div class="cabinet">
      <div class="cabinet-frame">
        <img src="games/hello-bird/assets/start_screen.png" alt="헬로버드 시작 화면" loading="eager">
      </div>
    </div>
  </div>
</section>

<section class="section">
  <div class="wrap">
    <h2>지금 할 수 있는 게임</h2>

    <div class="game-featured">
      <div class="shot">
        <img src="assets/thumb-hellobird.png" alt="헬로버드 — 시화방조제에서 방아머리로 향하는 포탈 장면" loading="lazy">
      </div>
      <div class="body">
        <h3>헬로버드</h3>
        <p>시화방조제부터 탄도항까지, 대부도 다섯 곳을 날아서 통과하는 플래피버드 스타일 게임이에요.</p>
        <a class="btn-play" href="games/hello-bird/">플레이하기</a>
      </div>
    </div>

    <div class="game-teaser">
      <div class="icon">🏃</div>
      <div class="txt">
        <strong>헬로런 · 준비 중</strong>
        <span>매일 날씨에 따라 장애물이 달라지는 원버튼 러너</span>
      </div>
    </div>
  </div>
</section>

<section class="section crosslinks">
  <div class="wrap">
    <h2>대부도를 더 알아보고 싶다면</h2>
    <p class="lead">게임 말고도 대부도 소식과 실시간 정보를 이 두 곳에서 확인할 수 있어요.</p>
    <div class="linklist">
      <a href="https://daebutalk.com" target="_blank" rel="noopener">
        <div>
          <div class="name">헬로대부도</div>
          <div class="desc">대부도 소식과 이야기</div>
        </div>
        <div class="go">↗</div>
      </a>
      <a href="https://daebuseatime.com" target="_blank" rel="noopener">
        <div>
          <div class="name">대부도타임</div>
          <div class="desc">지금 물때·날씨 확인하기</div>
        </div>
        <div class="go">↗</div>
      </a>
    </div>
  </div>
</section>

<footer>© 헬로 대부도 오락실</footer>

</body>
</html>

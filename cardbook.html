<style>
  :root {
    --night: #0b0f24; --night-2: #141a3a; --panel: #1b2249; --line: rgba(255, 233, 168, 0.16);
    --gold: #f2c14e; --gold-deep: #c9922c; --cream: #fff6d5; --dim: #9aa3c7; --rose: #ff7ad9; --sky: #8fd6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; background: #0b0f24; }
  body {
    min-height: 100vh; color: var(--cream); font-family: 'Noto Sans KR', sans-serif; line-height: 1.55;
    background:
      radial-gradient(ellipse 120% 46% at 50% -6%, rgba(242, 193, 78, 0.28), transparent 62%),
      radial-gradient(ellipse 80% 40% at 100% 30%, rgba(143, 214, 255, 0.10), transparent 60%),
      radial-gradient(ellipse 80% 40% at 0% 60%, rgba(255, 122, 217, 0.09), transparent 60%),
      linear-gradient(180deg, var(--night-2), var(--night) 46%);
    background-attachment: fixed; overflow-x: hidden;
  }
  /* 밤하늘 별 */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: 0.55;
    background-image:
      radial-gradient(1.4px 1.4px at 12% 18%, #fff, transparent 60%), radial-gradient(1.2px 1.2px at 78% 9%, #fff, transparent 60%),
      radial-gradient(1.6px 1.6px at 43% 31%, #ffe9a8, transparent 60%), radial-gradient(1.1px 1.1px at 91% 44%, #fff, transparent 60%),
      radial-gradient(1.3px 1.3px at 22% 62%, #fff, transparent 60%), radial-gradient(1.5px 1.5px at 64% 73%, #cfe6ff, transparent 60%),
      radial-gradient(1.1px 1.1px at 8% 88%, #fff, transparent 60%), radial-gradient(1.4px 1.4px at 85% 90%, #ffe9a8, transparent 60%);
    animation: twinkle 5s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.35; } to { opacity: 0.7; } }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
  .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 0 16px 72px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 2px 0; font-size: 13px; }
  .topbar a { text-decoration: none; color: var(--dim); font-weight: 700; padding: 6px 2px; }
  .topbar a:hover { color: var(--cream); }

  header.book { text-align: center; padding: 18px 0 8px; }
  .laurel { font-size: 13px; letter-spacing: 0.34em; color: var(--gold); font-weight: 700; }
  h1 { font-family: 'Gowun Batang', serif; font-weight: 700; font-size: clamp(30px, 9vw, 40px); line-height: 1.15; margin-top: 4px;
    background: linear-gradient(180deg, #fff6d5 10%, #f2c14e 60%, #c9922c); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 2px 10px rgba(242, 193, 78, 0.35)); }
  .owner { margin-top: 10px; font-family: 'Jua', sans-serif; font-size: 21px; word-break: break-all; }
  .owner small { font-family: 'Noto Sans KR', sans-serif; font-size: 13px; color: var(--dim); font-weight: 500; }
  .meta { margin-top: 4px; font-size: 12px; color: var(--dim); }
  .meta b { color: var(--cream); font-weight: 700; }

  .progress { margin: 16px auto 0; max-width: 340px; }
  .progress .bar { height: 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.09); border: 1px solid var(--line); overflow: hidden; }
  .progress .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #c9922c, #f2c14e, #fff6d5); box-shadow: 0 0 12px rgba(242, 193, 78, 0.7); transition: width 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .progress .num { margin-top: 6px; font-family: 'Jua', sans-serif; font-size: 16px; }
  .progress .num b { font-size: 24px; color: var(--gold); }
  .titles { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .st-sub a { color: var(--dim); }
  .badge-master { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 900; color: #3a2a10;
    background: linear-gradient(90deg, #ff7ad9, #ffd76a, #8fd6ff, #b8ff9a); }

  .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .btn { border: 1.5px solid var(--line); background: rgba(255, 255, 255, 0.06); color: var(--cream); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: rgba(255, 255, 255, 0.12); }
  .btn.gold { background: linear-gradient(180deg, #ffd76a, #e6a92a); color: #3a2a10; border-color: #fff0b8; box-shadow: 0 4px 0 #a8741a; }
  .btn.kakao { background: #fee500; color: #191600; border-color: #fee500; font-size: 15px; padding: 13px 22px; box-shadow: 0 4px 0 #c9b400; }
  .btn.naver { background: #03c75a; color: #fff; border-color: #03c75a; box-shadow: 0 4px 0 #028a3f; }
  .btn.small { font-size: 12px; padding: 6px 12px; }

  /* 카드 격자 */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 12px; }
  .st-sub { font-family: 'Noto Sans KR', sans-serif; font-size: 12px; color: var(--dim); font-weight: 500; }
  @media (min-width: 520px) { .grid { grid-template-columns: repeat(3, 1fr); } }

  .card { position: relative; aspect-ratio: 2 / 3; border-radius: 16px; border: 0; padding: 0; background: #10152f; color: inherit; width: 100%;
    transform-style: preserve-3d; transform: perspective(700px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg));
    transition: transform 0.25s ease; --c: #cfd6e2; --a: #f4f6fa; --b: #9aa6b8; --mx: 50%; --my: 50%;
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 10px 24px rgba(0, 0, 0, 0.5); overflow: hidden; display: block; text-align: left; }
  .card.rare { --c: #ffc93c; --a: #fff3b0; --b: #e0a010; }
  .card.legend { --c: #ff7ad9; --a: #ff7ad9; --b: #8fd6ff; }
  .card.owned { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4), 0 0 22px color-mix(in srgb, var(--c) 70%, transparent), 0 12px 26px rgba(0, 0, 0, 0.55); animation: bob 5s ease-in-out infinite; }
  .card.owned:nth-child(2n) { animation-delay: -2.3s; }
  .card.owned:nth-child(3n) { animation-delay: -1.1s; }
  @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -4px; } }
  .card .art { position: absolute; inset: 0; background: radial-gradient(circle at 50% 38%, #fff 0%, color-mix(in srgb, var(--c) 40%, #fff) 45%, color-mix(in srgb, var(--c) 65%, #6b5a2a) 100%); }
  .card .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .art img.block { object-fit: contain; inset: 14% 8% 30% 8%; width: 84%; height: 56%; filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.35)); }
  .card .frame { position: absolute; inset: 0; border-radius: 16px; border: 6px solid transparent; pointer-events: none;
    background: linear-gradient(135deg, var(--a), var(--b), var(--a), var(--b)) border-box;
    -webkit-mask: linear-gradient(#000 0 0) padding-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  .card.legend .frame { background: linear-gradient(135deg, #ff7ad9, #ffd76a, #8fd6ff, #b8ff9a, #ff7ad9) border-box; background-size: 300% 300%; animation: rainbow 6s linear infinite; }
  @keyframes rainbow { to { background-position: 300% 300%; } }
  .card .top { position: absolute; left: 11px; right: 11px; top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75); }
  .card .grade { background: var(--c); padding: 2px 8px; border-radius: 999px; text-shadow: 0 1px 1px rgba(0, 0, 0, 0.35); }
  .card .plate { position: absolute; left: 6px; right: 6px; bottom: 6px; padding: 26px 8px 9px; text-align: center; border-radius: 0 0 10px 10px;
    background: linear-gradient(to top, rgba(16, 12, 36, 0.94) 48%, rgba(16, 12, 36, 0)); }
  .card .name { font-family: 'Jua', sans-serif; font-size: clamp(18px, 5.4vw, 23px); color: var(--cream); text-shadow: 0 0 10px var(--c), 0 2px 3px #000; line-height: 1.1; }
  .card .title { font-size: 11px; color: #ffe9a8; font-weight: 700; }
  /* 홀로그램 반짝임 — 손가락·마우스 위치를 따라 움직임 */
  .card .holo { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: color-dodge; opacity: 0.55;
    background:
      radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, 0.85), transparent 38%),
      linear-gradient(115deg, transparent 20%, rgba(255, 160, 230, 0.55) 38%, rgba(140, 220, 255, 0.55) 50%, rgba(184, 255, 154, 0.5) 62%, transparent 80%);
    background-size: 100% 100%, 240% 240%; background-position: 0 0, var(--mx) var(--my); }
  .card .sweep { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: screen;
    background: linear-gradient(115deg, transparent 34%, rgba(255, 255, 255, 0.7) 48%, transparent 62%); background-size: 280% 100%; animation: sweep 4.2s ease-in-out infinite; }
  .card:nth-child(2n) .sweep { animation-delay: -1.6s; }
  .card:nth-child(3n) .sweep { animation-delay: -2.9s; }
  @keyframes sweep { 0%, 35% { background-position: 140% 0; } 80%, 100% { background-position: -140% 0; } }

  /* 아직 못 얻은 카드 */
  .card.locked { background: linear-gradient(160deg, #1a2148, #0d1128); border: 1.5px dashed rgba(255, 233, 168, 0.28); box-shadow: none; }
  .card.locked .art { background: none; }
  .card.locked .art img { object-fit: contain; inset: 16% 10% 34% 10%; width: 80%; height: 50%; filter: brightness(0) drop-shadow(0 0 10px rgba(143, 214, 255, 0.35)); opacity: 0.55; }
  .card.locked .q { position: absolute; inset: 0 0 34% 0; display: flex; align-items: center; justify-content: center; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 44px; color: rgba(255, 233, 168, 0.5); }
  .card.locked .plate { background: none; }
  .card.locked .name { color: var(--dim); text-shadow: none; }
  .card.locked .title { color: #7f88ad; font-weight: 500; }

  .plaza-top { margin-top: 22px; padding: 14px 0 12px 14px; border-radius: 18px; background: linear-gradient(160deg, rgba(242, 193, 78, 0.14), rgba(143, 214, 255, 0.07)); border: 1px solid var(--line); text-align: left; }
  .plaza-top .hd { display: flex; align-items: baseline; justify-content: space-between; padding-right: 14px; }
  .plaza-top .hd b { font-family: 'Gowun Batang', serif; font-size: 18px; color: var(--gold); }
  .plaza-top .hd a { font-size: 12px; color: var(--dim); font-weight: 700; }
  .plaza-top .sub { font-size: 12px; color: var(--dim); margin-top: 2px; padding-right: 14px; }
  .plaza-row { display: flex; gap: 10px; overflow-x: auto; padding: 12px 14px 6px 0; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; }
  .plaza-row::-webkit-scrollbar { height: 4px; } .plaza-row::-webkit-scrollbar-thumb { background: rgba(255, 233, 168, 0.3); border-radius: 4px; }
  .pz { flex: none; width: 78px; text-decoration: none; text-align: center; scroll-snap-align: start; }
  .pz .th { position: relative; width: 66px; height: 99px; margin: 0 auto; border-radius: 9px; overflow: hidden; border: 3px solid #cfd6e2; background: linear-gradient(160deg, #1a2148, #0d1128); box-shadow: 0 4px 10px rgba(0, 0, 0, 0.45); display: grid; place-items: center; color: rgba(255, 233, 168, 0.5); font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 26px; }
  .pz .th.rare { border-color: #ffc93c; box-shadow: 0 0 12px rgba(255, 201, 60, 0.55); } .pz .th.legend { border-color: #ff7ad9; box-shadow: 0 0 14px rgba(255, 122, 217, 0.7); }
  .pz .th.none { border-style: dashed; border-color: rgba(255, 233, 168, 0.3); box-shadow: none; }
  .pz .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .pz .nm { margin-top: 5px; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pz .ct { font-size: 11px; color: var(--gold); font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pz.me .nm::after { content: " (나)"; color: var(--sky); }
  /* 카드 뒤집기 */
  .flip { position: relative; width: 100%; aspect-ratio: 2 / 3; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.3, 0.9, 0.3, 1.1); cursor: pointer; }
  .flip.turned { transform: rotateY(180deg); }
  .flip .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flip .face.back { transform: rotateY(180deg); border-radius: 20px; overflow: hidden; padding: 9px; background: linear-gradient(135deg, var(--a, #f4f6fa), var(--b, #9aa6b8)); box-shadow: 0 0 26px color-mix(in srgb, var(--vc, #f2c14e) 70%, transparent), 0 12px 26px rgba(0, 0, 0, 0.55); }
  .back-in { height: 100%; border-radius: 13px; padding: 16px 14px 12px; background: radial-gradient(ellipse 120% 60% at 50% 0%, rgba(242, 193, 78, 0.25), transparent 60%), linear-gradient(180deg, #1b2249, #0b0f24); display: flex; flex-direction: column; text-align: center; color: var(--cream); overflow: hidden; }
  .back-in .em { font-family: 'Gowun Batang', serif; font-size: 11px; letter-spacing: 0.3em; color: var(--gold); }
  .back-in .nm { font-family: 'Jua', sans-serif; font-size: 24px; margin-top: 2px; }
  .back-in .quote { margin-top: 10px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 16px; line-height: 1.4; color: #ffe9a8; }
  .back-in .quote::before { content: "“"; } .back-in .quote::after { content: "”"; }
  .back-in .stats { margin: 12px auto 0; display: grid; grid-template-columns: auto auto; gap: 4px 10px; font-size: 13px; text-align: left; }
  .back-in .stats b { color: var(--dim); font-weight: 500; } .back-in .stats span { color: var(--gold); letter-spacing: 2px; }
  .back-in .secret { margin-top: 12px; padding: 9px 10px; border-radius: 10px; background: rgba(255, 255, 255, 0.07); font-size: 12.5px; line-height: 1.5; color: #dfe4f7; text-align: left; }
  .back-in .secret i { display: block; font-style: normal; font-size: 11px; color: var(--rose); font-weight: 700; margin-bottom: 2px; }
  .back-in .rec { margin-top: auto; padding-top: 8px; font-size: 11.5px; color: var(--dim); border-top: 1px dashed var(--line); }
  .flip-hint { margin-top: 10px; font-size: 12px; color: var(--dim); }
  /* 방명록 */
  .notes { display: grid; gap: 10px; margin-top: 4px; }
  .note-item { padding: 12px 13px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); }
  .note-item.hidden-note { opacity: 0.55; }
  .who { display: flex; align-items: baseline; gap: 8px; font-size: 12px; color: var(--dim); }
  .who a { color: var(--gold); font-weight: 700; font-size: 14px; text-decoration: none; }
  .who .x { margin-left: auto; background: none; border: 0; color: var(--dim); font-size: 13px; padding: 4px 6px; }
  .note-item .txt { margin-top: 3px; font-size: 15px; word-break: break-word; white-space: pre-wrap; }
  .replies { margin-top: 10px; display: grid; gap: 6px; }
  .reply { padding: 8px 10px; border-left: 3px solid rgba(255, 233, 168, 0.35); background: rgba(255, 255, 255, 0.04); border-radius: 0 10px 10px 0; }
  .reply.owner { border-left-color: var(--gold); background: rgba(242, 193, 78, 0.09); }
  .reply .txt { font-size: 14px; }
  .note-item .ops { margin-top: 6px; display: flex; gap: 14px; }
  .note-item .ops button { background: none; border: 0; color: var(--dim); font-size: 12px; text-decoration: underline; padding: 6px 0; }
  .composer { margin: 4px 0 12px; }
  .note-item .composer { margin: 8px 0 0; }
  .composer textarea { width: 100%; min-height: 56px; resize: none; padding: 12px 14px; border-radius: 14px; border: 1.5px solid var(--line); background: rgba(255, 255, 255, 0.07); color: var(--cream); font: inherit; font-size: 15px; line-height: 1.5; }
  .composer textarea::placeholder { color: #7f88ad; }
  .composer .row { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; }
  .composer .cnt { font-size: 12px; color: var(--dim); }
  .composer .btn:disabled { opacity: 0.5; }
  .diag { margin-top: 22px; padding: 12px 14px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); font-size: 13px; color: #dfe4f7; }
  .diag summary { cursor: pointer; font-weight: 700; color: var(--cream); }
  .diag p { margin-top: 8px; }
  .diag .btn { margin-top: 10px; }
  .section-title { margin: 34px 0 10px; font-family: 'Gowun Batang', serif; font-weight: 700; font-size: 20px; color: var(--gold); display: flex; align-items: center; gap: 10px; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }
  .note { font-size: 13px; color: var(--dim); }

  .collectors { list-style: none; display: grid; gap: 8px; }
  .collectors a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); text-decoration: none; }
  .collectors a:hover { background: rgba(255, 255, 255, 0.1); }
  .collectors .rk { font-family: 'Gowun Batang', serif; font-weight: 700; color: var(--gold); width: 26px; text-align: center; }
  .collectors .nm { flex: 1; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .collectors .dots { display: flex; gap: 3px; }
  .collectors .dots { flex-wrap: wrap; max-width: 150px; justify-content: flex-end; }
  .collectors .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); }
  .collectors .dots i.on { background: var(--gold); box-shadow: 0 0 6px rgba(242, 193, 78, 0.8); }
  .collectors .ct { font-family: 'Jua', sans-serif; color: var(--cream); min-width: 38px; text-align: right; }

  /* 처음 온 사람 안내 */
  .welcome { text-align: center; padding: 20px 6px 4px; }
  .welcome p { margin-top: 10px; color: #cfd5ee; font-size: 15px; }
  .welcome .fan { position: relative; height: 250px; margin: 22px auto 14px; width: 260px; }
  .welcome .fan .card { position: absolute; width: 124px; left: 68px; top: 6px; animation: none; }
  .welcome .fan .card:nth-child(1) { transform: rotate(-16deg) translate(-70px, 14px); }
  .welcome .fan .card:nth-child(2) { transform: rotate(0deg) translate(0, -4px); z-index: 2; }
  .welcome .fan .card:nth-child(3) { transform: rotate(16deg) translate(70px, 14px); }
  .howto { text-align: left; margin: 22px auto 0; max-width: 380px; display: grid; gap: 8px; }
  .howto div { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: #dfe4f7; }
  .howto b { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #3a2a10; display: grid; place-items: center; font-size: 13px; }

  /* 크게 보기 */
  .viewer { position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center; flex-direction: column; padding: 18px; background: rgba(5, 7, 20, 0.9); overflow: hidden; }
  .viewer { overflow-y: auto; justify-content: safe center; }
  .viewer.show { display: flex; animation: fade 0.25s ease both; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .viewer .rays { position: fixed; left: 50%; top: 44%; width: 220vmax; height: 220vmax; margin: -110vmax 0 0 -110vmax; pointer-events: none;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === 'text') n.textContent = v;
    else if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  kids.flat().forEach((c) => { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
let toastTimer = null;

// ---------- 카드 한 장 ----------
function cardNode(god, owned, opts) {
  const img = el('img', { alt: '', loading: 'lazy', decoding: 'async' });
  if (owned) {
    img.src = ART(god.key);
    img.addEventListener('error', () => { if (!img.classList.contains('block')) { img.classList.add('block'); img.src = BLOCK(god.key); } }, { once: false });
  } else if (god.secret) {
    img.hidden = true; // 비밀 카드는 실루엣도 보여 주지 않음
  } else {
    img.src = BLOCK(god.key);
  }
  const node = el((opts && opts.static) ? 'div' : 'button', {
    class: `card ${god.grade} ${owned ? 'owned' : 'locked'}`,
    'aria-label': owned ? `${god.name} 카드 크게 보기` : `아직 얻지 못한 카드. ${howToGet(god)}`,
  },
    el('div', { class: 'art' }, img),
    owned ? null : el('div', { class: 'q', text: '?' }),
    owned ? el('div', { class: 'holo' }) : null,
    owned ? el('div', { class: 'sweep' }) : null,
    el('div', { class: 'top' }, el('span', { text: cardNo(god) }), owned ? el('span', { class: 'grade', text: GRADE_LABEL[god.grade] }) : null),
    el('div', { class: 'plate' },
      el('div', { class: 'name', text: owned ? god.name : '???' }),
      el('div', { class: 'title', text: owned ? god.title : god.short ? god.short : (god.series === 'friend' ? `${god.need}층을 쌓으면` : `${god.need}층을 넘으면`) })),
    el('div', { class: 'frame' }),
  );
  if (owned) attachTilt(node, 9);
  return node;
}
// 손가락·마우스를 따라 카드가 기울고 반짝임이 움직임
function attachTilt(node, maxDeg) {
  const move = (e) => {
    const r = node.getBoundingClientRect();
    const x = Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1), y = Math.min(Math.max((e.clientY - r.top) / r.height, 0), 1);
    node.style.setProperty('--ry', ((x - 0.5) * 2 * maxDeg).toFixed(1) + 'deg');
    node.style.setProperty('--rx', ((0.5 - y) * 2 * maxDeg).toFixed(1) + 'deg');
    node.style.setProperty('--mx', (x * 100).toFixed(0) + '%');
    node.style.setProperty('--my', (y * 100).toFixed(0) + '%');
  };
  const reset = () => { node.style.setProperty('--rx', '0deg'); node.style.setProperty('--ry', '0deg'); node.style.setProperty('--mx', '50%'); node.style.setProperty('--my', '50%'); };
  node.addEventListener('pointermove', move);
  node.addEventListener('pointerleave', reset);
  node.addEventListener('pointerup', reset);
}

  if (w && w.isMine) {

async function api(path, opts) {

  let data = null; try { data = await r.json(); } catch (e) {}
  return { ok: r.ok, status: r.status, data: data || {} };
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

  if (nick == null) return;
  const r = await post('/api/wallet', { action: 'nick', nick });

async function withdraw() {
  if (!confirm('정말 탈퇴할까요? 카드첩과 모은 카드가 모두 지워지고 되돌릴 수 없어요.')) return;

// 공유 이미지 — 가진 카드 중 가장 귀한 카드(번호가 가장 높은 카드) 그림. 카드가 없으면 카드첩 대표 이미지.
function shareImage(w, g) {
  let top = g || bestOf((k) => !!(w.cards && w.cards[k]));
  if (top && top.fb && !MUNCH_ART_READY) top = null; // 먼치 카드 그림이 아직 없으면 대표 이미지로
  if (top) return { imageUrl: `https://daebugame.com/assets/cards/${top.key}.webp`, imageWidth: 640, imageHeight: 960 };
  return { imageUrl: 'https://daebugame.com/assets/cards/share.jpg', imageWidth: 1200, imageHeight: 630 };
}
// 자랑용 주소 — /c/카드첩주소 (붙여 넣으면 이름과 카드 그림이 미리보기로 뜸). g를 주면 그 카드 한 장을 자랑.
const shareUrl = (w, g) => `${location.origin}/c/${encodeURIComponent(w.wid)}${g ? '?g=' + g.key : ''}`;
const shareTitle = (w, g) => (g ? `${w.nick}님이 '${g.name}' 카드를 얻었어요!` : `${w.nick}님의 올림포스 카드첩 (${w.count}/${w.total}장)`);
async function share(w, g) {
  const url = shareUrl(w, g), title = shareTitle(w, g);
  track('cardbook_share', { count: w.count, to: 'kakao', card: g ? g.key : '' });
  try {
    if (window.Kakao && window.Kakao.isInitialized()) {
      window.Kakao.Share.sendDefault({
        objectType: 'feed',
        content: Object.assign({ title, description: '헬로타워에서 모은 카드를 구경하러 오세요!', link: { mobileWebUrl: url, webUrl: url } }, shareImage(w, g)),
        buttons: [{ title: '카드첩 구경하기', link: { mobileWebUrl: url, webUrl: url } }],
      });
      return;
    }
  } catch (e) {}
  try { if (navigator.share) { await navigator.share({ title, url }); return; } } catch (e) { return; }
  try { await navigator.clipboard.writeText(url); toast('카드첩 주소를 복사했어요!'); } catch (e) { prompt('아래 주소를 복사하세요', url); }
}

// 카페 글에 그대로 붙여 넣을 문장 복사
async function copyBrag(w, g) {
  const text = `${shareTitle(w, g)}\n${g ? `전체 ${w.cards[g.key].serial}번째로 얻은 ${g.name} 카드예요.` : '헬로타워에서 모은 카드를 구경하러 오세요.'}\n${shareUrl(w, g)}`;
  try { await navigator.clipboard.writeText(text); toast('자랑 글을 복사했어요. 카페 글쓰기에 붙여 넣으세요!'); } catch (e) { prompt('아래 글을 복사하세요', text); }
  track('cardbook_share', { to: 'copy', card: g ? g.key : '' });
}

// ---------- 방명록 — 회원끼리 카드첩에 글을 남기고(여러 줄), 누구나 답글을 이어 단다 ----------
function notesSection(w) {
  const wrap = el('section', { id: 'notes' });
  const list = el('div', { class: 'notes' });
  const adminHdr = () => { let pw = ''; try { pw = sessionStorage.getItem('ht_admin') || ''; } catch (e) {} return pw ? { 'x-admin-secret': pw } : {}; };
  const call = async (body) => {
    const r = await api('/api/wallet', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, adminHdr()), body: JSON.stringify(Object.assign({ w: w.wid }, body)) });
    if (r.ok && r.data.notes) { w.notes = r.data.notes; draw(); } else toast(r.data.message || '처리하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    return r.ok;
  };
  const who = (x) => el('a', { href: '/cardbook.html?w=' + encodeURIComponent(x.from), title: '이 사람의 카드첩 구경하기' }, (x.nick || w.nick) + (x.isOwner ? ' 👑' : ' 🎴'));
  // 글자 수를 세어 주는 입력 칸(여러 줄). Enter는 줄바꿈, 버튼으로 보냄.
  function composer(placeholder, max, label, onSend) {
    const ta = el('textarea', { rows: '2', maxlength: String(max), placeholder, 'aria-label': placeholder });
    const cnt = el('span', { class: 'cnt', text: `0/${max}` });
    const btn = el('button', { class: 'btn gold small' }, label);
    ta.addEventListener('input', () => { cnt.textContent = `${ta.value.length}/${max}`; ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 180) + 'px'; });
    btn.addEventListener('click', async () => { const t = ta.value.trim(); if (!t) { ta.focus(); return; } btn.disabled = true; const ok = await onSend(t); btn.disabled = false; if (ok) { ta.value = ''; cnt.textContent = `0/${max}`; ta.style.height = 'auto'; } });
    return el('div', { class: 'composer' }, ta, el('div', { class: 'row' }, cnt, btn));
  }
  const openReply = new Set(); // 답글 입력 칸을 열어 둔 글
  function draw() {
    list.textContent = '';
    const total = w.notes.reduce((a, n) => a + 1 + n.replies.length, 0);
    title.textContent = `방명록 · ${total}`;
    if (!w.notes.length) { list.appendChild(el('p', { class: 'note', text: w.isMine ? '아직 방명록이 없어요. 인사말을 먼저 남기거나, 카드첩을 자랑해 친구들을 불러 보세요.' : '첫 방명록을 남겨 보세요!' })); return; }
    w.notes.forEach((n) => {
      const ops = el('div', { class: 'ops' });
      if (n.canReply) ops.appendChild(el('button', { onclick: () => { if (openReply.has(n.id)) openReply.delete(n.id); else openReply.add(n.id); draw(); } }, openReply.has(n.id) ? '답글 닫기' : `답글 달기${n.replies.length ? ' (' + n.replies.length + ')' : ''}`));
      if (n.canDelete) ops.appendChild(el('button', { onclick: () => { if (confirm('이 글을 지울까요? 달린 답글도 함께 지워져요.')) call({ action: 'note_delete', id: n.id }); } }, '지우기'));
      if (n.canReport) ops.appendChild(el('button', { onclick: () => { if (confirm('이 글을 신고할까요? 여러 명이 신고하면 글이 가려져요.')) call({ action: 'note_report', id: n.id }).then((ok) => { if (ok) toast('신고했어요.'); }); } }, '신고'));
      const replies = n.replies.length ? el('div', { class: 'replies' }, n.replies.map((r) => el('div', { class: 'reply' + (r.isOwner ? ' owner' : '') },
        el('div', { class: 'who' }, who(r), el('span', { text: fmtDate(r.at) }), r.canDelete ? el('button', { class: 'x', title: '답글 지우기', 'aria-label': '답글 지우기', onclick: () => { if (confirm('이 답글을 지울까요?')) call({ action: 'note_reply_delete', id: n.id, rid: r.id }); } }, '✕') : null),
        el('div', { class: 'txt', text: r.text })))) : null;
      list.appendChild(el('div', { class: 'note-item' + (n.hidden ? ' hidden-note' : '') },
        el('div', { class: 'who' }, who(n), el('span', { text: fmtDate(n.at) + (n.hidden ? ' · 신고로 가려진 글' : '') })),
        el('div', { class: 'txt', text: n.text }),
        replies,
        ops.childNodes.length ? ops : null,
        openReply.has(n.id) ? composer('답글 (200자)', 200, '답글', (t) => call({ action: 'note_reply', id: n.id, text: t }).then((ok) => { if (ok) track('note_reply', {}); return ok; })) : null));
    });
  }
  const title = el('h2', { class: 'section-title', text: '방명록' });
  wrap.appendChild(title);
  if (!w.loggedIn) {
    wrap.appendChild(el('p', { class: 'note', style: 'margin:-4px 0 10px' }, '방명록은 오락실 회원만 남길 수 있어요. ', el('a', { href: loginUrl('/cardbook.html?w=' + w.wid), style: 'color:var(--gold);font-weight:700' }, '카카오 로그인')));
  } else {
    wrap.appendChild(composer(w.isMine ? '내 카드첩에 인사말 남기기 (300자, 여러 줄 가능)' : `${w.nick}님에게 한마디 (300자, 여러 줄 가능)`, 300, '남기기', (t) => call({ action: 'note', text: t }).then((ok) => { if (ok) track('note_write', {}); return ok; })));
  }
  wrap.appendChild(list);
  draw();
  return wrap;
}

// "카드가 안 보여요" 확인 창 — 이 기기에 저장된 카드와 카드첩(서버)에 있는 카드를 나란히 보여준다
function diagNode(w) {
  const local = localCards();
  const names = (has) => GODS.filter(has).map((g) => g.name).join(', ') || '없음';
  const box = el('details', { class: 'diag' },
    el('summary', { text: '카드를 얻었는데 안 보이나요?' }),
    el('p', {}, '이 기기에 저장된 카드: ', el('b', { text: names((g) => local[g.key]) })),
    el('p', {}, '카드첩에 보관된 카드: ', el('b', { text: names((g) => w.cards[g.key]) })),
    el('p', { class: 'note', text: '카드는 게임을 한 그 기기·그 브라우저에 먼저 저장돼요. 카페 앱 안에서 게임을 했다면 카드첩도 같은 앱 안에서 열어 로그인해야 옮겨져요. 테스트 모드(?test=1)에서 얻은 카드는 저장되지 않아요.' }),
    el('button', { class: 'btn small', onclick: async () => {
      const claims = GODS.filter((g) => local[g.key] && !w.cards[g.key]).map((g) => ({ god: g.key, floor: g.need, at: local[g.key].at }));
      if (!claims.length) { toast('옮길 카드가 없어요. 이 기기에는 새 카드가 없어요.'); return; }
      const c = await post('/api/wallet', { action: 'claim', cards: claims });
      if (c.ok && c.data.added && c.data.added.length) { toast(`카드 ${c.data.added.length}장을 옮겼어요!`); load(); } else toast('옮기지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    } }, '이 기기의 카드 다시 옮기기'));
  return box;
}

// ---------- 시작 ----------
async function load() {
  const params = new URLSearchParams(location.search);
  const login = params.get('login');
  const w = (params.get('w') || '').toLowerCase();
  if (login) {
    params.delete('login');
    history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : ''));
    if (login === 'cancel') toast('로그인을 취소했어요.');
    else if (login !== 'ok') toast('로그인하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
  }
  let r = await api('/api/wallet' + (w ? '?w=' + encodeURIComponent(w) : ''));
  if (r.status === 404) { app.textContent = ''; app.appendChild(el('div', { class: 'skeleton' }, '이 카드첩을 찾을 수 없어요.', el('br'), el('a', { href: '/cardbook.html', class: 'btn', style: 'margin-top:14px' }, '카드첩 첫 화면으로'))); return; }
  if (!r.ok) { app.textContent = ''; app.appendChild(el('div', { class: 'skeleton', text: '카드첩을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.' })); return; }
  if (!w && r.data.loggedIn === false) {
    const me = await api('/api/auth');
    renderWelcome(me.data.ready);
    return;
  }
  // 내 카드첩이면, 이 기기에 임시 보관 중이던 카드를 카드첩으로 옮김
  if (r.data.isMine) {
    const local = localCards();
    const claims = GODS.filter((g) => local[g.key] && !r.data.cards[g.key]).map((g) => ({ god: g.key, floor: g.need, at: local[g.key].at }));
    if (claims.length) {
      const c = await post('/api/wallet', { action: 'claim', cards: claims });
      if (c.ok && c.data.added && c.data.added.length) {
        toast(`이 기기에 있던 카드 ${c.data.added.length}장을 카드첩에 옮겼어요!`);
        track('cards_migrated', { count: c.data.added.length });
        r = await api('/api/wallet');
      }
    }
    if (login === 'ok') track('login_ok', {});
  }
  renderBook(r.data);
}
load();
</script>

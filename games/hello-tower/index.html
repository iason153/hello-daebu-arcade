<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헬로타워 | 헬로 대부도 오락실</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #7ec8e3;
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    touch-action: manipulation;
    -webkit-user-select: none; user-select: none;
  }
  #gameCanvas {
    display: block;
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  #loadingOverlay {
    position: fixed; inset: 0; z-index: 999;
    background-color: #20aefd; /* 새 섬네일의 하늘색과 맞춤(레터박스 여백이 자연스럽게 이어지게) */
    background-image: url('assets/bg/thumbnail.jpg');
    background-size: contain; background-repeat: no-repeat; background-position: top center;
    display: flex; align-items: flex-end; justify-content: center;
    padding-bottom: 12%; box-sizing: border-box;
    transition: opacity 0.4s ease;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadingSpinner {
    width: 34px; height: 34px; border-radius: 50%;
    border: 5px solid rgba(255,255,255,0.45);
    border-top-color: #fff;
    animation: loadingSpin 0.8s linear infinite;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  @keyframes loadingSpin { to { transform: rotate(360deg); } }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 14px 16px; box-sizing: border-box; pointer-events: none; z-index: 10;
  }
  #floorCounter {
    background: rgba(0,0,0,0.35); color: #fff; font-weight: 800;
    font-size: 22px; padding: 6px 16px; border-radius: 20px;
    letter-spacing: 0.5px;
  }
  #devBtn {
    pointer-events: auto; background: rgba(0,0,0,0.35); color: #fff;
    border: none; border-radius: 50%; width: 36px; height: 36px; font-size: 18px;
  }
  #skipFloorBtn {
    pointer-events: auto; background: rgba(0,0,0,0.5); color: #fff;
    border: none; border-radius: 14px; padding: 6px 12px; font-size: 13px; font-weight: 700;
  }
  #hint {
    position: fixed; bottom: 24px; left: 0; right: 0; text-align: center;
    color: #fff; font-weight: 700; font-size: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.4);
    pointer-events: none; z-index: 10; transition: opacity 0.4s; opacity: 0;
  }

  #milestone {
    position: fixed; top: 26%; left: 0; right: 0; text-align: center;
    pointer-events: none; z-index: 15; opacity: 0;
    font-size: 44px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2.5px rgba(70,40,10,0.85);
    text-shadow: 0 0 22px rgba(255,214,110,1), 0 0 44px rgba(255,180,60,0.7), 0 3px 8px rgba(0,0,0,0.7);
  }
  #milestone.show { animation: milestonePop 1.3s cubic-bezier(0.22, 1.4, 0.36, 1) forwards; }
  @keyframes milestonePop {
    0%   { opacity: 0; transform: scale(0.3) translateY(10px); }
    12%  { opacity: 1; transform: scale(1.35) translateY(0); }
    22%  { transform: scale(0.95); }
    30%  { transform: scale(1.08); }
    38%  { transform: scale(1); }
    78%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.1) translateY(-14px); }
  }

  #overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; z-index: 20; text-align: center;
  }
  #overlay.show { display: flex; }
  #overlay h1 { font-size: 28px; margin: 0 0 6px; }
  #overlay .finalFloor { font-size: 48px; font-weight: 900; margin: 6px 0 18px; }
  #overlay button {
    background: #ffcc33; border: none; border-radius: 24px; padding: 12px 32px;
    font-size: 17px; font-weight: 800; color: #333; box-shadow: 0 4px 0 #cc9900;
  }
  #overlay button:active { transform: translateY(2px); box-shadow: 0 2px 0 #cc9900; }
  #overlay #shareBtn {
    background: #2a2f45; color: #fff; font-size: 14px; padding: 10px 28px;
    box-shadow: 0 4px 0 #14172488; margin-top: 4px;
  }
  #overlay #shareBtn:active { box-shadow: 0 2px 0 #14172488; }
  #overlay.ending {
    background: radial-gradient(circle, rgba(255,236,168,0.5), rgba(120,70,20,0.75));
  }
  #overlay.ending h1 { color: #fff6d5; text-shadow: 0 0 14px #ffdb7d, 0 2px 6px rgba(0,0,0,0.5); }
  #overlay.ending .finalFloor { color: #ffe9a8; text-shadow: 0 0 12px #ffcf6b; }

  #rankLinkBtn {
    position: fixed; top: env(safe-area-inset-top, 0px); left: 0; margin: 14px 0 0 14px;
    z-index: 25; display: flex; align-items: center; gap: 5px;
    padding: 7px 14px 7px 10px; border-radius: 999px;
    background: rgba(0,0,0,0.45); border: 1.5px solid rgba(255,200,87,0.55);
    color: #ffe9b8; font-weight: 800; font-size: 13px; text-decoration: none;
    white-space: nowrap;
  }

  #rankPanel {
    width: 250px; max-width: 80vw; margin-top: 14px;
    background: rgba(10,14,24,0.92); border-radius: 12px; padding: 12px;
    text-align: left;
  }
  #rankPanel .rankPanelLabel { font-size: 12px; margin-bottom: 6px; color: #ffc857; font-weight: 800; }
  #rankPanel input {
    width: 100%; box-sizing: border-box; padding: 8px; border-radius: 6px;
    border: none; margin-bottom: 6px; font-size: 13px;
  }
  #rankPanel button {
    width: 100%; padding: 9px; border: none; border-radius: 8px;
    background: #ffc857; color: #2a1c00; font-weight: 800; font-size: 13px;
  }
  #rankMsg { font-size: 11px; margin-top: 6px; color: rgba(255,255,255,0.8); min-height: 14px; }

  .overlayLink {
    display: block; width: 250px; max-width: 80vw; box-sizing: border-box;
    text-align: center; margin-top: 10px; padding: 11px 0; border-radius: 999px;
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.3);
    color: #fff; font-weight: 700; font-size: 13px; text-decoration: none;
  }
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="loadingOverlay">
  <div id="loadingSpinner"></div>
</div>

<div id="hud">
  <div id="floorCounter">0층</div>
  <button id="skipFloorBtn" style="display:none;">+10층 스킵</button>
  <button id="devBtn" style="display:none;">⚙</button>
</div>
<a id="rankLinkBtn" href="./ranking.html">🏆 랭킹 확인</a>
<div id="hint">화면을 탭해서 조각을 떨어뜨리세요</div>
<div id="milestone"></div>

<div id="overlay">
  <h1 id="overlayTitle">타워가 무너졌어요!</h1>
  <div class="finalFloor" id="finalFloorNum">0층</div>
  <button id="retryBtn">다시 하기</button>
  <button id="shareBtn">📤 친구에게 자랑하기!</button>
  <div id="rankPanel">
    <div class="rankPanelLabel">🏆 이벤트 랭킹 등록</div>
    <input id="rankNickname" placeholder="닉네임" maxlength="12">
    <input id="rankContact" placeholder="카카오톡 ID (당첨 연락용)" maxlength="30">
    <button id="rankSubmitBtn">기록 등록하기</button>
    <div id="rankMsg"></div>
  </div>
  <a class="overlayLink" href="./ranking.html">🏆 랭킹 확인</a>
  <a class="overlayLink" href="../../index.html">🏠 오락실로 돌아가기</a>
</div>

<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
// 카카오톡 공유용 SDK 초기화 — 헬로런/헬로버드랑 같은 daebugame.com 앱 키 그대로 재사용
try {
  if (window.Kakao && !window.Kakao.isInitialized()) {
    window.Kakao.init('3994a3bda3b8146e709683fdb350c9cc');
  }
} catch (e) {
  console.warn('[헬로타워] Kakao 초기화 실패:', e);
}

/* =========================================================================
   헬로타워 — 물리 기반 균형쌓기 게임
   진행 상태(2026-09-20 세션): Matter.js 세팅 + 9종 캐릭터 물리 바디 정의
                              + 좌우 시계추 왕복/탭 드롭 조작
                              + 세로 카메라 스크롤 + 층수 카운터
   다음 세션 TODO: 기울기 감지 떨림/땀 이펙트, 날씨 연동(/api/weather),
                  하늘 전환(맑음→노을→별밤), 돌풍 이벤트,
                  랭킹 제출(/api/score, game:'hello_tower') + 카카오 공유
   ========================================================================= */

// ---------- ?dev=1 일 때만 설정 버튼 노출 (오락실 표준 패턴) ----------
// [테스트 중] 물리박스 접촉 여부를 확실히 확인하기 위해 지금은 항상 디버그 테두리 표시
const DEBUG_MODE = false; // 버셀 배포 앞두고 끔(디버그 박스/층수 스킵 버튼 숨김) — 필요하면 다시 true로
if (new URLSearchParams(location.search).get('dev') === '1') {
  document.getElementById('devBtn').style.display = 'block';
}

// ---------- Matter.js 세팅 ----------
const { Engine, World, Bodies, Body, Composite, Vector, Events } = Matter;

const engine = Engine.create();
engine.gravity.y = 3.2; // 더 더 박진감 있게 — 계속 루즈하다는 피드백이라 확 올림
const world = engine.world;

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// [수정] 헬로런/헬로버드와 같은 방식으로 변경 — "반응형"으로 화면 비율마다 내부 크기를
// 다시 계산하지 않고, 고정 해상도(GAME_W x GAME_H)로 통째로 그린 다음 화면에 맞춰
// 레터박스(중앙 정렬 + 균일 축소)로 보여준다. 그래야 어떤 기기에서든 바닥/블록 배치가
// 항상 똑같이 보임(예전 방식은 화면 비율에 따라 GAME_H가 계속 바뀌어서 기기마다
// 바닥이 잘리거나 늘어나 보일 수 있었음).
const GAME_W = 380;
const GAME_H = 820; // 고정값(더 이상 리사이즈마다 재계산 안 함)

canvas.width = GAME_W;
canvas.height = GAME_H;

function fixCanvasSize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw / GAME_W, vh / GAME_H) * 0.98;
  canvas.style.width = (GAME_W * scale) + 'px';
  canvas.style.height = (GAME_H * scale) + 'px';
}
window.addEventListener('resize', fixCanvasSize);
[100, 300, 600, 1200].forEach(ms => setTimeout(fixCanvasSize, ms));
fixCanvasSize();

// ---------- 바닥(시작 발판) ----------
const GROUND_H = 110; // 바닥 그림이 차지하는 고정 높이(게임 유닛) — 화면비와 무관하게 항상 동일
const GROUND_Y = GAME_H - GROUND_H; // 우리 게임의 "바닥 그림이 시작되는 윗선"(물리 지면 기준)
// [버그였던 부분] 헬로버드 원본 코드의 GROUND_Y는 "화면 맨 아래"(= GAME_H)를 뜻하는데,
// 우리 GROUND_Y는 "바닥 그림 윗선"이라 의미가 다름. 배경 레이어 공식은 원본 그대로
// 베꼈으니, 원본과 같은 기준점(화면 맨 아래)을 따로 둬서 그 공식에 넣어야 함 —
// 안 그러면 GROUND_H(110)만큼 정확히 떠 보이게 됨(실제로 그랬음).
const SCREEN_BOTTOM = GAME_H;
const ground = Bodies.rectangle(GAME_W / 2, GROUND_Y + 20, GAME_W * 2, 40, {
  isStatic: true,
  friction: 0.9,
  label: 'ground'
});
World.add(world, ground);

// =========================================================================
// 캐릭터 스펙 (물리 바디 + 그림 정의)
//
// [새 에셋 파이프라인] 헬로/꽃게부터 새 방식 적용 시작 — 이제 이미지는 "가이드
// 캔버스 크기(px)"로 통째로 받고, 전역 배율 K(=1게임유닛당 6px)와 고정 여백
// (위24px/아래60px/좌우60px)만으로 물리박스 위치를 계산한다. 블록마다 다른 배율을
// 따로 구하지 않으므로(=boxFrac 방식 폐기) 테두리 두께·여백이 항상 일관됨.
// 아직 새 그림을 못 받은 나머지는 기존 boxFrac 방식을 그대로 유지(canvas 필드 없음).
// =========================================================================
const IMG_SCALE_K = 6;      // 1 게임유닛 = 6 그림픽셀
const MARGIN_TOP = 24;      // 위쪽 여백(px) — 벼슬/더듬이 등
const MARGIN_BOTTOM = 60;   // 아래쪽 여백(px) — 발/집게 등 (겹침량과 일치)
const MARGIN_SIDE = 60;     // 좌우 여백(px) — 날개/집게 등

// [크기 다양화] 처음에 드렸던 물리박스 가로/세로 수치 차이만으로 다양성을 준다.
// (한때 캐릭터별 확대/축소 배율을 추가했었는데, 그림 전체를 같이 키우고 줄이다 보니
// 테두리 두께가 블록마다 다시 달라지는 부작용이 있어서 없앰 — 처음 스펙대로 복구)
const PIECES = {
  hello: {
    file: 'assets/blocks/hello.png',
    fileImpact: 'assets/blocks_impact/hello.png',
    shape: 'rect', w: 90, h: 110,
    canvas: { w: 660, h: 744 }
  },
  starfish: {
    file: 'assets/blocks/starfish.png',
    fileImpact: 'assets/blocks_impact/starfish.png',
    shape: 'rect', w: 130, h: 80,
    canvas: { w: 900, h: 564 }
  },
  gull: {
    file: 'assets/blocks/gull.png',
    fileImpact: 'assets/blocks_impact/gull.png',
    shape: 'rect', w: 140, h: 70,
    canvas: { w: 960, h: 504 }
  },
  crab: {
    file: 'assets/blocks/crab.png',
    fileImpact: 'assets/blocks_impact/crab.png',
    shape: 'rect', w: 120, h: 85,
    canvas: { w: 840, h: 594 }
  },
  conch: {
    file: 'assets/blocks/conch.png',
    fileImpact: 'assets/blocks_impact/conch.png',
    shape: 'rect', w: 60, h: 130,
    canvas: { w: 480, h: 864 }
  },
  shell: {
    file: 'assets/blocks/shell.png',
    fileImpact: 'assets/blocks_impact/shell.png',
    shape: 'rect', w: 135, h: 65,
    canvas: { w: 930, h: 474 }
  },

  // ---- 특이 블록 2종 ----
  // [수정] 둘 다 실제로 받은 그림이 가이드의 사각형 몸통 구역을 그대로 채운 형태라
  // (평행사변형/돔 모양이 아님) 물리 모양도 단순 사각형으로 맞춤 — 그래야 그림/물리가
  // 정확히 일치하고, 윗면이 좁아서 그 위에 쌓기 힘든 문제도 같이 해결됨.
  goby: {
    file: 'assets/blocks/goby.png',
    fileImpact: 'assets/blocks_impact/goby.png',
    shape: 'rect', w: 125, h: 60,
    canvas: { w: 870, h: 444 }
  },
  jellyfish: {
    file: 'assets/blocks/jellyfish.png',
    fileImpact: 'assets/blocks_impact/jellyfish.png',
    shape: 'rect', w: 110, h: 75,
    canvas: { w: 780, h: 534 }
  },

  // ---- 신규 4종 — 표정 없는 순수 재질 블록(각목/기둥, 낡은블록/미니, 통나무/롱바, 판자).
  // 표정이 없어서 idle/impact 구분이 없고 같은 그림을 그대로 씀. ----
  pillar: {
    file: 'assets/blocks/pillar.png',
    fileImpact: 'assets/blocks_impact/pillar.png',
    shape: 'rect', w: 40, h: 150,
    canvas: { w: 360, h: 984 }
  },
  mini: {
    file: 'assets/blocks/mini.png',
    fileImpact: 'assets/blocks_impact/mini.png',
    shape: 'rect', w: 55, h: 55,
    canvas: { w: 450, h: 414 }
  },
  longbar: {
    file: 'assets/blocks/longbar.png',
    fileImpact: 'assets/blocks_impact/longbar.png',
    shape: 'rect', w: 100, h: 45,
    canvas: { w: 720, h: 354 }
  },
  plank: {
    file: 'assets/blocks/plank.png',
    fileImpact: 'assets/blocks_impact/plank.png',
    shape: 'rect', w: 150, h: 38,
    canvas: { w: 1020, h: 312 }
  }
};
// 새 에셋(12종, idle/impact 각 2장씩) 전부 받았으니 다시 전부 등장하게 복구.
const PIECE_KEYS = Object.keys(PIECES);

// ---------- 스프라이트 이미지 프리로드 (평소용 + 착지 임팩트용 둘 다) ----------
const sprites = {};
const spritesImpact = {};
let spritesLoaded = 0;
PIECE_KEYS.forEach(key => {
  const img = new Image();
  img.src = PIECES[key].file;
  img.onload = () => spritesLoaded++;
  sprites[key] = img;

  const imgImpact = new Image();
  imgImpact.src = PIECES[key].fileImpact;
  spritesImpact[key] = imgImpact;
});

// ---------- 배경(바닥) — 도로 그림(자동차 등)은 헬로버드의 중경과 역할이 겹쳐서(둘 다
// "장면") 중복돼 보였음. 헬로버드 원래 구조대로 "바닥"은 단순 반복 텍스처(꽃밭) 하나로,
// "장면"은 원경/랜드마크/중경이 전담하도록 되돌림. ----------
// [수정] 세로 높이를 자유롭게 그려올 수 있도록 방식을 바꿈 — 더 이상 GROUND_H(110)에
// 억지로 맞춰 늘리지 않는다. 가로 폭은 항상 GAME_W에 꽉 차게, 세로는 원본 이미지의
// 가로세로 비율 그대로 유지한 채 화면 맨 아래에 딱 붙여서 그림(투명 배경이라 그림이
// GROUND_H보다 커도/작아도 자연스럽게 하늘과 이어짐).
//
// [스테이션별 랜덤 바닥] 지역별로 여러 장 그려오시면, 게임 시작할 때 이 목록 중
// 하나를 무작위로 골라서 씀 — 목록에 파일 경로만 추가하면 바로 반영됨.
const GROUND_BG_OPTIONS = [
  'assets/bg/ground_simple.png', // 바다 전망(방파제)
  'assets/bg/ground_2.png',      // 테마파크(풍차)

// ---------- 층수 구간별 난이도 단계 ----------
// [압축] 180층 목표는 너무 길어서 지루하다는 피드백 — "신의 영역"(엔딩)을
// 100층으로 압축. 초반(~12층)은 그대로 관대하게 둬서 진입장벽은 낮게, 후반으로
// 갈수록 점점 어려워져서 끝까지 가는 건 실력+운이 다 따라야 하는 수준으로.
const DIFFICULTY_STAGES = [
  { floor: 0,   frictionMul: 1.0,  tiltDeg: 32 },
  { floor: 12,  frictionMul: 0.88, tiltDeg: 29 },
  { floor: 24,  frictionMul: 0.76, tiltDeg: 26 },
  { floor: 38,  frictionMul: 0.64, tiltDeg: 23 },
  { floor: 52,  frictionMul: 0.54, tiltDeg: 20 },
  { floor: 68,  frictionMul: 0.46, tiltDeg: 18 },
  { floor: 84,  frictionMul: 0.40, tiltDeg: 16 },
  { floor: 100, frictionMul: 0.35, tiltDeg: 14 },
];
function difficultyStage(floor) {
  let stage = DIFFICULTY_STAGES[0];
  for (const s of DIFFICULTY_STAGES) {
    if (floor >= s.floor) stage = s;
  }
  return stage;
}

// ---------- 물리 바디 생성 함수 ----------
function makeBody(type, x, y) {
  const spec = PIECES[type];
  const mult = spec.sizeMultiplier || 1;
  const pw = spec.w * mult, ph = spec.h * mult; // 실제 물리박스 크기(크기 배율 반영)
  const stage = difficultyStage(floorCount); // 지금 층수 기준 난이도 단계
  const fricOpts = {
    friction: 1.5 * stage.frictionMul,
    frictionStatic: 2.0 * stage.frictionMul,
    frictionAir: 0.035 * stage.frictionMul
  };
  let body;

  if (spec.shape === 'rect') {
    body = Bodies.rectangle(x, y, pw, ph, fricOpts);

  } else if (spec.shape === 'parallelogram') {
    // 평행사변형 vertices (현재 사용하는 블록 없음 — 추후 대비 보존)
    const skew = ph * Math.tan((spec.skewDeg || 0) * Math.PI / 180);
    const hw = pw / 2, hh = ph / 2;
    const verts = [
      { x: -hw + skew, y: -hh },
      { x:  hw + skew, y: -hh },
      { x:  hw - skew, y:  hh },
      { x: -hw - skew, y:  hh }
    ];
    body = Bodies.fromVertices(x, y, [verts], fricOpts, true);

  } else if (spec.shape === 'dome') {
    // 아랫변 평평 + 정수리 평평 + 옆면 둥근 근사 다각형 (해파리)
    const hw = pw / 2, hh = ph / 2;
    const topHalf = hw * spec.topFlatFrac;
    const verts = [
      { x: -topHalf, y: -hh },
      { x:  topHalf, y: -hh },
      { x:  hw,       y:  hh * 0.15 },
      { x:  hw * 0.8, y:  hh },
      { x: -hw * 0.8, y:  hh },
      { x: -hw,       y:  hh * 0.15 }
    ];
    body = Bodies.fromVertices(x, y, [verts], fricOpts, true);

  }

  body.tiltLimitRad = stage.tiltDeg * Math.PI / 180; // 이 블록이 스폰될 때의 층수 기준 난이도로 고정

  body.pieceType = type;
  // 이제 진짜로 회전 가능(위 세 블록 모두). 대신 안착 판정 쪽에서 "많이 걸쳤으면
  // 확정 고정, 많이 삐져나왔으면 진짜 물리로 버티거나 넘어가게" 난이도를 조절한다.
  return body;
}

// ---------- 구름 ----------
// [원리] 구름을 "카메라를 따라가지 않는, 게임 세계에 고정된 위치"에 심어둔다.

// 자연스럽게 "흘러 내려가는" 것처럼 보인다 — 구름을 직접 움직이는 코드는 필요 없음.
let clouds = []; // { worldY, x, size, drift }
let highestCloudSpawnedY = GROUND_Y; // 이 y보다 위쪽엔 아직 구름을 안 심었다는 기준선

function maybeSpawnClouds() {
  // 구름층 위(고도 높은 층)에서는 구름 자체가 없어야 하니, 일정 층수 이상에서는
  // 더 이상 새 구름을 안 심는다(이미 심어둔 건 자연스럽게 흘러 내려가며 사라짐).
  if (floorCount >= CLOUD_CEILING_FLOOR) return;
  // 카메라가 올라간 만큼(=탑이 높아진 만큼) 위쪽에 구름을 계속 채워 넣는다
  const spawnAheadTo = towerTopY - GAME_H * 1.5; // 화면보다 한참 위쪽까지 미리 심어둠
  while (highestCloudSpawnedY > spawnAheadTo) {
    highestCloudSpawnedY -= 170 + Math.random() * 260; // 90~230 → 170~430, 훨씬 더 넓게 분산
    // 모양을 몇 가지 프로필로 다양화: 뭉게뭉게(lobe 많음)/납작하고 넓음/작고 동글동글
    const shapeRoll = Math.random();
    let lobeCount, stretchX, stretchY;
    if (shapeRoll < 0.34) { lobeCount = 5; stretchX = 1.0; stretchY = 0.5; }       // 뭉게구름
    else if (shapeRoll < 0.67) { lobeCount = 3; stretchX = 1.6; stretchY = 0.4; }  // 납작하고 긴 구름
    else { lobeCount = 4; stretchX = 0.75; stretchY = 0.7; }                       // 작고 동글동글
    clouds.push({
      worldY: highestCloudSpawnedY,
      x: Math.random() * GAME_W,
      size: 20 + Math.random() * 32,
      drift: (Math.random() - 0.5) * 4, // 살짝 옆으로도 흘러가게
      lobeCount, stretchX, stretchY,
      seed: Math.random() * 1000
    });
  }
  // 화면에서 한참 벗어난(아래로 많이 지나간) 구름은 배열에서 정리
  const cleanupBelow = towerTopY + GAME_H * 2;
  clouds = clouds.filter(c => c.worldY < cleanupBelow);
}

function drawClouds() {
  ctx.save();
  for (const c of clouds) {
    const y = c.worldY - cameraY;
    if (y < -100 || y > GAME_H + 100) continue; // 화면 밖이면 스킵
    const x = c.x;
    const w = c.size * c.stretchX, h = c.size * c.stretchY;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    // 중앙 몸통
    ctx.ellipse(x, y, w, h, 0, 0, Math.PI * 2);
    // 로브(뭉치)를 좌우로 lobeCount개만큼 흩뿌려서 매번 다른 실루엣이 되게
    for (let i = 0; i < c.lobeCount; i++) {
      const ang = (i / c.lobeCount) * Math.PI - Math.PI / 2;
      const lobeR = w * (0.35 + 0.25 * Math.sin(c.seed + i));
      const lx = x + Math.cos(ang) * w * 0.65;
      const ly = y + Math.sin(ang) * h * 0.5 + h * 0.15;
      ctx.ellipse(lx, ly, lobeR, lobeR * 0.72, 0, 0, Math.PI * 2);
    }
    ctx.fill();
  }
  ctx.restore();
}

// ---------- 하늘 단계(층수 기준) — 맑은 하늘 → 구름 위(대기권) → 성층권 → 우주 ----------
// [재압축] 180층은 너무 길다는 피드백 — 엔딩(100층) 기준으로 다시 맞춤.
// 0~11층: 맑은 하늘 / 11~22층: 구름층 근접 / 22~33층: 구름 위(대기권)

// 67~78층: 우주 진입 / 78층~: 완전한 우주
const CLOUD_CEILING_FLOOR = 22; // 이 층수부터는 새 구름이 안 생김("구름 위"로 올라왔다는 뜻)
const SKY_STAGES = [
  { floor: 0,   top: '#8fd3f4', bottom: '#c9f0ff' },  // 맑은 하늘
  { floor: 11,  top: '#8fd3f4', bottom: '#eaf8ff' },  // 구름층 근접, 살짝 밝아짐
  { floor: 22,  top: '#cdeaff', bottom: '#f8fcff' },  // 구름 위(대기권), 뽀얗게 밝음
  { floor: 33,  top: '#9db8ec', bottom: '#dce8ff' },  // 대기 옅어지며 다시 파랗게
  { floor: 44,  top: '#4a63b8', bottom: '#a7bdea' },  // 성층권, 짙은 파랑
  { floor: 56,  top: '#1c2456', bottom: '#4a5698' },  // 대기권 끝자락, 어두워짐
  { floor: 67,  top: '#05071c', bottom: '#161c46' },  // 우주 진입
  { floor: 78,  top: '#000008', bottom: '#050512' },  // 완전한 우주
  { floor: 89,  top: '#3a2f6e', bottom: '#c98bd6' },  // 우주 너머 — 신비로운 보랏빛 여명(천국 예고)
  { floor: 100, top: '#ffe9a8', bottom: '#fff6d5' },  // 천국 — 황금빛으로 가득한 하늘
];
const HEAVEN_FLOOR = 100; // 이 층수에 도달하면 엔딩(신들의 환영) — 드물지만 너무 길지는 않게

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}
function lerpColor(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  const r = Math.round(a.r + (b.r - a.r) * t);
  const g = Math.round(a.g + (b.g - a.g) * t);
  const bl = Math.round(a.b + (b.b - a.b) * t);
  return `rgb(${r},${g},${bl})`;
}
function getSkyColors(floor) {
  let lo = SKY_STAGES[0], hi = SKY_STAGES[SKY_STAGES.length - 1];
  for (let i = 0; i < SKY_STAGES.length - 1; i++) {
    if (floor >= SKY_STAGES[i].floor && floor <= SKY_STAGES[i + 1].floor) {
      lo = SKY_STAGES[i]; hi = SKY_STAGES[i + 1];
      break;
    }
  }
  if (floor <= SKY_STAGES[0].floor) return { top: lo.top, bottom: lo.bottom };
  if (floor >= SKY_STAGES[SKY_STAGES.length - 1].floor) {
    const last = SKY_STAGES[SKY_STAGES.length - 1];
    return { top: last.top, bottom: last.bottom };
  }
  const span = hi.floor - lo.floor;
  const t = span > 0 ? (floor - lo.floor) / span : 0;
  return { top: lerpColor(lo.top, hi.top, t), bottom: lerpColor(lo.bottom, hi.bottom, t) };
}

function spawnBirdFlock(worldY) {

  for (let i = 0; i < count; i++) {
    const side = i % 2 === 0 ? 1 : -1;
    const rank = Math.ceil(i / 2);
    travelers.push({
      type: 'bird', worldY: worldY + rank * 10 * side * 0.4 + rank * 3,
      xOffset: (baseX + rank * 16 * side + GAME_W) % GAME_W,
      speed, flapSeed: flapSeedBase + i * 3,
      size: 7 + Math.random() * 2
    });
  }
}
function spawnPlane(worldY) {
  travelers.push({
    type: 'plane', worldY,
    xOffset: Math.random() * GAME_W,
    speed: (Math.random() < 0.5 ? -1 : 1) * (34 + Math.random() * 16),
    size: 13 + Math.random() * 5
  });
}
function spawnShip(worldY) {
  travelers.push({
    type: 'ship', worldY,
    xOffset: Math.random() * GAME_W,
    speed: (Math.random() < 0.5 ? -1 : 1) * (26 + Math.random() * 18),
    blinkSeed: Math.random() * 1000,
    size: 10 + Math.random() * 5
  });
}

function maybeSpawnTravelers() {
  const spawnAheadTo = towerTopY - GAME_H * 1.5;
  while (highestTravelerSpawnedY > spawnAheadTo) {
    highestTravelerSpawnedY -= 90 + Math.random() * 150; // 예전(260~640)보다 훨씬 촘촘하게
    const worldY = highestTravelerSpawnedY;
    const f = worldYToFloor(worldY);
    if (f <= BIRD_MAX_FLOOR) {
      if (Math.random() < 0.035) spawnBirdFlock(worldY);      // 22%→3.5%, 아주 가끔만 철새 무리
      else spawnBird(worldY, Math.random() < 0.15);           // 가끔 가까이 나는 큰 새
    } else if (f >= PLANE_MIN_FLOOR && f <= PLANE_MAX_FLOOR) {
      if (Math.random() < 0.12) spawnPlane(worldY);           // 0.55→0.12, 훨씬 드물게
    } else if (f >= SHIP_MIN_FLOOR && f <= SHIP_MAX_FLOOR) {
      if (Math.random() < 0.12) spawnShip(worldY);            // 비행기랑 같은 빈도로 맞춤
    }
  }
  const cleanupBelow = towerTopY + GAME_H * 2;
  travelers = travelers.filter(t => t.worldY < cleanupBelow);
}

function drawTravelers() {
  if (travelers.length === 0) return;
  ctx.save();
  const now = performance.now();
  for (const t of travelers) {
    const y = t.worldY - cameraY;
    if (y < -40 || y > GAME_H + 40) continue;
    const x = ((t.xOffset + (now / 1000) * t.speed) % (GAME_W + 80) + (GAME_W + 80)) % (GAME_W + 80) - 40;

    if (t.type === 'bird') {
      const flap = Math.sin(now * 0.01 + t.flapSeed) * 0.6;
      ctx.strokeStyle = 'rgba(70,70,80,0.75)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x - t.size, y - flap * t.size);
      ctx.lineTo(x, y);
      ctx.lineTo(x + t.size, y - flap * t.size);
      ctx.stroke();
    } else if (t.type === 'plane') {
      const dir = t.speed > 0 ? 1 : -1;
      ctx.save();
      ctx.translate(x, y);
      // 옅은 비행운(진행 방향 반대쪽으로 꼬리처럼)
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-dir * t.size * 2.6, 0);
      ctx.lineTo(-dir * t.size * 1.0, 0);
      ctx.stroke();
      // 비행기 실루엣: 동체(진행방향 뾰족한 긴 몸통) + 날개(가로 크로스) + 꼬리날개
      ctx.fillStyle = 'rgba(225,230,240,0.95)';
      ctx.strokeStyle = 'rgba(85,90,105,0.9)';
      ctx.lineWidth = 1;
      const s = t.size;
      // 동체
      ctx.beginPath();
      ctx.moveTo(dir * s * 1.15, 0);          // 기수(코)
      ctx.lineTo(dir * s * 0.25, -s * 0.11);
      ctx.lineTo(-dir * s * 0.95, -s * 0.09);
      ctx.lineTo(-dir * s * 1.1, 0);           // 꼬리 끝
      ctx.lineTo(-dir * s * 0.95, s * 0.09);
      ctx.lineTo(dir * s * 0.25, s * 0.11);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // 주날개(동체 중앙 살짝 앞쪽에서 좌우로 크게)
      ctx.beginPath();
      ctx.moveTo(dir * s * 0.05, -s * 0.06);
      ctx.lineTo(-dir * s * 0.15, -s * 0.95);
      ctx.lineTo(-dir * s * 0.35, -s * 0.95);
      ctx.lineTo(-dir * s * 0.2, -s * 0.06);
      ctx.lineTo(-dir * s * 0.2, s * 0.06);
      ctx.lineTo(-dir * s * 0.35, s * 0.95);
      ctx.lineTo(-dir * s * 0.15, s * 0.95);
      ctx.lineTo(dir * s * 0.05, s * 0.06);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // 꼬리날개(작게, 동체 뒤쪽)
      ctx.beginPath();
      ctx.moveTo(-dir * s * 0.75, -s * 0.04);
      ctx.lineTo(-dir * s * 0.95, -s * 0.32);
      ctx.lineTo(-dir * s * 1.02, -s * 0.32);
      ctx.lineTo(-dir * s * 0.9, -s * 0.04);
      ctx.lineTo(-dir * s * 0.9, s * 0.04);
      ctx.lineTo(-dir * s * 1.02, s * 0.32);
      ctx.lineTo(-dir * s * 0.95, s * 0.32);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    } else if (t.type === 'ship') {
      const blink = Math.sin(now * 0.006 + t.blinkSeed) > 0.4;
      ctx.save();
      ctx.translate(x, y);
      // 캡슐형 우주선
      ctx.fillStyle = 'rgba(210,220,235,0.95)';
      ctx.strokeStyle = 'rgba(80,90,110,0.9)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.ellipse(0, 0, t.size, t.size * 0.45, 0, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.beginPath();
      ctx.arc(0, -t.size * 0.15, t.size * 0.35, Math.PI, 0);
      ctx.fillStyle = 'rgba(140,220,255,0.85)';
      ctx.fill();
      if (blink) {
        ctx.fillStyle = '#ff5c5c';
        ctx.beginPath();
        ctx.arc(t.size * 0.75, 0, 1.6, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }
  }
  ctx.restore();
}

// ---------- 천국(HEAVEN_FLOOR 근처) — 신 캐릭터 그림 받기 전까지의 임시 연출 ----------
// 40층 근처부터 황금빛 빛줄기가 은은하게 뻗어나오는 정도로만 예고. 실제 신 캐릭터
// 그림 받으면 이 자리에 세계좌표 고정 방식(구름/새와 동일)으로 넣을 예정.
function drawHeavenGlow() {
  if (floorCount < 38) return;
  const t = Math.min((floorCount - 38) / (HEAVEN_FLOOR - 38), 1);
  ctx.save();
  ctx.globalAlpha = t * 0.5;
  const cx = GAME_W / 2, cy = GAME_H * 0.3;
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, GAME_H * 0.7);
  grad.addColorStop(0, 'rgba(255,246,210,0.9)');
  grad.addColorStop(1, 'rgba(255,246,210,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, GAME_W, GAME_H);
  const now = performance.now();
  ctx.globalAlpha = t * 0.35;
  ctx.strokeStyle = '#fff3c4';
  ctx.lineWidth = 3;
  for (let i = 0; i < 10; i++) {
    const ang = (i / 10) * Math.PI * 2 + now * 0.0002;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(ang) * GAME_H * 0.8, cy + Math.sin(ang) * GAME_H * 0.8);
    ctx.stroke();
  }
  ctx.restore();
}

// ---------- 배경음악 — 하늘 단계(고도)에 맞춰 5곡을 자동으로 교체(크로스페이드) ----------
const BGM_STAGES = [
  { floor: 0,  src: 'assets/bgm/bg1.mp3' },
  { floor: 22, src: 'assets/bgm/bg2.mp3' },
  { floor: 44, src: 'assets/bgm/bg3.mp3' },
  { floor: 67, src: 'assets/bgm/bg4.mp3' },
  { floor: 89, src: 'assets/bgm/bg5.mp3' },
];
const bgmAudios = BGM_STAGES.map(s => {
  const a = new Audio(s.src);
  a.loop = true;
  a.volume = 0;
  return a;
});
let currentBgmIndex = -1;
const BGM_TARGET_VOLUME = 0.16; // 0.35 → 0.16, 귀여운 소리가 포인트니까 배경음은 확실히 낮춤
const BGM_FADE_MS = 1400;

function bgmIndexForFloor(floor) {
  let idx = 0;
  for (let i = 0; i < BGM_STAGES.length; i++) {
    if (floor >= BGM_STAGES[i].floor) idx = i;
  }
  return idx;
}
function fadeAudio(audio, toVolume, ms) {
  const fromVolume = audio.volume;
  const start = performance.now();
  function step() {
    const t = Math.min((performance.now() - start) / ms, 1);
    audio.volume = fromVolume + (toVolume - fromVolume) * t;
    if (t < 1) requestAnimationFrame(step);
    else if (toVolume === 0) audio.pause();
  }
  requestAnimationFrame(step);
}
function updateBgmForFloor(floor) {
  if (!SOUND_ENABLED) return;
  const idx = bgmIndexForFloor(floor);
  if (idx === currentBgmIndex) return;
  const prevIndex = currentBgmIndex;
  currentBgmIndex = idx;
  if (prevIndex >= 0) fadeAudio(bgmAudios[prevIndex], 0, BGM_FADE_MS);
  const next = bgmAudios[idx];
  next.play().catch(() => {}); // 자동재생 정책에 막히면 다음 사용자 입력 때 자동으로 다시 시도됨(아래 unlock 참고)
  fadeAudio(next, BGM_TARGET_VOLUME, BGM_FADE_MS);
}
// 브라우저 자동재생 정책상 사용자 입력 전엔 재생이 막힐 수 있어서, 첫 탭/클릭 때
// 한 번 더 시도해서 확실히 살아나게 한다.
function unlockAudioOnFirstInput() {
  if (currentBgmIndex >= 0) bgmAudios[currentBgmIndex].play().catch(() => {});
  window.removeEventListener('pointerdown', unlockAudioOnFirstInput);
}
window.addEventListener('pointerdown', unlockAudioOnFirstInput);

// [탭 비활성화 대응] 다른 탭으로 전환하거나 화면을 꺼도 배경음악이 계속 재생되던
// 문제 — visibilitychange로 감지해서 숨겨지면 일시정지, 돌아오면 다시 재생.
document.addEventListener('visibilitychange', () => {
  if (currentBgmIndex < 0) return;
  const bgm = bgmAudios[currentBgmIndex];
  if (document.hidden) {
    bgm.pause();
  } else if (SOUND_ENABLED) {
    bgm.play().catch(() => {});
  }
});

// ---------- 돌풍 이벤트 (테스트용) ----------
// 정착된 블록은 static이라 직접 못 미니, 대신 "지금 공중에 떠 있는(낙하 중이거나
// 위태롭게 버티는 중인) 조각"에 옆바람을 불어넣어서 조준이 흔들리게 한다.
let nextGustAt = performance.now() + 6000 + Math.random() * 4000;
let gustState = 'idle'; // idle | warning | blow
let gustWarnUntil = 0;
let gustBlowUntil = 0;
let gustDir = 1;
let lightningUntil = 0; // 번쩍임 연출 종료 시각
let gustIntensity = 0;  // 0~1, 타워 흔들림/화면 틴트 세기(블로우 동안 서서히 오르내림)

// 층수에 따른 시계추 속도 (헬로런처럼 상한선 존재)
function pendulumSpeed() {
  const base = 2.2;   // 1.5 → 2.2, 더 확실하게 박진감 있게
  const growth = 0.08;
  const cap = 4.5;     // 3.6 → 4.5
  return Math.min(base + floorCount * growth, cap);
}
function pendulumRange() {
  // 초반엔 넓게 왕복, 층수가 오를수록 살짝 좁아져 난이도 보완(너무 가혹하지 않게)

// ---------- 카카오톡 공유("친구에게 자랑하기") ----------
// 헬로런과 같은 방식(결과 카드 이미지를 캔버스로 만들어서 카카오톡 피드 템플릿의
// imageUrl로 올림) — 전용 배경/캐릭터 그림은 없어서, 배경은 지금 게임 화면을 흐리게
// 찍은 걸로, 캐릭터는 표정 있는 8종 블록 중 랜덤으로 대신함.
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function pickRandomShareChar() {
  const keys = Object.keys(BLOCK_SOUND_SRC); // 표정 있는 8종만(사운드 있는 것과 동일한 목록)
  const key = keys[Math.floor(Math.random() * keys.length)];
  return sprites[key];
}
function buildShareCard() {
  const cw = 640, ch = 800;
  const sc = document.createElement('canvas');
  sc.width = cw; sc.height = ch;
  const sctx = sc.getContext('2d');

  const cardR = 28;
  roundRectPath(sctx, 0, 0, cw, ch, cardR);
  sctx.save();
  sctx.clip();

  // 전용 카드 배경이 없어서, 지금 게임 화면을 블러+어둡게 찍어서 배경으로 사용
  sctx.filter = 'blur(14px) brightness(0.55) saturate(1.15)';
  sctx.drawImage(canvas, 0, 0, cw, ch);
  sctx.filter = 'none';
  sctx.fillStyle = 'rgba(20,20,40,0.35)';
  sctx.fillRect(0, 0, cw, ch);

  sctx.textAlign = 'center';

  // 큰 층수 숫자 — 황금빛 글로우
  sctx.save();
  sctx.shadowColor = 'rgba(255,190,60,0.9)';
  sctx.shadowBlur = 30;
  sctx.font = '900 100px sans-serif';
  sctx.lineWidth = 8;
  sctx.strokeStyle = '#ffffff';
  sctx.strokeText(floorCount + '층', cw / 2, 245);
  sctx.fillStyle = '#ff9d1f';
  sctx.fillText(floorCount + '층', cw / 2, 245);
  sctx.restore();

  sctx.font = '600 21px sans-serif';
  sctx.fillStyle = '#fff6e0';
  sctx.fillText('🗼 헬로타워 · 대부도 오락실', cw / 2, 305);

  // 캐릭터 — 표정 있는 블록 중 랜덤
  const charImg = pickRandomShareChar();
  if (charImg && charImg.complete && charImg.naturalWidth) {
    const cs = 246;
    const ar = charImg.naturalWidth / charImg.naturalHeight;
    const dw = ar >= 1 ? cs : cs * ar, dh = ar >= 1 ? cs / ar : cs;
    sctx.drawImage(charImg, cw / 2 - dw / 2, 511 - dh / 2, dw, dh);
  }

  // 하단 CTA
  const ctaText = '👉  daebugame.com 놀러가기';
  sctx.font = '800 26px sans-serif';
  const ctaW = Math.min(cw - 48, sctx.measureText(ctaText).width + 60);
  const ctaY = 706, ctaH = 56;
  sctx.save();
  roundRectPath(sctx, cw / 2 - ctaW / 2 - 5, ctaY - 5, ctaW + 10, ctaH + 10, (ctaH + 10) / 2);
  sctx.fillStyle = 'rgba(255,255,255,0.35)';
  sctx.fill();
  roundRectPath(sctx, cw / 2 - ctaW / 2, ctaY, ctaW, ctaH, ctaH / 2);
  sctx.shadowColor = 'rgba(0,0,0,0.4)';
  sctx.shadowBlur = 14;
  sctx.shadowOffsetY = 4;
  sctx.fillStyle = '#ffc857';
  sctx.fill();
  sctx.restore();
  sctx.fillStyle = '#2a1c00';
  sctx.fillText(ctaText, cw / 2, ctaY + ctaH / 2 + 9);

  sctx.restore(); // 클리핑 해제

  roundRectPath(sctx, 2, 2, cw - 4, ch - 4, cardR);
  sctx.lineWidth = 4;
  sctx.strokeStyle = 'rgba(255,200,87,0.55)';
  sctx.stroke();

  return sc;
}
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

}

const OFFSCREEN_MARGIN = 80; // 안전장치: 이것마저 벗어나면 무조건 게임오버

function checkGameOver() {
  // 회전으로 인한 붕괴는 더 이상 없음(블록이 회전하지 않음) — 화면 밖으로 나간 경우만 안전장치로 체크
  for (const b of settledBodies) {
    if (b.label === 'ground') continue;
    if (b.position.x < -OFFSCREEN_MARGIN || b.position.x > GAME_W + OFFSCREEN_MARGIN) return true;
  }
  return false;
}

// [마일스톤] 층수 오를수록 간격을 넓힘 — 초반엔 5층마다(자주 성취감), 30층부터는
// 10층마다, 60층부터는 20층마다로 줄여서 후반에 너무 자주 터져서 성가신 걸 방지.
// (천국 도착 층수와 겹치면 안 띄움, 그쪽은 showEnding()이 따로 더 크게 축하해줌)
function isMilestoneFloor(floor) {
  if (floor <= 0) return false;
  if (floor < 30) return floor % 5 === 0;
  if (floor < 60) return floor % 10 === 0;
  return floor % 20 === 0;
}

// 텍스트 펑 튀는 애니메이션 + 화면 전체 살짝 밝아지는 플래시 + 색종이 파티클까지
// 같이 터뜨려서 눈에 확 띄게 함.
let milestoneTimer = null;
let milestoneFlashUntil = 0;
function showMilestone(floor) {
  const el = document.getElementById('milestone');
  el.textContent = `🎉 ${floor}층 돌파!`;
  el.classList.remove('show');
  void el.offsetWidth; // 리플로우 강제 — 연속으로 5층씩 찍어도 애니메이션이 매번 처음부터 다시 재생되게

  shakeTime = performance.now(); // 착지 흔들림과 같은 효과를 재사용해서 한 번 더 텅 하는 느낌
  spawnMilestoneBurst();
}

// --- 정착 처리 ---
// 충돌(닿는 순간)을 직접 감지해서 처리하는 기본 골격은 유지하되, 이번엔 난이도를
// 두 단계로 나눈다:
//  - 받침대 절반 폭 이내로 떨어짐(꽤 잘 조준함) → 그 자리에 확실히 고정. 겹침도
//    항상 OVERLAP_PX만큼 파고들게 "위치 자체"를 겹쳐서 배치 — 그림을 늘리거나
//    줄이지 않으므로 어떤 블록이든 항상 동일하게 겹친다.
//  - 받침대 절반 폭보다 많이 삐져나옴(위태로운 조준) → 억지로 붙이지 않고 진짜
//    물리(회전 포함)에 맡긴다. 스스로 버티면 그 자리 그대로 안착 인정, 40도 넘게
//    기울면 진짜로 무너져서 게임오버.
const TILT_LIMIT = 32 * Math.PI / 180; // 52도는 한쪽 모서리만 걸친 채로도 "안착"돼서 떠 보이는 느낌을 줬음 — 완화
const OVERLAP_PX = 0; // [수정] 새 캔버스+여백 시스템에서는 이 값이 필요 없음(아래 설명)
// [버그였던 부분] 발/집게 여백(MARGIN_BOTTOM)이 물리 박스 "바깥"에 그려지므로,
// 블록이 완전히 딱 붙기만(gap=0) 해도 발 그림이 자동으로 아래 블록 영역까지
// MARGIN_BOTTOM/K만큼 자연스럽게 겹쳐 들어간다. 그런데 여기에 추가로 OVERLAP_PX만큼
// 물리 위치까지 파고들게 만들어버려서, "발 여백이 겹치는 만큼"과 "물리적으로 파고든
// 만큼"이 정확히 상쇄돼 실제 화면에는 겹침이 전혀 안 보였던 것. 그래서 0으로 수정.

function currentSupport() {
  return settledBodies[settledBodies.length - 1];
}

function overlapWithSupport(body) {
  const support = currentSupport();
  const supportX = support.label === 'ground' ? GAME_W / 2 : support.position.x;
  const supportHalfW = support.label === 'ground'
    ? GAME_W
    : (support.bounds.max.x - support.bounds.min.x) / 2;
  const pieceHalfW = (body.bounds.max.x - body.bounds.min.x) / 2;
  const dx = supportX - body.position.x;
  const overlapAmount = (supportHalfW + pieceHalfW) - Math.abs(dx);
  return { dx, overlapAmount, supportHalfW, pieceHalfW };
}

// 안착이 최종 확정될 때 공통으로 하는 일(안정 착지든, 위태롭게 버텨낸 착지든 공통).
// x축과 각도는 절대 안 건드리고(진짜 물리 결과 그대로 유지) 세로 위치만 조정한다.
// [추가] 정확히 0으로만 붙이면, 블록이 살짝 기울어서 한쪽 모서리만 걸친 경우 나머지
// 대부분이 떠 보이는 느낌이 났음. 그래서 항상 SETTLE_OVERLAP만큼 더 파고들게(=아래
// 블록을 살짝 덮게) 만들어서, 약간의 기울어짐이 있어도 시각적으로 확실히 붙어 보이게 함.
const SETTLE_OVERLAP = 5; // 10은 너무 많이 겹쳐서 5로 조정

function finalizeSettle(body) {
  const bounds = body.bounds;
  // 블록이 살짝 기울어진 채로 정착하면, 가장 낮은 모서리만 겹침 기준으로 삼을 경우
  // 반대쪽 모서리는 여전히 떠 보일 수 있다. 그래서 기울기가 클수록(가로폭 대비)
  // 겹침량을 추가로 더 준다 — 각도 자체는 안 건드리고 세로 위치만 더 내림.
  const pieceHalfW = (bounds.max.x - bounds.min.x) / 2;
  const tiltExtra = Math.min(Math.abs(Math.sin(body.angle)) * pieceHalfW, 40);
  // [버그 수정] Y는 아래로 갈수록 커지므로, "아래 블록으로 파고든다"는 건 이 블록의
  // 아랫변(bounds.max.y)이 below.top(towerTopY)보다 더 "큰"(더 아래) 값이 돼야 한다.
  // 예전엔 반대로 towerTopY - SETTLE_OVERLAP을 목표로 삼아서 오히려 그만큼 뜨게
  // 만들고 있었음(겹침이 아니라 틈이 생기는 부호였음). +로 고침.
  const targetMaxY = towerTopY + SETTLE_OVERLAP + tiltExtra;
  const gap = targetMaxY - bounds.max.y;
  if (gap !== 0) {
    Body.translate(body, { x: 0, y: gap });
  }

  settledBodies.push(body);
  floorCount++;
  document.getElementById('floorCounter').textContent = floorCount + '층';
  towerTopY = body.bounds.min.y;
  spawnFloorPopup(body.position.x, body.bounds.min.y); // 닿은 그 자리에서 "+1층" 떠오름
  if (Math.random() < 0.3) { // 16% → 30%, 지루하지 않게 더 자주
    // 정중앙 말고 좌우로 랜덤하게 흩어지게(+1층 문구랑도 안 겹치고 더 생동감 있게)
    const whisperSide = (Math.random() - 0.5) * 2; // -1~1
    const whisperX = Math.max(60, Math.min(GAME_W - 60, body.position.x + whisperSide * (GAME_W * 0.22)));
    spawnWhisper(whisperX, body.bounds.min.y - 26);
  }

  if (floorCount >= HEAVEN_FLOOR) {
    showEnding();
    return;
  }
  if (isMilestoneFloor(floorCount)) {
    showMilestone(floorCount);
  }
  if (checkGameOver()) {
    endGame();
    return;
  }
  currentType = nextType;
  nextType = pickRandomType();
  activeBody = null;
  state = 'pendulum';
  startPendulumSound(currentType);
  if (floorCount === 1) {
    document.getElementById('hint').style.opacity = '1';
  }
}

// ---------- 착지 손맛 연출 헬퍼 ----------
function spawnDustBurst(x, y) {
  const n = 14; // 7 → 14, 더 풍성하게
  for (let i = 0; i < n; i++) {
    const angle = Math.PI + (Math.random() - 0.5) * Math.PI * 0.9; // 위쪽 반원으로 퍼짐
    const speed = 1.6 + Math.random() * 2.4; // 조금 더 힘있게 퍼짐
    dustParticles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed * 0.6,
      born: performance.now(),
      r: 5 + Math.random() * 5 // 3~6 → 5~10, 훨씬 크게
    });
  }
  if (dustParticles.length > 90) dustParticles.splice(0, dustParticles.length - 90);
}

// "+1층" — 블록이 닿는 그 자리에서 떠오르며 사라지는 텍스트. 한 층 한 층 쌓일 때마다
// 바로 그 자리에서 터져야 박진감이 사니까, 정착이 "확정"되는 순간(finalizeSettle)에
// 그 블록의 착지 지점에서 스폰한다.
function spawnFloorPopup(x, y) {
  floorPopups.push({ x, y, born: performance.now() });
  if (floorPopups.length > 20) floorPopups.splice(0, floorPopups.length - 20);
}

// 블록들이 가끔 속삭이는 대사 — 매층마다는 아니고 낮은 확률로만(아래 호출부 참고).
// 말풍선처럼 +1층보다 천천히, 조금 더 오래 보이게.
const WHISPER_LINES = [
  '고소공포증이 있어',
  '높은 건 딱 질색이야',
  '태풍아 제발 오지마',
  '대부도에 놀러 가고 싶어',
  '하늘 위에는 뭐가 있을까?',
  '구름 위를 우리가 갈 수 있을까?',
  '정말 우리가 해낼 수 있을까?',
  '삶은 원래 고통이라지??',
  '고통 없는 삶은 진짜 삶이 아니래',
  '고통과 행복은 같이 오는 거야',
  '어디까지 올라가나 한 번 해보자!',
  '우리가 힘을 합치면 못할 게 없어!',
  '진정한 사랑은 존재를 인정하는 것!',
];
function spawnWhisper(x, y) {
  const text = WHISPER_LINES[Math.floor(Math.random() * WHISPER_LINES.length)];
  whisperPopups.push({ x, y, born: performance.now(), text });
  if (whisperPopups.length > 6) whisperPopups.splice(0, whisperPopups.length - 6);
}

// 마일스톤(5층마다) 순간 화면 중앙에서 사방으로 터지는 색종이 파티클
function spawnMilestoneBurst() {
  const colors = ['#ffd166', '#ff6b6b', '#4dd4ac', '#6ea8ff', '#ff9ecf'];
  const cx = GAME_W / 2, cy = GAME_H * 0.32;
  const n = 26;
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 3.5;
    milestoneBurst.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      born: performance.now(),
      color: colors[Math.floor(Math.random() * colors.length)],
      size: 4 + Math.random() * 4
    });
  }
}

function playThudSound() {
  if (!SOUND_ENABLED) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(160, now);
    osc.frequency.exponentialRampToValueAtTime(55, now + 0.09);
    gain.gain.setValueAtTime(0.22, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 0.13);
  } catch (e) { /* 오디오 실패해도 게임 진행에는 지장 없음 */ }
}

// 돌풍 예고음 — 짧고 높은 "삐릭" 두 번 (경고 느낌)
function playGustWarnSound() {
  if (!SOUND_ENABLED) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    [0, 0.12].forEach(delay => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(920, now + delay);
      gain.gain.setValueAtTime(0.12, now + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now + delay);
      osc.stop(now + delay + 0.1);
    });
  } catch (e) { /* 무시 */ }
}

// 돌풍이 실제로 부는 순간의 "휘이익" 바람 소리 — 화이트노이즈를 대역통과 필터로 걸러서 합성
function playGustBlowSound() {
  if (!SOUND_ENABLED) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.45;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + dur);
    filter.Q.value = 0.8;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.28, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch (e) { /* 무시 */ }
}

// 천둥 소리 — 낮은 저역 노이즈를 길게 깔아서 "쿠구궁" 하는 울림을 만듦
function playThunderRumble() {
  if (!SOUND_ENABLED) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.9;
    const bufferSize = Math.floor(audioCtx.sampleRate * dur);
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize) * 0.9;
    }
    const noise = audioCtx.createBufferSource();
    noise.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(180, audioCtx.currentTime);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.32, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    noise.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    noise.start();
  } catch (e) { /* 무시 */ }
}

function settlePiece(body) {
  if (state !== 'falling' || body !== activeBody) return; // 이미 처리됐거나 대상이 아니면 무시(중복 호출 방지)

  const { overlapAmount } = overlapWithSupport(body);

  if (overlapAmount <= 0) {
    // 받침과 전혀 안 겹침 — 완전히 빗나간 것으로 보고 게임오버
    stopDropSound();
    Body.setVelocity(body, { x: 0, y: 0 });
    endGame();
    return;
  }

  // [수정] 손맛 연출(짜부/흔들림/먼지/효과음/표정전환)을 "완전히 멈춘 뒤"가 아니라
  // 지금, 실제로 닿는 이 순간 바로 터뜨린다. 안착 확정(층수 카운트 등)은 여전히
  // 안정화를 기다리지만, 감각적 피드백은 접촉 즉시 나가야 "한 박자 느리다"는
  // 느낌이 없어짐.
  const now = performance.now();
  impactTime = now;
  body.landTime = now; // 이 블록만 잠깐 impact(찌푸림) 표정으로
  setTimeout(() => { body.landTime = 0; }, IMPACT_FACE_DURATION + 40); // 확실하게 되돌리는 안전장치
  shakeTime = now;
  // 먼지를 블록 정중앙이 아니라 좌우 모서리 쪽에 띄워서(캐릭터 얼굴에 안 가리고)
  // 더 잘 보이게 함 — 매번 왼쪽/오른쪽 중 무작위로.
  const dustSide = Math.random() < 0.5 ? -1 : 1;
  const halfW = (body.bounds.max.x - body.bounds.min.x) / 2;
  const dustX = body.position.x + dustSide * halfW * 0.9;
  spawnDustBurst(dustX, body.bounds.max.y);
  stopDropSound(); // 떨어지는 소리는 닿는 순간 바로 끊고
  playThudClip();  // 그 자리에서 "쿵" 소리로 넘어감

  // [추가] 닿는 순간 남아있던 가로 방향 관성(특히 돌풍에 밀린 경우)이 그대로 남아서
  // 착지 후에도 한참 미끄러지는 문제가 있었음 — 닿자마자 가로 속도를 확 깎아서
  // "쭉 미끄러지는" 느낌을 줄인다(완전히 0으로 죽이진 않아서 관성 자체는 살짝 남음).
  Body.setVelocity(body, { x: body.velocity.x * 0.15, y: body.velocity.y });

  // [설계 변경] "잘 조준하면 위치/각도를 강제로 맞춰주는" 확실 안착 경로를 완전히 없앰.
  // 이 경로가 오히려 물리박스끼리 틈이 남는 버그의 원인이었고, 탭한 그대로 안 내려오고
  // 위치가 튀는 것도 부자연스러웠음. 이제부터는 정도와 상관없이 항상 진짜 물리로만
  // 버티게 하고, 최종적으로 멈추면 그 자리 그대로(가로 위치·각도 둘 다 안 건드리고
  // 세로 틈만 정리해서) 안착 인정한다 — finalizeSettle 참고.
  state = 'wobbling';
  wobbleTimer = 0;
}

// 낙하 중인 조각이 "현재 탑의 맨 위"와 실제로 부딪히는 그 순간을 감지.
// 맨 위가 아닌 다른 블록/지면에 부딪히면 탑을 완전히 빗나간 것이므로 바로 게임오버.
Events.on(engine, 'collisionStart', (event) => {
  if (state !== 'falling' || !activeBody || !activeHasFallen) return;
  for (const pair of event.pairs) {
    let other = null;
    if (pair.bodyA === activeBody) other = pair.bodyB;
    else if (pair.bodyB === activeBody) other = pair.bodyA;
    if (!other) continue;

    const currentTop = settledBodies[settledBodies.length - 1];
    if (other === currentTop) {
      settlePiece(activeBody);
      return;
    }
    if (other.label === 'ground' || settledBodies.indexOf(other) !== -1) {
      // 탑의 진짜 맨 위가 아닌 다른 것에 부딪힘 = 탑을 스쳐 지나가서 완전히 빗나간 것
      stopDropSound();
      Body.setVelocity(activeBody, { x: 0, y: 0 });
      endGame();
      return;

    }
  }
});

// =========================================================================
// 메인 루프
// =========================================================================
let lastTime = performance.now();

function loop(now) {
  const dt = Math.min(now - lastTime, 32);
  lastTime = now;

  Engine.update(engine, dt);

  // --- 시계추 갱신 ---
  if (state === 'pendulum') {
    pendPhase += pendulumSpeed() * (dt / 1000);
    const range = pendulumRange();
    pendX = GAME_W / 2 + Math.sin(pendPhase) * range;
  }

  // --- 돌풍 이벤트(테스트) ---
  // 지금 공중에 떠 있는 조각(낙하 중 또는 위태롭게 버티는 중)이 있을 때만 발동.
  // 정착된 블록들은 static이라 안 건드림 — 조준 중인/막 착지한 조각만 옆으로 밀림.
  const gustHasTarget = activeBody && (state === 'falling' || state === 'wobbling');
  if (gustState === 'idle' && gustHasTarget && performance.now() > nextGustAt) {
    gustDir = Math.random() < 0.5 ? -1 : 1;
    gustState = 'warning';
    gustWarnUntil = performance.now() + 450; // 예고 단계 — "곧 붑니다" 신호
    playGustWarnSound();
  }
  if (gustState === 'warning' && performance.now() > gustWarnUntil) {
    gustState = 'blow';
    gustBlowUntil = performance.now() + 900; // 0.55 → 0.9초, 더 길게 몰아침
    nextGustAt = performance.now() + 7000 + Math.random() * 5000;
    shakeTime = performance.now(); // 기존 화면 흔들림 효과를 돌풍에도 재사용해서 더 세게 느껴지게
    lightningUntil = performance.now() + 140; // 시작 순간 번쩍
    playGustBlowSound();
    playThunderClip();
    playStormScream(); // 블록들이 한꺼번에 "꺅!" 하며 무서워하는 느낌
  }
  if (gustState === 'blow') {
    // [수정] 예전엔 순간적으로 속도를 한 번만 툭 건드려서 체감이 잘 안 됐음.
    // 이제 부는 동안 계속 옆으로 밀어서, 떨어지는 궤적 자체가 눈에 띄게
    // 휘어지도록 함(이미 정착해서 버티는 wobbling 상태는 마찰이 강해서 밀어도
    // 티가 잘 안 나므로, 아직 진짜로 낙하 중인 조각에만 적용).
    if (activeBody && state === 'falling') {
      const gustPushPerSec = 4.5 + Math.min(floorCount * 0.04, 3.5); // 더 세게, 층수 오를수록 더더욱
      Body.setVelocity(activeBody, {
        x: activeBody.velocity.x + gustDir * gustPushPerSec * (dt / 1000),
        y: activeBody.velocity.y
      });
    }
    const blowElapsed = performance.now() - (gustBlowUntil - 900);
    const blowT = Math.min(blowElapsed / 900, 1);
    gustIntensity = Math.sin(blowT * Math.PI); // 0→1→0로 서서히 세졌다 잦아듦(타워 흔들림/화면 틴트에 사용)
    if (performance.now() > gustBlowUntil) { gustState = 'idle'; gustIntensity = 0; }
  }

  // --- 낙하 중인 조각: 중력 받아 한 번이라도 유의미하게 가속했는지만 추적 ---
  // (충돌 감지 자체는 collisionStart 이벤트에서 처리하므로, 여기서는 "스폰 직후
  //  아직 안 떨어지기 시작한 상태에서의 우발적 충돌"을 걸러내는 게이트만 갱신)
  if (state === 'falling' && activeBody) {
    if (!activeHasFallen && activeBody.speed > 1.2) activeHasFallen = true;

    // 블록 크기(면적)가 클수록 떨어질 때 더 무겁게, 더 빠르게 느껴지도록 추가 가속을 줌
    // (Matter.js 기본 중력은 질량과 무관하게 다 똑같이 떨어지므로, 크기 차이가 실감되게
    // 일부러 비현실적인 보정을 얹는다)
    const spec = PIECES[activeBody.pieceType];
    const mult = spec.sizeMultiplier || 1;
    const area = spec.w * spec.h * mult * mult;
    const sizeFactor = area / 9000; // 평균 크기 근방이 1이 되도록 대략 스케일
    const extraGravity = 1.1 * sizeFactor; // 0.75 → 1.1, 계속 루즈하다는 피드백이라 더 올림
    Body.setVelocity(activeBody, {
      x: activeBody.velocity.x,
      y: activeBody.velocity.y + extraGravity * (dt / 1000)
    });
  }

  // --- 위태롭게 걸친 블록: 진짜 물리로 버티는지, 넘어가는지 지켜봄 ---
  if (state === 'wobbling' && activeBody) {
    const tiltLimit = activeBody.tiltLimitRad || TILT_LIMIT; // 스폰 시점 층수 기준 난이도
    if (Math.abs(activeBody.angle) > tiltLimit) {
      // 기울어짐 한도 초과 — 진짜로 무너진 것으로 보고 게임오버
      endGame();
    } else if (activeBody.speed < 0.4 && Math.abs(activeBody.angularVelocity) < 0.03) {
      wobbleTimer += dt;
      if (wobbleTimer > 100) {
        // 버텨냈음 — 지금 자세/위치 그대로 안착 인정 (억지로 안 붙임, 진짜 그 자리)
        Body.setStatic(activeBody, true);
        finalizeSettle(activeBody);
      }
    } else {
      wobbleTimer = 0;
    }
  }

  // --- 카메라: 탑 상단이 화면 위쪽 42% 지점보다 높아지면 스크롤 ---
  // [조정] 예전엔 42% 지점에서 따라가기 시작 + 느린 추적(0.08) — 위쪽 여백이 부족하고
  // 반응도 느렸음. 55% 지점(탑이 화면에서 더 아래쪽에 유지 = 위쪽 하늘 여백 더 넓게
  // 보임)으로 늘리고, 추적 속도도 0.08→0.14로 빠르게.
  const desiredCamY = Math.min(0, towerTopY - GAME_H * 0.55);
  cameraY += (desiredCamY - cameraY) * 0.14;

  // --- 구름: 위쪽에 계속 채워 넣고, 살짝 옆으로도 흘러가게 ---
  maybeSpawnClouds();
  for (const c of clouds) c.x += c.drift * (dt / 1000);

  // --- 별(우주 구간) ---
  maybeSpawnStars();

  // --- 새(맑은 하늘~구름 구간) ---
  maybeSpawnTravelers();

  // --- 배경음악: 층수 구간이 바뀌면 자동으로 크로스페이드 ---
  updateBgmForFloor(floorCount);

  render();
  requestAnimationFrame(loop);
}

// =========================================================================
// 렌더링
// =========================================================================

// 물리 상태(pendulum 미리보기 / 낙하 중 / 정착 후) 어디서든 같은 크기로 그리기 위한
// 단일 사이즈 계산 함수. 이게 없으면 미리보기와 실제 드롭 사이에 그리는 방식이 달라서
// 탭하는 순간 모양이 바뀌어 보이는 문제가 생김.
function spriteDrawSize(type) {
  const spec = PIECES[type];
  if (spec.shape === 'rect' && spec.boxFrac) {
    // 물리 박스 비율(boxFrac)의 역수만큼 확대해서 그려서 장식이 자연스럽게 오버플로우 되도록 함
    // (가로/세로를 각각의 boxFrac으로 나눠야 이미지 원본 비율이 유지됨 — 찌그러짐 방지)
    return { w: spec.w / spec.boxFrac.w, h: spec.h / spec.boxFrac.h };
  }
  // 특이 블록(망둥어/해파리)은 물리 박스 크기 그대로 그린다.
  // [중요] 예전엔 *1.15 / *1.3 같은 임의 배수로 확대했었는데, 그러면 그려지는 높이가
  // 실제 물리 박스 높이(spec.h)와 달라져서 겹침 계산(overlapDrawSize의 topY 기준)이
  // 다른 블록들과 안 맞아 "얘만 겹침이 다르게 보이는" 원인이 됐음. 그래서 물리 박스와
  // 정확히 같은 크기로 그리도록 통일함(장식 여유는 포기하는 대신 스택 일관성을 맞춤).
  return { w: spec.w, h: spec.h };
}

// [설계 변경] 겹침은 더 이상 그림을 늘려서 만들지 않는다 — 이제 안착 시 물리적
// 위치 자체를 OVERLAP_PX만큼 겹치게 배치한다(settlePiece 참고).
//
// [새 에셋 파이프라인] canvas 필드가 있는 블록(헬로/꽃게 등)은 고정 여백
// (MARGIN_TOP/BOTTOM/SIDE)과 전역 배율(IMG_SCALE_K)만으로 물리박스 중심 위치를
// 계산해서 그린다 — 블록마다 다른 배율을 따로 구하지 않으므로 테두리 두께·여백이
// 항상 일관됨. 아직 구 에셋인 블록은 기존 boxFrac 방식으로 계속 그린다.
function overlapDrawSize(type) {
  const spec = PIECES[type];
  if (spec.canvas) {
    const mult = spec.sizeMultiplier || 1; // 물리박스와 항상 같은 배율로 그림도 같이 커지고 작아짐(정렬 유지)
    const w = (spec.canvas.w / IMG_SCALE_K) * mult;
    const h = (spec.canvas.h / IMG_SCALE_K) * mult;
    const offsetX = -w / 2; // 좌우 여백은 대칭이라 중앙 정렬 그대로
    const offsetY = -((MARGIN_TOP / IMG_SCALE_K) * mult + (spec.h * mult) / 2); // 물리박스 중심을 (0,0) 기준으로
    return { w, h, offsetX, offsetY };
  }
  const { w, h } = spriteDrawSize(type);
  return { w, h, offsetX: -w / 2, offsetY: -h / 2 };
}

const IMPACT_FACE_DURATION = 380; // 착지 후 이 시간(ms) 동안만 찌푸린 표정으로 보여줌

function drawPiece(body) {
  const useImpact = body.landTime && (performance.now() - body.landTime) < IMPACT_FACE_DURATION;
  const img = useImpact ? spritesImpact[body.pieceType] : sprites[body.pieceType];
  const pos = body.position, ang = body.angle;
  const { w: sw, h: sh, offsetX, offsetY } = overlapDrawSize(body.pieceType);

  ctx.save();
  ctx.translate(pos.x, pos.y - cameraY);
  ctx.rotate(ang);

  if (!img.complete || img.naturalWidth === 0) {
    // 이미지 로드 전 대체 표시
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillRect(offsetX, offsetY, sw, sh);
    ctx.restore();
    return;
  }

  ctx.drawImage(img, offsetX, offsetY, sw, sh);
  ctx.restore();

  if (DEBUG_MODE) drawDebugBox(body);
}

// 물리박스(실제 충돌·안착 기준이 되는 영역)를 빨간 테두리로 그려서
// 그림의 여백이 아니라 이 박스끼리 정말로 맞닿는지 눈으로 바로 확인할 수 있게 함.
// [수정] 예전엔 spec.w/h로 된 "축에 맞는 사각형"만 그렸는데, 망둥어(평행사변형)나
// 해파리(돔)처럼 실제 충돌 모양이 사각형이 아닌 블록은 진짜 모양과 다르게 그려져서
// 오히려 헷갈렸음. 이제 body.vertices(엔진이 계산한 실제 충돌 다각형, 월드 좌표)를
// 그대로 따라 그려서 어떤 모양이든 항상 진짜 충돌 영역과 정확히 일치하게 한다.
function drawDebugBox(body) {
  const verts = body.vertices;
  if (!verts || verts.length === 0) return;
  ctx.save();
  ctx.strokeStyle = '#ff2d55';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(verts[0].x, verts[0].y - cameraY);
  for (let i = 1; i < verts.length; i++) {
    ctx.lineTo(verts[i].x, verts[i].y - cameraY);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
}

function render() {
  ctx.clearRect(0, 0, GAME_W, GAME_H);

  // 하늘 — 층수 단계에 따라 색이 부드럽게 전환됨(맑음 → 구름 위 → 성층권 → 우주)
  const skyColors = getSkyColors(floorCount);
  const sky = ctx.createLinearGradient(0, 0, 0, GAME_H);
  sky.addColorStop(0, skyColors.top);
  sky.addColorStop(1, skyColors.bottom);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, GAME_W, GAME_H);

  drawStars();
  drawTravelers();
  drawHeavenGlow();
  drawGods();
  drawClouds();

  // [교체] 헬로버드에서 가져온 랜드마크(풍차) 등 기존 배경 요소는 전부 빼고,
  // 대표님이 새로 만들어온 바닥 배경 한 장만 사용. 탑 가시성을 방해하지 않게
  // 살짝 블러 처리해서 원경처럼 보이게 함.
  if (groundSimpleReady) {
    ctx.save();
    ctx.filter = 'blur(1px)'; // 2.5px는 너무 흐릿했음 — 장소가 구분될 정도로 선명하게
    ctx.drawImage(groundSimpleImg, 0, GAME_H - groundDrawH - cameraY, GAME_W, groundDrawH);
    ctx.restore();
  } else {
    ctx.fillStyle = '#e6c08a';
    ctx.fillRect(0, GROUND_Y - cameraY, GAME_W, GAME_H);
  }

  // 받침대 — 탑이 배경 위에 붕 떠 보이지 않도록, 탑이 시작되는 정확한 자리에 깔아줌.
  // 이미지 자체가 원통형이라 맨 위 꼭짓점이 아니라, 위쪽 타원면(윗면)의 중심이 실제
  // "블록이 놓이는 자리"라서 이미지 상단에서 약 18% 내려온 지점을 GROUND_Y에 맞춤.
  if (platformReady) {
    const topOffsetFrac = 0.30; // 0.18 → 0.30, 첫 블록이 받침대에 더 깊이 걸치도록
    ctx.drawImage(
      platformImg,
      (GAME_W - platformW) / 2,
      GROUND_Y - platformH * topOffsetFrac - cameraY,
      platformW, platformH
    );
  }

  // 착지 충격으로 탑 전체가 살짝 짜부됐다가 펴지는 연출 + 화면 흔들림.
  // [중요] 실제 위치/크기는 절대 안 바꾸고, 화면에 그릴 때만 지면을 기준점 삼아
  // 순수하게 시각적으로 스케일/흔들림을 걸었다 푼다 — 그래서 이 효과 때문에 블록이
  // 미세하게 자리를 옮기는 일은 없음(효과가 끝나면 정확히 원래 자리로 보임).
  const IMPACT_DURATION = 130;
  const impactElapsed = performance.now() - impactTime;
  let squashY = 1;
  if (impactElapsed >= 0 && impactElapsed < IMPACT_DURATION) {
    const p = impactElapsed / IMPACT_DURATION;
    squashY = 1 - Math.sin(p * Math.PI) * 0.1; // 5% → 10%로 더 확실하게
  }

  const SHAKE_DURATION = 150;
  const shakeElapsed = performance.now() - shakeTime;
  let shakeX = 0, shakeY = 0;
  if (shakeElapsed >= 0 && shakeElapsed < SHAKE_DURATION) {
    const decay = 1 - shakeElapsed / SHAKE_DURATION;
    const mag = 4 * decay;
    shakeX = (Math.random() - 0.5) * mag;
    shakeY = (Math.random() - 0.5) * mag * 0.6;
  }

  ctx.save();
  ctx.translate(GAME_W / 2 + shakeX, GROUND_Y - cameraY + shakeY);
  ctx.scale(1, squashY);
  // 태풍이 부는 동안 탑 전체가 바람 방향으로 휘청이는 연출(순수 시각 효과,
  // 물리 위치는 전혀 안 건드림 — 그래서 안정성 걱정 없이 마음껏 흔들 수 있음).
  // 아래쪽(지면)은 거의 안 흔들리고 위로 갈수록 더 많이 휘도록 층수 비례 기울임(shear).
  const swayAmount = gustIntensity * gustDir * 0.09;
  ctx.transform(1, 0, swayAmount, 1, 0, 0);
  ctx.translate(-GAME_W / 2, -(GROUND_Y - cameraY));

  // 정착된 블록들
  for (const b of settledBodies) {
    if (b.label === 'ground') continue;
    drawPiece(b);
  }
  // 낙하 중인 블록
  if (activeBody) drawPiece(activeBody);

  // [진단용] 각 블록과 바로 아래 블록 사이의 실제 세로 겹침/틈 수치를 화면에 직접 표시.
  // 양수=겹침(정상), 음수=틈(버그). 스크린샷 찍었을 때 바로 숫자로 확인 가능하게.
  if (DEBUG_MODE) {
    ctx.save();
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    for (let i = 1; i < settledBodies.length; i++) {
      const below = settledBodies[i - 1];
      const above = settledBodies[i];
      const overlapVal = above.bounds.max.y - below.bounds.min.y; // 양수=겹침, 음수=틈 (부호 수정)
      const seamY = (below.bounds.min.y + above.bounds.max.y) / 2 - cameraY;
      const label = overlapVal.toFixed(1);
      ctx.fillStyle = overlapVal >= 0 ? '#00c853' : '#ff1744';
      ctx.fillText(label, above.bounds.max.x + 4, seamY + 4);
    }
    ctx.restore();
  }

  ctx.restore();

  // 착지 먼지 파티클 갱신 + 그리기 — 예전보다 크고 진하고 오래 보이게 강화
  const now2 = performance.now();
  const DUST_LIFE = 550; // 380 → 550
  dustParticles = dustParticles.filter(p => now2 - p.born < DUST_LIFE);
  for (const p of dustParticles) {
    const t = (now2 - p.born) / DUST_LIFE;
    const px = p.x + p.vx * (now2 - p.born) * 0.06;
    const py = p.y + p.vy * (now2 - p.born) * 0.06 + t * t * 6; // 살짝 중력처럼 처짐
    ctx.save();
    // 초반엔 거의 불투명하게 유지하다가 후반에만 빠르게 사라지게(예전엔 처음부터 계속 옅어짐)
    ctx.globalAlpha = t < 0.5 ? 0.95 : Math.max(0, 1 - (t - 0.5) * 2);
    ctx.fillStyle = '#efe4c8';
    ctx.strokeStyle = 'rgba(150,130,90,0.5)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(px, py - cameraY, p.r * (1 - t * 0.35), 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  // "+1층" — 블록이 닿은 자리에서 위로 떠오르며 사라짐(박진감용, 매층마다)
  const FLOOR_POPUP_LIFE = 750;
  floorPopups = floorPopups.filter(p => now2 - p.born < FLOOR_POPUP_LIFE);
  for (const p of floorPopups) {
    const t = (now2 - p.born) / FLOOR_POPUP_LIFE;
    const py = p.y - t * 50 - cameraY; // 위로 떠오름
    const scale = 1 + Math.sin(t * Math.PI) * 0.15; // 살짝 통통 튀는 느낌
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t * t);
    ctx.translate(p.x, py);
    ctx.scale(scale, scale);
    ctx.font = 'bold 24px sans-serif';
    ctx.textAlign = 'center';
    // [가독성 수정] 노란 글씨였는데 100층 근처 황금빛 하늘이랑 색이 비슷해서 묻힘 —
    // 흰색 채우기 + 두꺼운 진한 테두리 + 그림자로 바꿔서 어떤 하늘색 위에서도 잘 보이게.
    ctx.shadowColor = 'rgba(0,0,0,0.45)';
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(40,30,10,0.85)';
    ctx.lineWidth = 5;
    ctx.strokeText('+1층', 0, 0);
    ctx.shadowBlur = 0; // 채우기엔 그림자 중복 안 되게(테두리에서만 살짝)
    ctx.fillText('+1층', 0, 0);
    ctx.restore();
  }

  // 블록들의 속삭임 — 말풍선 스타일로 좀 더 천천히, 오래 보이게(크기도 확실히 키움)
  const WHISPER_LIFE = 2300;
  whisperPopups = whisperPopups.filter(p => now2 - p.born < WHISPER_LIFE);
  for (const p of whisperPopups) {
    const t = (now2 - p.born) / WHISPER_LIFE;
    const py = p.y - t * 60 - cameraY;
    // 등장/퇴장만 부드럽게 페이드, 중간엔 계속 선명하게 유지(대사를 읽을 시간 확보)
    const alpha = t < 0.15 ? t / 0.15 : (t > 0.8 ? Math.max(0, (1 - t) / 0.2) : 1);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.font = '700 22px sans-serif'; // 15px → 22px, 훨씬 잘 보이게
    ctx.textAlign = 'center';
    const textW = ctx.measureText(p.text).width;
    const padX = 18, padY = 13;
    const bw = textW + padX * 2, bh = 22 + padY * 2;
    // 말풍선 배경
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeStyle = 'rgba(80,80,90,0.55)';
    ctx.lineWidth = 1.6;
    // [수정] 예전엔 블록 위치(p.x)를 중심으로만 그려서, 문장이 길면 말풍선 좌우 끝이
    // 화면 밖으로 나갔음. 이제 말풍선 자체의 좌우 끝이 화면 안(여백 6px)에 들어오게
    // bx를 직접 조정 — 텍스트와 꼬리도 그 조정된 위치 기준으로 맞춤.
    const margin = 6;
    let bx = p.x - bw / 2;
    bx = Math.max(margin, Math.min(GAME_W - bw - margin, bx));
    const by = py - bh - 14;
    const bubbleCenterX = bx + bw / 2;
    const r = 12;
    ctx.beginPath();
    ctx.moveTo(bx + r, by);
    ctx.arcTo(bx + bw, by, bx + bw, by + bh, r);
    ctx.arcTo(bx + bw, by + bh, bx, by + bh, r);
    ctx.arcTo(bx, by + bh, bx, by, r);
    ctx.arcTo(bx, by, bx + bw, by, r);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 꼬리 — 말풍선이 옆으로 밀렸어도 실제 블록(p.x) 쪽을 최대한 가리키되, 말풍선
    // 폭 안(가장자리에서 14px 이상 안쪽)으로 눌러서 어색하게 삐져나가지 않게 함
    const tailX = Math.max(bx + 14, Math.min(bx + bw - 14, p.x));
    ctx.beginPath();
    ctx.moveTo(tailX - 9, by + bh);
    ctx.lineTo(tailX + 9, by + bh);
    ctx.lineTo(tailX, by + bh + 12);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // 텍스트 — 말풍선의 실제 중심(bubbleCenterX) 기준으로
    ctx.fillStyle = '#3a3a3a';
    ctx.fillText(p.text, bubbleCenterX, by + bh / 2 + 7);
    ctx.restore();
  }

  // 마일스톤 색종이 파티클
  const MILESTONE_BURST_LIFE = 900;
  milestoneBurst = milestoneBurst.filter(p => now2 - p.born < MILESTONE_BURST_LIFE);
  for (const p of milestoneBurst) {
    const t = (now2 - p.born) / MILESTONE_BURST_LIFE;
    const px = p.x + p.vx * (now2 - p.born) * 0.05;
    const py = p.y + p.vy * (now2 - p.born) * 0.05 + t * t * 40;
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - t);
    ctx.translate(px, py);
    ctx.rotate(t * 8);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();
  }
  // 마일스톤 화면 플래시
  if (now2 < milestoneFlashUntil) {
    const ft = 1 - (milestoneFlashUntil - now2) / 350;
    ctx.save();
    ctx.globalAlpha = (1 - ft) * 0.35;
    ctx.fillStyle = '#fff3c4';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.restore();
  }

  // 시계추(다음 조각) — pendulum 상태일 때만 상단에 표시
  // (drawPiece와 완전히 동일한 overlapDrawSize()를 써야 탭해서 떨어뜨릴 때 크기가 안 바뀜)
  if (state === 'pendulum') {
    const img = sprites[currentType];
    const y = towerTopY - PREVIEW_CLEARANCE - cameraY;
    // 진자가 왕복하는 방향으로 살짝 기울여서(진행 방향의 반대쪽 위로) 진짜 매달려 흔들리는 느낌을 줌
    // (정적인 그림 1장뿐이라 날개를 실제로 퍼덕이게 할 수는 없어서, 대신 흔들림 자체를 손맛있게)
    const swingVel = Math.cos(pendPhase) * pendulumSpeed(); // sin(phase)의 순간 변화율 = 스윙 속도/방향
    const lean = Math.max(-0.22, Math.min(0.22, -swingVel * 0.12));
    ctx.save();
    ctx.translate(pendX, y);
    ctx.rotate(lean);
    if (img.complete && img.naturalWidth > 0) {
      // drawPiece와 완전히 같은 크기/기준으로 그려서 낙하 시작 순간 크기가 안 바뀌게 함
      const { w, h, offsetX, offsetY } = overlapDrawSize(currentType);
      ctx.globalAlpha = 0.95;
      ctx.drawImage(img, offsetX, offsetY, w, h);
    }
    ctx.restore();

    // 다음 다음 조각 미리보기 (작게, 우측 상단)
    const nImg = sprites[nextType];
    if (nImg.complete && nImg.naturalWidth > 0) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      ctx.translate(GAME_W - 38, 56);
      const nw = 44, nh = 44 * (nImg.naturalHeight / nImg.naturalWidth);
      ctx.drawImage(nImg, -nw/2, -nh/2, nw, nh);
      ctx.restore();
    }
  }

  // --- 돌풍 시각 효과 ---
  // 예고(warning): 화면 가장자리에 노란 경고 테두리가 깜빡임 + "⚠️ 돌풍 경보!"
  // 실제로 붊(blow): 화면 전체에 굵은 바람 줄무늬가 쫙 지나가고 + 큰 "💨 돌풍!!" 문구
  if (gustState === 'warning') {
    const remain = gustWarnUntil - performance.now();
    const blink = Math.sin(remain * 0.04) > 0; // 빠르게 깜빡
    if (blink) {
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 8;
      ctx.strokeRect(4, 4, GAME_W - 8, GAME_H - 8);
      ctx.globalAlpha = 0.95;
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffcc00';
      ctx.strokeStyle = 'rgba(0,0,0,0.6)';
      ctx.lineWidth = 4;
      ctx.strokeText('⚠️ 돌풍 경보!', GAME_W / 2, 70);
      ctx.fillText('⚠️ 돌풍 경보!', GAME_W / 2, 70);
      ctx.restore();
    }
  } else if (gustState === 'blow') {
    const t = 1 - (gustBlowUntil - performance.now()) / 900; // 0→1 (900ms로 늘어남)
    const alpha = Math.sin(Math.min(Math.max(t, 0), 1) * Math.PI); // 0→1→0
    ctx.save();
    // 폭풍 느낌으로 화면 전체를 어둡게 틴트(예전엔 밝은 하늘색이라 밋밋했음)
    ctx.globalAlpha = alpha * 0.4;
    ctx.fillStyle = '#2b3a55';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    // 빗줄기처럼 화면 전체에 촘촘하게 대각선 줄무늬(예전보다 훨씬 많고 빽빽하게)
    ctx.globalAlpha = alpha * 0.8;
    ctx.strokeStyle = '#dff2ff';
    ctx.lineWidth = 2;
    const rainCount = 40;
    for (let i = 0; i < rainCount; i++) {
      const seedX = (i * 97 + t * 900 * (gustDir > 0 ? 1 : -1)) % (GAME_W + 200) - 100;
      const y0 = (i * 53) % GAME_H;
      ctx.beginPath();
      ctx.moveTo(seedX, y0);
      ctx.lineTo(seedX + gustDir * 26, y0 + 34);
      ctx.stroke();
    }
    ctx.globalAlpha = Math.min(alpha * 1.4, 1);
    ctx.font = 'bold 30px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 6;
    ctx.strokeText('🌪️ 태풍!!', GAME_W / 2, 100);
    ctx.fillText('🌪️ 태풍!!', GAME_W / 2, 100);
    ctx.restore();
  }

  // 번쩍임(번개) — 태풍이 몰아치기 시작하는 순간 화면이 하얗게 확 번쩍
  if (performance.now() < lightningUntil) {
    const lt = 1 - (lightningUntil - performance.now()) / 140;
    ctx.save();
    ctx.globalAlpha = (1 - lt) * 0.85;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, GAME_W, GAME_H);
    ctx.restore();
  }
}

// [로딩 개선] 예전엔 이미지가 준비되기 전에 렌더링이 먼저 시작돼서, 빈 배경 →
// 배경만 뜬 상태 → 흰 박스 → 표정 생김 순으로 뚝뚝 끊겨 보였음. 이제 핵심
// 이미지(바닥·받침대·처음 두 블록)가 실제로 로드될 때까지 로딩 화면으로 가려두고,
// 다 준비된 다음에야 화면을 보여주고 시작 연출(효과음 등)을 튼다.
const criticalImages = [groundSimpleImg, platformImg, sprites[currentType], sprites[nextType]].filter(Boolean);
let loadingRevealed = false;

function revealGame() {
  if (loadingRevealed) return;
  loadingRevealed = true;
  const el = document.getElementById('loadingOverlay');
  el.classList.add('hidden');
  setTimeout(() => { el.style.display = 'none'; }, 450);

  // [최초 시작 연출] 화면이 실제로 보이는 이 순간에 맞춰 게임 시작 효과음과 그
  // 블록의 귀여운 소리를 함께 재생. 브라우저 자동재생 정책 때문에 막힐 수 있는데,
  // 그런 경우 위에서 등록한 첫 입력 시 unlockAudioOnFirstInput이 배경음악은
  // 되살리고, 이 시작 사운드 자체는 한 번뿐이라 놓쳐도 게임 진행에는 지장 없음.
  playGameStartSound();
  playBlockCuteSound(currentType);
  updateBgmForFloor(floorCount);

  // [중요] 게임 루프(물리 진행 포함)는 화면이 실제로 보이기 시작하는 지금부터
  // 돌린다. 로딩 화면 뒤에서 미리 돌고 있었다면, 첫 블록은 0.4초면 다 떨어지는데
  // 로딩이 그보다 오래 걸리는 순간 이미 다 떨어져서 착지해버린 뒤에 화면이
  // 열려서 "떨어지는 장면"을 놓치게 됨 — 그래서 로딩 중엔 아예 루프를 안 돌림.
  requestAnimationFrame(loop);
}

let criticalLoadedCount = 0;
function onCriticalImageReady() {
  criticalLoadedCount++;
  if (criticalLoadedCount >= criticalImages.length) revealGame();
}
if (criticalImages.length === 0) {
  revealGame();
} else {
  criticalImages.forEach(img => {
    if (img.complete && img.naturalWidth) onCriticalImageReady();
    else {
      img.addEventListener('load', onCriticalImageReady);
      img.addEventListener('error', onCriticalImageReady); // 하나가 실패해도 전체가 멈추지 않게
    }
  });
}
setTimeout(revealGame, 2500); // 안전장치 — 로딩이 예상보다 오래 걸려도 2.5초 뒤엔 강제로 시작
</script>
</body>

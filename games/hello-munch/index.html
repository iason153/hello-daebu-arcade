'use strict';

// 헬로 샤크 — 도형 프로토타입 (그림 없이 손맛·속도·발판 규칙만 확인하는 용도)
// 설계문서 v0.1 기준: 좌/우 탭 → 바로 윗층 그쪽 발판으로 점프, 실수하면 한 층 추락,

// =====================================================================
const W = 380, H = 820;               // 게임 좌표(헬로타워와 같은 세로 캔버스)
const ROW = 112;                       // 발판 한 칸 높이 = 1m (100도 다닥다닥 → 112로 벌림)
const WALL = 30;                       // 양쪽 벽 두께
const LW = 104, LH = 16;               // 발판 크기
const HERO_Y = 380;                    // 헬로가 서 있는 화면 높이(카메라 기준)
const SHARK_REST = H - 220;            // 상어가 멀리 있을 때 화면에 머무는 높이

const LUNGE_T = .9;   // 덥석 한 번 걸리는 시간(초) — 조금 느리게 해서 육중함을 보이게
const DEFAULTS = { speed: 1, rubber: 3.5, jump: 200, lunge: 0.3 };
let TUNE = { ...DEFAULTS };

// ---------------------------------------------------------------- 구간
const ZONES = [
  { from: 0,  name: '앞바다', top: '#7cc8ee', bot: '#bfe7f5', wall: '#6b5a4a', seam: '#57493c' },
  { from: 60, name: '하늘',        top: '#6fb4e6', bot: '#a9daf2', wall: '#9aa3ad', seam: '#7c858f' },
  { from: 150, name: '구름 위',       top: '#4f7fd0', bot: '#9cc3ee', wall: '#e8eef8', seam: '#c3cfe2' },
  { from: 270, name: '우주',          top: '#0e1440', bot: '#2a2f6e', wall: '#6d7390', seam: '#555a74' },
  { from: 400, name: '우주 너머',      top: '#2a1850', bot: '#5a3a86', wall: '#f1e2b8', seam: '#d1bd87' },
  { from: 500, name: '신들의 나라',   top: '#f7d27a', bot: '#fff1c9', wall: '#fff6de', seam: '#e9d8a8' },
];
const zoneAt = (f) => { let z = ZONES[0]; for (const q of ZONES) if (f >= q.from) z = q; return z; };

// 상어 기본 속도(층/초) — 문서의 구간 표
function sharkBase(f) {
  const pts = [[0, .8], [60, 1.3], [150, 1.9], [270, 2.6], [400, 3.1], [500, 3.4]];
  if (f >= 500) return 3.4 + Math.min(.8, (f - 500) * .004);   // 신들의 나라 이후엔 아주 천천히 계속 빨라짐
  for (let i = 0; i < pts.length - 1; i++) {
    const [a, va] = pts[i], [b, vb] = pts[i + 1];
    if (f < b) return va + (vb - va) * ((f - a) / (b - a));
  }
  return 3.4;
}
// 구간이 바뀌는 곳마다 쉼터(넓은 양쪽 발판 4칸, 괴물이 숨을 고름)
const REST_LEN = 4;
const isRest = (f) => ZONES.some(z => z.from > 0 && f >= z.from && f < z.from + REST_LEN);

// ---------------------------------------------------------------- 발판 생성
let floors, lastSides;
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function makeLedge(f, allowHazard) {
  const r = Math.random();
  let type = 'rock';
  // 새 요소 등장: 60m 금 간 통나무 · 150m 미끄러운 발판 · 210m 갈매기 · 270m 움직이는 발판 · 400m부터 비율 상승
  const hard = f >= 400 ? 1.25 : 1;
  if (f >= 270 && r < .16 * hard) type = 'move';
  else if (f >= 210 && allowHazard && r < .28 * hard) type = 'gull';
  else if (f >= 150 && r < .40 * hard) type = 'weed';
  else if (f >= 60 && r < .58 * hard) type = 'crack';
  const l = { type, broken: false, phase: Math.random() * Math.PI * 2 };
  // 황금조개: 위험한 발판 위에 더 자주 → 욕심 vs 안전
  if (f >= 5 && Math.random() < (type === 'rock' ? .06 : .26)) l.item = 'shell';
  if (f >= 150 && !l.item && Math.random() < .02) l.item = 'tube';
  return l;
}
function genFloor(f) {
  if (floors[f]) return;
  if (f <= 0) { floors[f] = { L: { type: 'rock' }, R: { type: 'rock' } }; return; }
  if (isRest(f)) { floors[f] = { L: { type: 'rock', rest: true }, R: { type: 'rock', rest: true }, rest: true }; lastSides.push('B'); return; }
  const forced = floors[f] && floors[f].force;
  const bothP = Math.max(.18, .62 - f * .0016);   // 초반엔 양쪽 발판이 많아 여유 → 점점 한쪽만
  let sides;
  if (Math.random() < bothP) sides = ['L', 'R'];
  else {
    let s = pick(['L', 'R']);
    // 같은 쪽 3층 연속 금지 → 좌우를 계속 오가게
    // (150m부터는 가끔 같은 쪽 3연속 허용 → 읽고 누르는 실력)
    if (lastSides.length >= 2 && lastSides.slice(-2).every(x => x === s) && !(f >= 150 && Math.random() < .35)) s = s === 'L' ? 'R' : 'L';
    sides = [s];
  }
  lastSides.push(sides.length === 1 ? sides[0] : 'B');
  const fl = { L: null, R: null };
  for (const s of sides) fl[s] = makeLedge(f, sides.length === 2);
  // 양쪽이면 둘 다 위험(갈매기)인 층은 만들지 않음
  if (fl.L && fl.R && fl.L.type === 'gull' && fl.R.type === 'gull') fl.R.type = 'rock';
  // 한쪽뿐이면 그 발판은 반드시 밟을 수 있는 것
  if (sides.length === 1 && fl[sides[0]].type === 'gull') fl[sides[0]].type = 'rock';
  // 부표(3층 위로 튕김) — 착지할 3층 위에 바위 발판을 미리 확보
  if (f >= 110 && sides.length === 1 && Math.random() < .07 && ![1, 2, 3].some(k => isRest(f + k))) {
    fl[sides[0]].type = 'buoy';
    floors[f + 3] = { L: { type: 'rock', broken: false }, R: null, reserved: true };
  }
  floors[f] = fl;
}
// ---------------------------------------------------------------- 하늘을 지나가는 것들(헬로 타워와 같은 방식)
// 앞바다·하늘: 새(가끔 철새 V자 편대, 가까이 나는 큰 새) · 구름 위: 비행기 · 우주부터: 우주선
let trav = {};
function genTrav(f) {
  const list = [];
  const add = (o) => list.push(Object.assign({ off: Math.random(), xOffset: Math.random() * W, seed: Math.random() * 1000 }, o));
  const dir = () => (Math.random() < .5 ? -1 : 1);
  if (f < 150) {
    if (Math.random() < .45) {
      if (Math.random() < .05) {                         // 철새 무리
        const d = dir(), sp = d * (20 + Math.random() * 10), bx = Math.random() * W, n = 5 + Math.floor(Math.random() * 5), off = Math.random();
        for (let i = 0; i < n; i++) { const side = i % 2 ? -1 : 1, rank = Math.ceil(i / 2); list.push({ type: 'bird', off: off + rank * .03, xOffset: (bx + rank * 16 * side + W) % W, speed: sp, seed: i * 3, size: 7 + Math.random() * 2 }); }
      } else { const big = Math.random() < .15; add({ type: 'bird', speed: dir() * (big ? 30 + Math.random() * 10 : 16 + Math.random() * 14), size: big ? 14 + Math.random() * 4 : 6 + Math.random() * 4 }); }
    }
  } else if (f < 270) { if (Math.random() < .16) add({ type: 'plane', speed: dir() * (34 + Math.random() * 16), size: 13 + Math.random() * 5 }); }
  else if (Math.random() < .16) add({ type: 'ship', speed: dir() * (26 + Math.random() * 18), size: 10 + Math.random() * 5 });
  trav[f] = list;

// ---------------------------------------------------------------- 신들의 나라: 헬로 타워처럼 신들이 한 무리로 반겨줌
// 세계 좌표에 고정(구름 발판 위) → 헬로가 올라가면 자연스럽게 화면에 들어옴
const GOD_FLOOR = 503.6;      // 쉼터(500~503m) 바로 위
const GODS = [
  { k: 'god_zeus', xf: .17, dy: 8, w: 104, name: '제우스' },
  { k: 'god_athena', xf: .39, dy: -16, w: 96, name: '아테나' },
  { k: 'god_poseidon', xf: .61, dy: 4, w: 98, name: '포세이돈' },
  { k: 'god_apollo', xf: .83, dy: -10, w: 99, name: '아폴론' },
];
function drawGods() {
  if (cam < GOD_FLOOR - 10 || cam > GOD_FLOOR + 10) return;
  const base = screenY(GOD_FLOOR);
  // 황금빛 후광

  gl.addColorStop(0, 'rgba(255,240,180,.55)'); gl.addColorStop(1, 'rgba(255,230,150,0)');
  ctx.fillStyle = gl; ctx.fillRect(0, base - 360, W, 600);
  const cheer = endingShown && now - (hero.godsAt || 0) < 4000;   // 도착 직후엔 들썩이며 환영
  GODS.forEach((g, i) => {
    const im = IMG[g.k]; if (!ready(im)) return;
    const h = g.w * im.naturalHeight / im.naturalWidth;
    const bob = Math.sin(now / 700 + i * 1.7) * 4 + (cheer ? -Math.abs(Math.sin(now / 160 + i)) * 12 : 0);
    const x = W * g.xf - g.w / 2, y = base + g.dy - h + bob;
    if (y > H + 40 || y + h < -40) return;
    ctx.drawImage(im, x, y, g.w, h);
    if (cheer && (now / 300 + i) % 1 < .3) star(x + g.w * .8, y + 20, 7);
  });
}
function drawTravelers() {
  const f0 = Math.max(0, Math.floor(cam - (H - HERO_Y) / ROW) - 1), f1 = Math.ceil(cam + HERO_Y / ROW) + 1;
  ctx.save();
  for (let f = f0; f <= f1; f++) {
    for (const t of trav[f] || []) {
      const y = screenY(f + t.off);
      if (y < -40 || y > H + 40) continue;
      const x = ((t.xOffset + (now / 1000) * t.speed) % (W + 80) + (W + 80)) % (W + 80) - 40;
      if (t.type === 'bird') {
        const flap = Math.sin(now * .01 + t.seed) * .6;
        ctx.strokeStyle = 'rgba(70,70,80,.75)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x - t.size, y - flap * t.size); ctx.lineTo(x, y); ctx.lineTo(x + t.size, y - flap * t.size); ctx.stroke();
      } else if (t.type === 'plane') {
        const d = t.speed > 0 ? 1 : -1, s = t.size;
        ctx.save(); ctx.translate(x, y);
        ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-d * s * 2.6, 0); ctx.lineTo(-d * s, 0); ctx.stroke();
        ctx.fillStyle = 'rgba(225,230,240,.95)'; ctx.strokeStyle = 'rgba(85,90,105,.9)'; ctx.lineWidth = 1;
        const poly = (pts) => { ctx.beginPath(); pts.forEach(([px, py], i) => i ? ctx.lineTo(d * px * s, py * s) : ctx.moveTo(d * px * s, py * s)); ctx.closePath(); ctx.fill(); ctx.stroke(); };
        poly([[1.15, 0], [.25, -.11], [-.95, -.09], [-1.1, 0], [-.95, .09], [.25, .11]]);                                   // 동체

      x += Math.cos(ang) * len / segs; y += Math.sin(ang) * len / segs; pts.push([x, y]);
    }
    for (const [col, extra] of [['#2a0c16', 4], ['#e2553f', 0]]) {       // 테두리 → 몸
      for (let i = 0; i < segs; i++) {
        ctx.strokeStyle = col; ctx.lineCap = 'round';
        ctx.lineWidth = 28 * (1 - i / segs) + 4 + extra;
        ctx.beginPath(); ctx.moveTo(pts[i][0], pts[i][1]); ctx.lineTo(pts[i + 1][0], pts[i + 1][1]); ctx.stroke();
      }
    }
    ctx.strokeStyle = 'rgba(255,190,150,.5)'; ctx.lineWidth = 3;             // 광택
    ctx.beginPath(); ctx.moveTo(pts[1][0] - side * 5, pts[1][1]); for (let i = 2; i < segs - 2; i++) ctx.lineTo(pts[i][0] - side * 5 * (1 - i / segs), pts[i][1]); ctx.stroke();
    for (let i = 2; i < segs - 2; i += 2) {                                   // 빨판
      const r = 5 * (1 - i / segs) + 1.5;
      ctx.fillStyle = '#ffd9cf'; ctx.strokeStyle = '#8a2a2a'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(pts[i][0] + side * r * 1.2, pts[i][1], r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
  }
}

function drawShark() {
  const M = mouthGeom();
  const img = IMG[MONSTER_KEYS[M.frame]];
  const close = hero.pos - sharkTop() < 2.2;
  const top0 = M.spriteTop;
  drawTents(M);
  // 숨쉬기 + 덥석 찌부 (발밑 기준으로 늘였다 줄임)
  const breath = Math.sin(now / 520);
  let sx = 1 + breath * .01, sy = 1 - breath * .014;
  if (M.frame === 4) { sx *= 1.03; sy *= .955; }
  if (M.frame === 0 && close) { sx *= 1.012; sy *= 1.018; }
  const baseY = top0 + SPR_H;
  ctx.save();
  ctx.translate(W / 2, baseY); ctx.scale(sx, sy); ctx.translate(-W / 2, -baseY);
  // 몸통 이어 붙이기 → 그 아래는 어둡게
  // 새 몸통: 폭을 입 그림 몸통 폭(원본 약 1100px)에 맞추고 입 중심에 정렬
  const BK = 1100 / 680 * S, bodyW = 680 * BK, bodyH = 1242 * BK;
  const bodyX = SPR_LEFT + 605 * S - bodyW / 2, bodyY = baseY - 230 * S;   // 입 그림 아래쪽과 넉넉히 겹쳐 그림
  const g = ctx.createLinearGradient(0, baseY + bodyH * .7, 0, baseY + bodyH + 60);
  g.addColorStop(0, 'rgba(29,20,48,0)'); g.addColorStop(1, 'rgba(29,20,48,1)');
  ctx.fillStyle = g; ctx.fillRect(-20, baseY + bodyH * .7, W + 40, bodyH * .3 + 60);
  ctx.fillStyle = '#1d1430'; ctx.fillRect(-20, baseY + bodyH + 58, W + 40, Math.max(0, H - (baseY + bodyH)) + 40);
  if (close) { ctx.shadowColor = 'rgba(255,40,60,.5)'; ctx.shadowBlur = 26 + Math.sin(now / 110) * 8; }
  if (ready(img)) ctx.drawImage(img, SPR_LEFT, top0, SPR_W, SPR_H);
  ctx.shadowBlur = 0;
  // 몸통은 입 그림 '위에' 덮되 윗부분이 서서히 투명 → 경계선 없이 스며들듯 이어짐
  if (bodyCanvas) ctx.drawImage(bodyCanvas, bodyX, bodyY, bodyW, bodyH);
  ctx.restore();
  // 삼켜지는 파편 — 목구멍 안에서만 보이게
  ctx.save(); ctx.beginPath(); ctx.ellipse(M.cx, M.jawY, M.mw * .44, M.mh * .42, 0, 0, Math.PI * 2); ctx.clip();
  drawParticles(true); ctx.restore();
  ctx.fillStyle = '#ff5f86';
  for (const d of drips) { ctx.beginPath(); ctx.ellipse(d.x, d.y, 3, d.len / 2 + 2, 0, 0, Math.PI * 2); ctx.fill(); }
  if (now - shark.chompAt < 260) {   // 쿵! 효과선
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 5;
    for (let i = 0; i < 7; i++) { const a = Math.PI + (i / 6) * Math.PI; ctx.beginPath(); ctx.moveTo(M.cx + Math.cos(a) * (M.mw / 2 + 20), M.jawY + Math.sin(a) * 70); ctx.lineTo(M.cx + Math.cos(a) * (M.mw / 2 + 60), M.jawY + Math.sin(a) * 115 - 10); ctx.stroke(); }
  }
}

function drawHud(dd) {
  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = '38px Jua, sans-serif'; ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(10,20,50,.55)'; ctx.fillStyle = '#fff';
  ctx.strokeText(score + 'm', 46, 18); ctx.fillText(score + 'm', 46, 18);
  ctx.font = '15px "Noto Sans KR", sans-serif'; ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText(zoneAt(hero.floor).name + (tubes ? ' · 튜브' : ''), 48, 62);
  // 황금조개 게이지(10칸) — 다 차면 헬로 로켓
  { const gx0 = 76, gy0 = 88, cw = 13;
    if (ready(IMG.shell_gold)) ctx.drawImage(IMG.shell_gold, 44, 80, 26, 25);
    for (let i = 0; i < 10; i++) {
      ctx.fillStyle = i < shells ? '#ffc857' : 'rgba(10,20,50,.4)';
      ctx.beginPath(); ctx.roundRect(gx0 + i * (cw + 2), gy0, cw, 10, 3); ctx.fill();
    }
    if (shells >= 8 && !rocket) { ctx.fillStyle = `rgba(255,240,170,${.4 + .4 * Math.sin(now / 90)})`; ctx.beginPath(); ctx.roundRect(gx0 - 2, gy0 - 2, 10 * (cw + 2) + 2, 14, 4); ctx.fill(); }
  }
  // 상어 거리 게이지(오른쪽)
  const gx = W - 22, gy = 110, gh = 220;
  ctx.fillStyle = 'rgba(10,20,50,.35)'; ctx.beginPath(); ctx.roundRect(gx - 6, gy, 12, gh, 6); ctx.fill();
  const frac = Math.max(0, Math.min(1, dd / 8));
  ctx.fillStyle = dd < 2 ? '#ff5a4f' : dd < 4 ? '#ffc857' : '#6fe3a1';
  ctx.beginPath(); ctx.roundRect(gx - 6, gy + gh * (1 - frac), 12, gh * frac, 6); ctx.fill();
  ctx.textAlign = 'center'; ctx.font = '12px "Noto Sans KR", sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText('괴물', gx, gy + gh + 6); ctx.fillText(Math.max(0, dd).toFixed(0) + 'm', gx, gy + gh + 22);

  // 팝업
  for (const p of popups) {
    const t = (now - p.t0) / (p.long ? 2600 : 900);
    if (p.rocket) { ctx.globalAlpha = Math.min(1, (1 - t) * 3); drawRocketTitle(p, t); ctx.globalAlpha = 1; continue; }
    if (p.zone) {   // 새 구간 이름: 가운데 띠
      ctx.globalAlpha = Math.min(1, t * 6, (1 - t) * 3);
      ctx.fillStyle = 'rgba(11,20,48,.55)'; ctx.fillRect(0, p.y - 28, W, 56);
      ctx.font = '38px Jua, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#ffe9a8';
      ctx.fillText('— ' + p.text + ' —', W / 2, p.y); ctx.textBaseline = 'top'; ctx.globalAlpha = 1; continue;
    }
    ctx.globalAlpha = Math.min(1, (1 - t) * 2);
    ctx.font = (p.big ? '34px' : '20px') + ' Jua, sans-serif'; ctx.textAlign = 'center';
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 5; ctx.fillStyle = p.big || p.gold ? '#ffc857' : '#fff';
    const y = p.y - t * 30;
    ctx.strokeText(p.text, p.x, y); ctx.fillText(p.text, p.x, y);
  }
  ctx.globalAlpha = 1;

  if (state === 'ready') {
    panel('헬로 먼치', ['우주괴물이 올라와요! 위로 도망치세요', '화면 왼쪽 탭 → 왼쪽 윗발판', '화면 오른쪽 탭 → 오른쪽 윗발판', '황금조개 10개 모으면 헬로 로켓!'], assetsLoaded() ? '아무 데나 탭해서 시작' : '불러오는 중...');
    // 좌우 구분선
    ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(W / 2, 560); ctx.lineTo(W / 2, 800); ctx.stroke(); ctx.setLineDash([]);
  }
  ctx.restore();
}
function panel(title, lines, cta) {
  const pw = 300, ph = 150 + lines.length * 26, px = (W - pw) / 2, py = 150;
  ctx.fillStyle = 'rgba(11,20,48,.86)'; ctx.beginPath(); ctx.roundRect(px, py, pw, ph, 18); ctx.fill();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#ffc857'; ctx.font = '36px Jua, sans-serif'; ctx.fillText(title, W / 2, py + 20);
  ctx.fillStyle = '#eef3ff'; ctx.font = '16px "Noto Sans KR", sans-serif';
  lines.forEach((l, i) => ctx.fillText(l, W / 2, py + 76 + i * 26));
  ctx.fillStyle = '#6fe3a1'; ctx.font = '19px Jua, sans-serif'; ctx.fillText(cta, W / 2, py + ph - 40);
}

const sndBtn = document.getElementById('snd');
function syncSnd() { sndBtn.textContent = muted ? '🔇' : '🔊'; sndBtn.setAttribute('aria-pressed', String(muted)); }
sndBtn.addEventListener('click', (e) => {
  e.stopPropagation(); muted = !muted; syncSnd(); audio();
  if (master) master.gain.value = muted ? 0 : 1;
  try { localStorage.setItem('munch-mute', muted ? '1' : '0'); } catch (er) {}
});
syncSnd();

// ---------------------------------------------------------------- 루프
let last = performance.now();
function frame(t) {
  now = t;
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  update(dt); draw();
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- 정식 버전: 로딩·GA4·결과·랭킹·공유
const GA_GAME = 'hello_munch';
function track(name, params) { try { if (typeof gtag === 'function') gtag('event', name, Object.assign({ game: GA_GAME }, params || {})); } catch (e) {} }
const CRITICAL = ['m1_open', 'hello_round', 'bg_start', 'ledge_grass', 'ledge_rock'];
function assetsLoaded() { return CRITICAL.every(k => ready(IMG[k])); }
document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; clearTimeout(t._h); t._h = setTimeout(() => { t.style.opacity = '0'; }, 2500); }
function showOverlay() {
  if (state !== 'over') return;
  document.getElementById('ovScore').textContent = score + 'm';
  document.getElementById('ovSub').textContent = `${zoneAt(score).name}까지 도망쳤어요 · 황금조개 ${shellsTotal}개\n최고 기록 ${best}m`;
  document.getElementById('ovSub').style.whiteSpace = 'pre-line';
  document.getElementById('rankMsg').textContent = '';
  document.getElementById('overlay').hidden = false;
  document.getElementById('retryBtn').focus({ preventScroll: true });
}
document.getElementById('retryBtn').addEventListener('click', () => { reset(); });

// 랭킹 등록 — 다른 게임과 같은 /api/score (점수 필드 이름은 공용 "meters")
(function () {
  try {
    const n = localStorage.getItem('hm_nickname') || localStorage.getItem('ht_nickname');
    const c = localStorage.getItem('hm_contact') || localStorage.getItem('ht_contact');
    if (n) document.getElementById('rankNickname').value = n;
    if (c) document.getElementById('rankContact').value = c;
  } catch (e) {}
  let sentFor = -1;
  document.getElementById('rankSubmitBtn').addEventListener('click', async () => {
    const nick = document.getElementById('rankNickname').value.trim();
    const contact = document.getElementById('rankContact').value.trim();
    const msg = document.getElementById('rankMsg');
    if (!nick || !contact) { msg.textContent = '닉네임과 연락처를 모두 입력해주세요.'; return; }
    if (score <= 0) { msg.textContent = '1m 이상 올라가야 등록할 수 있어요.'; return; }
    if (sentFor === overAt) { msg.textContent = '이번 기록은 이미 등록했어요.'; return; }
    try { localStorage.setItem('hm_nickname', nick); localStorage.setItem('hm_contact', contact); } catch (e) {}
    msg.textContent = '등록 중...';
    try {
      const res = await fetch('/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'hello_munch', nickname: nick, contact, meters: score }) });
      if (!res.ok) { msg.textContent = '등록에 실패했어요. 다시 시도해주세요.'; return; }
      sentFor = overAt;
      msg.textContent = '등록됐어요! 🎉';
      track('score_submit', { score });
      try {
        const data = await res.json();
        if (data && data.throne) { msg.innerHTML = '👑 왕좌에 올랐어요! <a href="../../hall-of-fame.html?g=hello_munch">헬로 신전에서 왕좌 카드 받기</a>'; track('throne_won', { score }); }
      } catch (e) {}
    } catch (e) { msg.textContent = '네트워크 오류예요. 다시 시도해주세요.'; }
  });
})();

// 카카오톡 공유 — 결과 카드(640×800)를 그려서 올림
const shareBg = new Image();
const shareBgReady = new Promise((ok) => { shareBg.onload = () => ok(true); shareBg.onerror = () => ok(false); });
shareBg.src = 'assets/share-card-bg.jpg';
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function buildShareCard() {
  const cw = 640, ch = 800, sc = document.createElement('canvas'); sc.width = cw; sc.height = ch;
  const c = sc.getContext('2d');
  rr(c, 0, 0, cw, ch, 28); c.save(); c.clip();
  if (shareBg.complete && shareBg.naturalWidth > 0) c.drawImage(shareBg, 0, 0, cw, ch);
  else {   // 전용 배경이 오기 전: 우주 밤하늘 + 괴물 입
    const g = c.createLinearGradient(0, 0, 0, ch); g.addColorStop(0, '#0e1440'); g.addColorStop(1, '#5a3a86'); c.fillStyle = g; c.fillRect(0, 0, cw, ch);
    c.fillStyle = 'rgba(255,255,255,.8)'; for (let i = 0; i < 70; i++) c.fillRect((i * 97) % cw, (i * 211) % 560, 2, 2);
    if (ready(IMG.m0_wide)) c.drawImage(IMG.m0_wide, -140, 470, cw + 280, (cw + 280) * 900 / 1140);
  }
  c.textAlign = 'center';
  c.save(); c.shadowColor = 'rgba(255,190,60,.9)'; c.shadowBlur = 30; c.font = '900 92px sans-serif'; c.lineWidth = 8; c.strokeStyle = '#fff';
  c.strokeText(score + 'm', cw / 2, 200); c.fillStyle = '#ff9d1f'; c.fillText(score + 'm', cw / 2, 200); c.restore();
  c.font = '600 20px sans-serif'; c.fillStyle = shareBg.naturalWidth ? '#3a2a12' : '#fff';
  c.fillText('👾 헬로 먼치 · 대부도 오락실', cw / 2, 320);
  if (ready(IMG.hello_round)) c.drawImage(IMG.hello_round, cw / 2 - 110, 450 - 110, 220, 220);
  const cta = '👉  daebugame.com 놀러가기'; c.font = '800 26px sans-serif';
  const w = Math.min(cw - 48, c.measureText(cta).width + 60), y = 720, h = 56;
  rr(c, cw / 2 - w / 2, y, w, h, h / 2); c.fillStyle = '#ffc857'; c.fill();
  c.fillStyle = '#2a1c00'; c.fillText(cta, cw / 2, y + h / 2 + 9);
  c.restore(); rr(c, 2, 2, cw - 4, ch - 4, 28); c.lineWidth = 4; c.strokeStyle = 'rgba(255,200,87,.55)'; c.stroke();
  return sc;
}
const blobToB64 = (b) => new Promise((ok, no) => { const r = new FileReader(); r.onloadend = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); });
document.getElementById('shareBtn').addEventListener('click', async (e) => {
  e.stopPropagation();
  const btn = e.currentTarget, label = btn.textContent;
  track('share_click', { score });
  btn.disabled = true; btn.textContent = '⏳ 카드 만드는 중...';
  await Promise.race([shareBgReady, new Promise((r) => setTimeout(r, 3000))]);
  const sc = buildShareCard();
  sc.toBlob(async (blob) => {
    try {
      if (!blob) { toast('카드 생성에 실패했어요 😢'); return; }
      if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
        try {
          const up = await fetch('/api/kakao-upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageBase64: await blobToB64(blob) }) });
          if (up.ok) {
            const { url } = await up.json();
            const link = { mobileWebUrl: 'https://daebugame.com/games/hello-munch/', webUrl: 'https://daebugame.com/games/hello-munch/' };
            window.Kakao.Share.sendDefault({ objectType: 'feed',
              content: { title: `헬로 먼치에서 ${score}m 도망쳤어요!`, description: '우주괴물에게서 살아남아라! · daebugame.com', imageUrl: url, link },
              buttons: [{ title: '나도 도전하기', link }] });
            toast('카카오톡 공유창을 열었어요! 📤'); return;
          }
        } catch (er) {}
      }
      const file = new File([blob], `hello-munch-${score}m.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: `헬로 먼치 ${score}m`, text: `헬로 먼치에서 ${score}m 도망쳤어요! daebugame.com` }); return; }
        catch (er) { if (er && er.name === 'AbortError') return; }
      }
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000); toast('이미지로 저장했어요! 📥');
    } finally { btn.disabled = false; btn.textContent = label; }
  }, 'image/png');
});
reset(); fit(); requestAnimationFrame(frame);
})();

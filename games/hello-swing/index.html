      g.save();const br=1+Math.sin(t*0.11)*0.012;g.translate(mx+205,H);g.scale(1+(lunge>0?0.03:0)+Math.sin(t*0.07)*0.008,br);g.translate(-(mx+205),-H);
      const wf=1+Math.floor(t/5)%3;
      if(swallowed){const im=IMG['shut'+wf];if(im.complete)g.drawImage(im,mx,my-8,410,H+16);}
      else{const order=['teeth','half','open','wide'],f=order[Math.max(0,Math.min(3,Math.round(mouthO*3)))];curF=f;
        const im=IMG[f==='wide'?'wide1':f+wf];if(im.complete)g.drawImage(im,mx,my-8,410,H+16);}

    }
    drawSea(1); // 괴물 밑동을 같은 그림체의 파도가 덮는다 → 바다에서 솟아오른 파도 괴물
    for(const q of spray){g.fillStyle=q.c;g.globalAlpha=Math.min(1,q.l/14);g.beginPath();g.arc(q.x,q.y,q.r,0,7);g.fill();}g.globalAlpha=1; }
  for(const d of drops){g.fillStyle='#e8f6ff';g.beginPath();g.arc(d.x,d.y,4,0,7);g.fill();}
  g.restore();
  const gap=p.x-wave.x;
  if(state==='play'&&lungeWarn>0){const al=0.55*Math.abs(Math.sin(lungeWarn*0.2));for(const [x0,x1] of [[0,95],[W,W-95]]){const rg=g.createLinearGradient(x0,0,x1,0);rg.addColorStop(0,'rgba(255,30,30,'+al+')');rg.addColorStop(1,'rgba(255,30,30,0)');g.fillStyle=rg;g.fillRect(Math.min(x0,x1),0,95,H);}
    if(lungeWarn%16<10)txt('⚠ 덮친다!',W/2,215,'900 26px system-ui','#ff4a4a','center');}
  if(state==='play'&&skips<=0&&!cannon){g.fillStyle='rgba(255,50,50,'+(0.16+0.12*Math.sin(t*0.18))+')';g.fillRect(0,742,W,H-742);}
  if(skipFlash>0){skipFlash--;g.globalAlpha=Math.min(1,skipFlash/20);txt('물수제비!',W/2,430,'900 40px system-ui','#8fe3ff','center');txt(skips>0?'한 번 더 튕길 수 있어요':'이제 빠지면 끝!',W/2,462,'800 17px system-ui',skips>0?'#fff':'#ff8a8a','center');g.globalAlpha=1;}
  drawTut();
  if(state==='play'&&gap<260){g.fillStyle='rgba(255,60,60,'+(0.35*(1-gap/260)*(0.6+0.4*Math.sin(t*0.4)))+')';g.fillRect(0,0,26,H);}
  txt(dist()+'m',18,58,'900 44px system-ui');
  txt('최고 '+best+'m · 괴물 '+Math.max(0,Math.floor((gap-100)/M))+'m 뒤',20,84,'700 15px system-ui');
  for(let i=0;i<10;i++){g.fillStyle=i<shellN?'#ffc93c':'rgba(255,255,255,.35)';g.fillRect(20+i*13,96,10,10);}
  txt('물수제비 '+(skips>1?'●●':skips?'●':'없음!'),W-18,40,'700 15px system-ui',skips?'#8fe3ff':'#ff8a8a','right');
  if(windWarn)txt(windWarn===9?'곧 바람이 멎는다':windWarn>0?'곧 순풍 →→':'←← 곧 역풍',W-18,66,'800 16px system-ui','#fff','right');
  else if(wind)txt(wind>0?'순풍 →→':'←← 역풍',W-18,66,'800 16px system-ui',wind>0?'#9dffb0':'#ff9d9d','right');
  if(banner>0)txt(ZONES[zone].name+(rest>0?' · 쉼터':''),W/2,170,'900 26px system-ui','#fff','center');
  if(state==='play'&&p.y<-125){const ux=(p.x-camX)*ZM;g.fillStyle='#ffd23c';g.strokeStyle='#22364d';g.lineWidth=3;g.beginPath();g.moveTo(ux,100);g.lineTo(ux-11,118);g.lineTo(ux+11,118);g.closePath();g.stroke();g.fill();txt('헬로 '+Math.round((-111-p.y)/M)+'m 위',ux,138,'800 13px system-ui','#fff','center');}
  if(roar>0)txt('파도 괴물이 몰아친다!',W/2,205,'900 22px system-ui','#ff5252','center');
  pops.forEach((q,i)=>{g.globalAlpha=Math.min(1,q.l/25);txt(q.text,W/2,250+i*30-(70-q.l)*0.4,'900 22px system-ui',q.col,'center');g.globalAlpha=1;});
  if(state==='ready'){g.fillStyle='rgba(14,26,43,.8)';g.fillRect(20,280,W-40,268);g.fillStyle='#fff';g.textAlign='center';
    g.font='900 23px system-ui';g.fillText(state==='over'?why:'헬로 스윙',W/2,320);
    if(state==='over'){g.font='900 30px system-ui';g.fillStyle='#ffd23c';g.fillText(score()+'m',W/2,358);g.fillStyle='#fff';g.font='600 14px system-ui';g.fillText('거리 '+dist()+'m + 패스 보너스 '+bonus+'m',W/2,382);}
    g.font='600 15px system-ui';
    ['꾹 누르면 줄을 쏘고 감는다 · 떼면 날아간다','바다에 빠져도 물수제비(●)가 있으면 튕겨요','⚠ 삐삐 경보가 울리면 괴물이 덮쳐요','고리를 지나쳐 날면 패스!','황금조개 10개 = 헬로 대포'].forEach((s,i)=>g.fillText(s,W/2,(state==='over'?408:354)+i*23));
    g.fillStyle='#ffd23c';g.font='700 16px system-ui';g.fillText(state==='over'?'탭해서 다시':'탭해서 시작',W/2,532);}
}
let tutOn=(()=>{try{return localStorage.getItem('hsw_tut')!=='1'}catch(e){return false}})();
function tutDone(){if(!tutOn)return;tutOn=false;try{localStorage.setItem('hsw_tut','1')}catch(e){}}
function drawTut(){ if(!tutOn||state!=='play'||cannon)return;
  let msg,sub,col='#fff';
  if(rope){ if(p.x>rope.a.x-15&&p.vx>1){msg='지금 떼기!';sub='손을 떼면 휙 날아가요';col='#ffd23c';} else {msg='꾹 누르고 있기';sub='줄을 감으며 앞으로 흔들려요';} }
  else {msg='꾹 누르기!';sub='빛나는 고리에 줄이 걸려요';col='#8fe3ff';}
  const by=Math.sin(t*0.25)*5;g.fillStyle='rgba(14,26,43,.72)';g.beginPath();g.rect(60,596,W-120,84);g.fill();
  txt('👆',96,652+by,'34px system-ui','#fff','center');txt(msg,W/2+22,636,'900 26px system-ui',col,'center');txt(sub,W/2+22,662,'700 14px system-ui','#fff','center'); }
function loop(){step();audioTick();draw();requestAnimationFrame(loop);}


// ---------------------------------------------------------------- 정식 버전: GA4·결과·랭킹·공유
const GA_GAME = 'hello_swing';
function track(name, params) { if (name === 'game_start' && window.HelloFair) HelloFair.start(GA_GAME); try { if (typeof gtag === 'function') gtag('event', name, Object.assign({ game: GA_GAME }, params || {})); } catch (e) {} }
let finalScore = 0, overAt = 0;
const $id = (id) => document.getElementById(id);
function toast(msg) { const el = $id('toast'); el.textContent = msg; el.style.opacity = '1'; clearTimeout(el._h); el._h = setTimeout(() => { el.style.opacity = '0'; }, 2500); }
function onGameOver() { if (dist() >= 60) tutDone(); finalScore = score(); overAt = Date.now(); track('game_over', { score: finalScore, dist: dist(), zone: zone + 1 }); setTimeout(showOverlay, 1300); }
function showOverlay() {
  if (state !== 'over') return;
  $id('ovTitle').textContent = why || '풍덩!';
  $id('ovScore').textContent = finalScore + 'm';
  $id('ovSub').textContent = ZONES[zoneOf(dist())].name + '까지 날아갔어요\n최고 기록 ' + best + 'm';
  $id('rankMsg').textContent = '';
  $id('overlay').hidden = false;
  $id('retryBtn').focus({ preventScroll: true });
}
$id('retryBtn').addEventListener('click', () => { $id('overlay').hidden = true; audioInit(); reset(); state = 'play'; track('game_start'); });
$id('snd').textContent = sndOn ? '🔊' : '🔇';
$id('snd').addEventListener('click', () => { sndOn = !sndOn; audioInit(); if (master) master.gain.value = sndOn ? 1 : 0; $id('snd').textContent = sndOn ? '🔊' : '🔇'; try { localStorage.setItem('swing-mute', sndOn ? '0' : '1'); } catch (e) {} });

// 랭킹 등록 — 다른 게임과 같은 /api/score (점수 필드 이름은 공용 "meters")
(function () {
  try {
    const n = localStorage.getItem('hsw_nickname') || localStorage.getItem('hm_nickname') || localStorage.getItem('ht_nickname');
    const c = localStorage.getItem('hsw_contact') || localStorage.getItem('hm_contact') || localStorage.getItem('ht_contact');
    if (n) $id('rankNickname').value = n;
    if (c) $id('rankContact').value = c;
  } catch (e) {}
  let sentFor = -1;
  try { if (window.HelloMember) HelloMember.init({ game: 'hello_swing', unit: 'm', path: '/games/hello-swing/', getScore: () => finalScore, keys: ['hsw_nickname', 'hsw_contact'] }); } catch (e) { /* 회원 안내가 실패해도 게임은 그대로 */ }
  $id('rankSubmitBtn').addEventListener('click', async () => {
    const nick = $id('rankNickname').value.trim(), contact = $id('rankContact').value.trim(), msg = $id('rankMsg');
    if (!nick || !contact) { msg.textContent = '닉네임과 연락처를 모두 입력해주세요.'; return; }
    if (finalScore <= 0) { msg.textContent = '1m 이상 날아가야 등록할 수 있어요.'; return; }
    if (sentFor === overAt) { msg.textContent = '이번 기록은 이미 등록했어요.'; return; }
    try { localStorage.setItem('hsw_nickname', nick); localStorage.setItem('hsw_contact', contact); } catch (e) {}
    msg.textContent = '등록 중...';
    try {
      const res = await fetch('/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: 'hello_swing', nickname: nick, contact, meters: finalScore }) });
      if (!res.ok) { msg.textContent = '등록에 실패했어요. 다시 시도해주세요.'; return; }
      sentFor = overAt;
      msg.textContent = '등록됐어요! 🎉';
      track('score_submit', { score: finalScore });
      try {
        const data = await res.json();
        if (data && data.lower) msg.textContent = '이미 더 높은 기록(' + data.best + 'm)이 랭킹에 있어요. 최고 기록만 남겨요.';
        if (data && data.throne) { msg.innerHTML = '👑 왕좌에 올랐어요! <a href="../../hall-of-fame.html?g=hello_swing">헬로 신전에서 확인하기</a>'; track('throne_won', { score: finalScore }); }
      } catch (e) {}
    } catch (e) { msg.textContent = '네트워크 오류예요. 다시 시도해주세요.'; }
  });
})();

// 카카오톡 공유 — 결과 카드(640×800)를 게임 그림으로 그려서 올림
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
const ok = (im) => im && im.complete && im.naturalWidth > 0;
const shareBg = new Image(); shareBg.src = 'assets/share-card-bg.jpg';
function buildShareCard() {
  const cw = 640, ch = 800, sc = document.createElement('canvas'); sc.width = cw; sc.height = ch;
  const c = sc.getContext('2d');
  rr(c, 0, 0, cw, ch, 28); c.save(); c.clip();
  if (ok(shareBg)) c.drawImage(shareBg, 0, 0, cw, ch);
  else { const sk = c.createLinearGradient(0, 0, 0, ch); sk.addColorStop(0, '#3f8fe8'); sk.addColorStop(1, '#ffd9a0'); c.fillStyle = sk; c.fillRect(0, 0, cw, ch); }
  c.textAlign = 'center';
  c.save(); c.shadowColor = 'rgba(255,190,60,.9)'; c.shadowBlur = 30; c.font = '900 96px sans-serif'; c.lineWidth = 9; c.strokeStyle = '#fff';
  c.strokeText(finalScore + 'm', 280, 235); c.fillStyle = '#ff8a1f'; c.fillText(finalScore + 'm', 280, 235); c.restore();
  c.font = '800 22px sans-serif'; c.lineWidth = 6; c.strokeStyle = 'rgba(20,40,90,.9)'; c.fillStyle = '#fff';
  c.strokeText('파도 괴물에게서 도망쳤어요!', 272, 286); c.fillText('파도 괴물에게서 도망쳤어요!', 272, 286);
  c.font = '700 18px sans-serif'; c.lineWidth = 5;
  c.strokeText('헬로 스윙 · 대부도 오락실', 272, 316); c.fillText('헬로 스윙 · 대부도 오락실', 272, 316);
  if (ok(IMG.heroR)) { c.save(); c.translate(326, 478); c.rotate(-0.1); c.scale(4.4, 4.4); c.drawImage(IMG.heroR, -27.7, -26.8, 56, 47.25);
    for (const [ex, ey, k] of [[3.4, -7, 1], [11.6, -7.2, 0.88]]) { c.fillStyle = '#fff'; c.strokeStyle = '#3a2a1a'; c.lineWidth = 1; c.beginPath(); c.arc(ex, ey, 4.6 * k, 0, 7); c.fill(); c.stroke(); c.fillStyle = '#22180e'; c.beginPath(); c.arc(ex + 1.1, ey + 0.2, 2.5 * k, 0, 7); c.fill(); }
    c.restore(); }
  const cta = '👉  daebugame.com 놀러가기'; c.font = '800 26px sans-serif';
  const w = Math.min(cw - 48, c.measureText(cta).width + 60), y = 720, h = 56;
  rr(c, cw / 2 - w / 2, y, w, h, h / 2); c.fillStyle = '#ffc857'; c.fill();
  c.fillStyle = '#2a1c00'; c.fillText(cta, cw / 2, y + h / 2 + 9);
  c.restore(); rr(c, 2, 2, cw - 4, ch - 4, 28); c.lineWidth = 4; c.strokeStyle = 'rgba(255,200,87,.55)'; c.stroke();
  return sc;
}
const blobToB64 = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onloadend = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
$id('shareBtn').addEventListener('click', async (e) => {
  e.stopPropagation();
  const btn = e.currentTarget, label = btn.textContent;
  track('share_click', { score: finalScore });
  btn.disabled = true; btn.textContent = '⏳ 카드 만드는 중...';
  const sc = buildShareCard();
  sc.toBlob(async (blob) => {
    try {
      if (!blob) { toast('카드 생성에 실패했어요 😢'); return; }
      if (window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()) {
        try {
          const up = await fetch('/api/kakao-upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ imageBase64: await blobToB64(blob) }) });
          if (up.ok) {
            const { url } = await up.json();
            const link = { mobileWebUrl: 'https://daebugame.com/games/hello-swing/', webUrl: 'https://daebugame.com/games/hello-swing/' };
            window.Kakao.Share.sendDefault({ objectType: 'feed',
              content: { title: `헬로 스윙에서 ${finalScore}m 날아갔어요!`, description: '파도 괴물에게서 도망쳐라! · daebugame.com', imageUrl: url, link },
              buttons: [{ title: '나도 도전하기', link }] });
            toast('카카오톡 공유창을 열었어요! 📤'); return;
          }
        } catch (er) {}
      }
      const file = new File([blob], `hello-swing-${finalScore}m.png`, { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: `헬로 스윙 ${finalScore}m`, text: `헬로 스윙에서 ${finalScore}m 날아갔어요! daebugame.com` }); return; }
        catch (er) { if (er && er.name === 'AbortError') return; }
      }
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = file.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000); toast('이미지로 저장했어요! 📥');
    } finally { btn.disabled = false; btn.textContent = label; }
  }, 'image/png');
});
reset(); loop();

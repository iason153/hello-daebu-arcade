<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헬로런 프로토타입 (점프/숙이기 손맛 테스트)</title>
<style>
  *{-webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; -webkit-user-select:none; user-select:none; margin:0; padding:0; box-sizing:border-box;}
  html,body{background:#0f1a30; overflow:hidden; height:100%; width:100%;}
  #wrap{position:fixed; top:0; left:0; width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  canvas{background:#7ec8e3; touch-action:none; display:block;}
  #loading{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-family:sans-serif; font-size:15px;}
  #devBtn{position:fixed; top:8px; right:8px; z-index:70; width:34px; height:34px; border-radius:50%; background:rgba(0,0,0,0.4); color:#fff; border:none; font-size:16px; display:none;}
  #devPanel{position:fixed; top:0; right:0; width:280px; height:100%; background:rgba(10,14,24,0.95); color:#fff; font-family:sans-serif; font-size:12px; padding:12px; padding-top:50px; overflow-y:auto; z-index:60; display:none;}
  #devPanel h4{margin:10px 0 4px; font-size:12px; color:#ffc857;}
  #devPanel label{display:block; margin-top:6px;}
  #devPanel input[type=range]{width:100%; touch-action:pan-y;}
  #devPanel .row{display:flex; justify-content:space-between;}
  #devPanel button{margin-top:10px; width:100%; padding:8px; background:#ffc857; border:none; border-radius:6px; font-weight:bold;}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="loading">불러오는 중...</div>
<div id="gameoverPanel" style="display:none; position:fixed; left:50%; top:56%; transform:translateX(-50%); z-index:80; flex-direction:column; align-items:center; gap:7px; width:250px; max-height:44vh; overflow-y:auto;">
<button id="retryBtn" style="width:100%;background:#2a2f45;color:#fff;font-weight:bold;font-size:13px;padding:9px 0;border:2px solid #ffc857;border-radius:999px;">🔄 다시하기</button>
<button id="shareBtn" style="width:100%;background:#ffc857;color:#2a1c00;font-weight:bold;font-size:13px;padding:9px 0;border:none;border-radius:999px;box-shadow:0 4px 0 #c99425;">📤 친구에게 자랑하기!</button>
<div id="rankPanel" style="width:100%;background:rgba(10,14,24,0.92);border-radius:12px;padding:10px;color:#fff;font-family:sans-serif;">
  <div style="font-size:11px;margin-bottom:5px;color:#ffc857;font-weight:bold;">🏆 이벤트 랭킹 등록</div>
  <input id="rankNickname" placeholder="닉네임" maxlength="12" style="width:100%;box-sizing:border-box;padding:6px;border-radius:6px;border:none;margin-bottom:4px;font-size:12px;">
  <input id="rankContact" placeholder="카카오톡 ID (당첨 연락용)" maxlength="30" style="width:100%;box-sizing:border-box;padding:6px;border-radius:6px;border:none;margin-bottom:5px;font-size:12px;">
  <button id="rankSubmitBtn" style="width:100%;padding:7px;border:none;border-radius:6px;background:#ffc857;color:#2a1c00;font-weight:bold;font-size:12px;">기록 등록하기</button>
  <div id="rankMsg" style="font-size:10px;margin-top:4px;color:rgba(255,255,255,0.75);"></div>
</div>
<a href="../../index.html" style="width:100%;box-sizing:border-box;text-align:center;background:rgba(255,255,255,0.1);color:#fff;font-weight:bold;font-size:12px;padding:8px 0;border:1.5px solid rgba(255,255,255,0.35);border-radius:999px;text-decoration:none;font-family:sans-serif;">🏠 오락실로 돌아가기</a>

</div>
<button id="devBtn">⚙</button>
<a id="rankLinkBtn" href="./ranking.html" style="position:fixed; top:10px; left:10px; z-index:70; display:flex; align-items:center; gap:5px; padding:7px 14px 7px 10px; border-radius:999px; background:rgba(0,0,0,0.45); border:1.5px solid rgba(255,200,87,0.55); color:#ffe9b8; font-family:sans-serif; font-weight:bold; font-size:13px; text-decoration:none; white-space:nowrap;">🏆 랭킹 확인</a>

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 480, H = 1038;
canvas.width = W; canvas.height = H;

function fixCanvasSize(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const scale = Math.min(vw/W, vh/H) * 0.94;
  canvas.style.width = (W*scale)+'px';
  canvas.style.height = (H*scale)+'px';
}
window.addEventListener('resize', fixCanvasSize);
[100,300,600,1200].forEach(ms=>setTimeout(fixCanvasSize, ms));

                         // this is what Iason asked for: a direct "distance" knob separate from height
  RUN_SPEED: 6.5,      // was 4.2 — the old speed read as sluggish, no "action" feel
  SPEED_RAMP_MAX: 0.3, // was hardcoded 0.5 — top speed is now RUN_SPEED*1.3 instead of *1.5, less extreme at max difficulty
  HELLO_SIZE: 58,        // matches Hello Bird's own HELLO_SIZE exactly (was 78 — felt oversized)
  CROUCH_HEIGHT: 31,     // rescaled with HELLO_SIZE (was 42 at the old 78 standing height)
  CROUCH_DRAW_W: 83,     // rescaled with HELLO_SIZE (was 112)

  STOPWATCH_R: 79,       // Iason's live-tuned value (was 54)
  WEATHER_BADGE_OFFSET_X: 92, // horizontal distance from the stopwatch center to the weather badge center

  HOLD_THRESHOLD_MS: 160, // no longer used (screen split replaced tap/hold), kept only so any saved localStorage value doesn't error

  JUMP_SAFETY_MULT: 1.8, // Iason's live-tuned value (was 1.6)
  LOW_OBSTACLE_H: 65,   // rescaled with HELLO_SIZE (was 85 at the old 78 standing height)
  LOW_OBSTACLE_W: 70,   // rescaled with HELLO_SIZE (was 90) — fixed footprint, independent
                         // of source art aspect — this is the

                         // clearable, instead of varying with whatever the source image's

  MID_OBSTACLE_H: 112,  // rescaled with HELLO_SIZE (was 145) — still comfortably under single-jump apex

  LAND_SQUASH_TIME: 20,   // Iason's live-tuned value (was 18)

function obstacleTierWeights(){
  // distance tiers (using displayM, the "m" the player actually sees) — deliberately no
  // tall/long at all in the first stretch so there's a real, guaranteed-easy onboarding
  // window before double-jump obstacles are even possible
  if(displayM < T.EASY_TIER_END){
    return {air:0.25, low:0.45, mid:0.30, tall:0.00, long:0.00};
  } else if(displayM < T.MEDIUM_TIER_END){
    return {air:0.20, low:0.30, mid:0.30, tall:0.10, long:0.10};
  } else {
    return {air:0.15, low:0.20, mid:0.25, tall:0.20, long:0.20};
  }
}
function spawnObstacle(x){
  const weights = obstacleTierWeights();
  const r = Math.random();
  let type = 'long', acc = 0;
  for(const t of ['air','low','mid','tall','long']){
    acc += weights[t];
    if(r < acc){ type = t; break; }
  }

  if(type==='air'){
    const key = AIR_OBS[Math.floor(Math.random()*AIR_OBS.length)];
    obstacles.push({ x, type, img:key, w: 90, h: T.AIR_OBSTACLE_H, passed:false });
  } else if(type==='low'){
    const key = LOW_OBS[Math.floor(Math.random()*LOW_OBS.length)];
    // fixed footprint (규격화) — every low obstacle is the same verified-safe size,
    // regardless of the source image's own proportions
    obstacles.push({ x, type, img:key, w: T.LOW_OBSTACLE_W, h: T.LOW_OBSTACLE_H, passed:false });
  } else if(type==='mid'){
    const key = MID_OBS[Math.floor(Math.random()*MID_OBS.length)];
    obstacles.push({ x, type, img:key, w: T.MID_OBSTACLE_W, h: T.MID_OBSTACLE_H, passed:false });

    obstacles.push({ x, type, img:key, w: T.TALL_OBSTACLE_W, h: T.TALL_OBSTACLE_H, passed:false });
  } else {
    const key = LONG_OBS[Math.floor(Math.random()*LONG_OBS.length)];
    obstacles.push({ x, type, img:key, w: T.LONG_OBSTACLE_W, h: T.LONG_OBSTACLE_H, passed:false });
  }
}

// gap needed after an obstacle of this type, before the next one is safe to place —
// tall/long need the double jump's roughly-doubled hangtime; everything else needs just
// the single jump's reach (or, for 'air', no airtime at all — just enough reaction room)
function requiredGapAfter(type, speed){
  const singleHang = T.JUMP_HANGTIME;
  if(type==='tall' || type==='long'){
    return Math.max(T.OBSTACLE_GAP_MIN, singleHang*2 * speed * T.JUMP_SAFETY_MULT);
  } else {
    // covers low/mid/air alike — even right after a duck, leave the same comfortable
    // single-jump-worth of room before the next obstacle. air used to get a much shorter
    // gap here (just enough to react, no airtime needed), but that meant a duck could be
    // followed almost immediately by an obstacle that needs a jump, with no time to recover
    return Math.max(T.OBSTACLE_GAP_MIN, singleHang * speed * T.JUMP_SAFETY_MULT);
  }
}

// tap (anywhere, minimal movement) = jump. swipe down past a distance threshold = crouch,
// fires the instant the threshold is crossed (not waiting for release). distance is a much
// more reliable signal than press-duration — a real tap barely drifts at all, while an
// intentional downward swipe clearly does, so there's no timing window to mis-guess.
let activeTouchId = null;

let pendingJump = false; // true while holding the ground-squash windup before actually launching
let jumpWindupTimer = 0;

function tryJump(){
  if(grounded && !pendingJump){
    // visual squash beat before actual liftoff — purely cosmetic now, no longer doubles
    // as a cancel-window for anything
    pendingJump = true;
    jumpWindupTimer = T.JUMP_WINDUP;
    crouching = false;
    return;
  }
  if(!grounded && jumpsUsed < 2){
    // double jump stays instant/reactive — no windup, since it's a quick mid-air correction
    hello.vy = effJumpVel();
    jumpsUsed = 2;
    stopRunSound();
    playJumpSound();
  }
}
function launchJump(){
  pendingJump = false;
  hello.vy = effJumpVel();
  grounded = false;

}

function canvasPosFromEvent(e){
  const rect = canvas.getBoundingClientRect();
  const scale = H / rect.height;
  return { x: (e.clientX-rect.left)*scale, y: (e.clientY-rect.top)*scale };
}

// bottom strip of the screen = crouch, everything else = jump. resolved once, instantly,
// purely by WHERE the touch landed — no waiting to see how it develops, so both actions
// are zero-latency. this replaces the swipe/gesture approach, which needed some minimum
// time window to distinguish a tap from a swipe and kept losing that race on real touch hardware.
let crouchByTouch = false;

function handleDown(e){
  ensureAudio();
  // 화면 탭으로 시작하는 건 'start' 화면에서만 허용한다. 게임오버 화면에서는 탭으로
  // 재시작하지 않는다 — 죽자마자 반사적으로 화면을 연타하다가 의도치 않게 바로
  // 재시작되어 버리는 문제가 있었다. 게임오버 화면의 재시작은 아래 "다시하기"
  // 버튼(#retryBtn)을 눌러야만 되도록 분리했다.
  if(state==='start'){ resetGame(); return; }
  if(state!=='playing') return;
  const p = canvasPosFromEvent(e);
  activeTouchId = e.pointerId;
  if(grounded && p.y > GROUND_Y - T.CROUCH_ZONE_MARGIN){
    crouchByTouch = true;
    startCrouch();
  } else {
    crouchByTouch = false;
    tryJump();
  }
}
function handleMove(e){
  // zone is decided once on touchdown — dragging around afterward doesn't change anything
}
function handleUp(e){
  if(e.pointerId !== activeTouchId) return;
  activeTouchId = null;
  if(crouchByTouch) endCrouch();
}

canvas.addEventListener('pointerdown', e=>{ e.preventDefault(); handleDown(e); });

let audioCtx = null;
function ensureAudio(){
  // 모바일 브라우저의 자동재생 제한 때문에, 사용자가 화면을 처음 탭하는 시점에
  // 오디오를 풀어준다 — WebAudio(효과음)와 <audio>(배경음악/점프음) 둘 다 필요.
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  if(state==='start') playStationBgm(station.key);
}
function playTone(freqStart, freqEnd, duration, type, volume){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqStart, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), audioCtx.currentTime+duration);
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+duration);
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime+duration);
}
function playNoise(duration, volume){
  if(!audioCtx) return;
  const bufferSize = Math.floor(audioCtx.sampleRate*duration);
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++){ data[i] = (Math.random()*2-1) * (1 - i/bufferSize); }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  src.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

// ---------- particles (running dust) ----------
let particles = [];
function spawnDust(x,y){
  particles.push({ x, y, vx: -1.2-Math.random()*0.8, vy: -0.3-Math.random()*0.5, life: 18, maxLife: 18 });
}
function updateParticles(dt){
  for(const p of particles){ p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p=>p.life>0);
}
function drawParticles(){
  for(const p of particles){
    const a = Math.max(0, p.life/p.maxLife) * 0.35;
    ctx.fillStyle = 'rgba(255,255,255,'+a+')';
    ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI*2); ctx.fill();
  }
}

    weatherParticles.push({
      x: Math.random()*W, y: Math.random()*H,
      speed: weatherMode==='rain' ? (13+Math.random()*7) : (1.3+Math.random()*1.4),
      sway: Math.random()*Math.PI*2,
      len: 16+Math.random()*14,
      size: 1.5+Math.random()*3,
    });
  }
}
function updateWeatherParticles(dt){
  if(weatherMode==='clear') return;
  for(const p of weatherParticles){
    p.y += p.speed*dt;
    if(weatherMode==='snow'){ p.sway += 0.04*dt; p.x += Math.sin(p.sway)*0.7*dt; }
    if(p.y > H+20){ p.y = -20; p.x = Math.random()*W; }
    if(p.x<-20) p.x = W+20; else if(p.x>W+20) p.x = -20;
  }
}
function drawWeatherParticles(){
  if(weatherMode==='clear') return;
  ctx.save();
  if(weatherMode==='rain'){
    // darker overcast tint stands in for the real "no-sun cloudy sky" art that's still
    // pending — makes the mood readable even against today's bright placeholder sky
    ctx.fillStyle = 'rgba(35,45,75,0.30)';
    ctx.fillRect(0,0,W,H);
    ctx.strokeStyle = 'rgba(120,150,195,0.8)'; // was much lighter/thinner — got lost against a bright sky
    ctx.lineWidth = 2.5;
    for(const p of weatherParticles){
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x-6, p.y+p.len);
      ctx.stroke();
    }
  } else if(weatherMode==='snow'){
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for(const p of weatherParticles){
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillStyle = 'rgba(255,255,255,0.07)'; // cold/bright mood tint
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

let lastTs = null;
function update(dt){
  if(state!=='playing') return;



  if(pendingJump){
    jumpWindupTimer -= dt;
    if(jumpWindupTimer<=0) launchJump();
  }

  // physics — exact closed-form step so the arc doesn't depend on dt granularity
  if(!grounded){
    hello.y += hello.vy * dt + 0.5 * effGravity() * dt * dt;
    hello.vy += effGravity() * dt;
    if(hello.y >= GROUND_Y){
      hello.y = GROUND_Y; hello.vy = 0; grounded = true; jumpsUsed = 0;
      squashTimer = T.LAND_SQUASH_TIME;
      sfxLand();
      startRunSound();
    }
  }

  // run cycle animation (only while grounded & not crouching)
  if(grounded && !crouching){
    runTimer += dt;
    if(runTimer > 3){ // was 4 — quicker frame cycling
      runTimer = 0; runFrame = (runFrame+1) % RUN_FRAMES.length;
      spawnDust(HELLO_X-20, GROUND_Y-4); // little puff every footfall, sells ground contact + speed
    }
    runPhase += dt * 0.75; // was 0.5 — faster bounce cadence to match
  }
  if(crouching){
    crouchTimer += dt;
    if(crouchTimer > 4){ crouchTimer = 0; crouchFrame = (crouchFrame+1) % CROUCH_FRAMES.length; }
  }

  if(squashTimer>0) squashTimer = Math.max(0, squashTimer - dt);
  updateParticles(dt);
  updateWeatherParticles(dt);

  // world scroll + score
  const speed = T.RUN_SPEED * (1 + difficultyProgress()*T.SPEED_RAMP_MAX);
  scrollX += speed * dt;
  score = Math.floor(scrollX/10);
  displayM = Math.floor(scrollX/200);
  if(displayM>0 && displayM%10===0 && displayM!==lastMilestone){
    lastMilestone = displayM;
    milestoneTimer = 50;
    sfxMilestone();
  }
  if(milestoneTimer>0) milestoneTimer = Math.max(0, milestoneTimer-dt);
  if(weatherAnnounceTimer>0) weatherAnnounceTimer = Math.max(0, weatherAnnounceTimer-dt);

  // spawn — gap after each obstacle is derived from what THAT obstacle actually demands
  // (single jump / double jump / just a duck) at the current speed, so landing always
  // clears safely into open ground before the next one regardless of type or difficulty
  while(nextObstacleX < scrollX + W + 300){
    spawnObstacle(nextObstacleX);
    const justSpawned = obstacles[obstacles.length-1];
    nextObstacleX += requiredGapAfter(justSpawned.type, speed);
  }

  // collision
  const hx = HELLO_X;
  const charH = currentHeloHeight();
  // collision hitbox — must track the character's CURRENT position (hello.y), not the
  // fixed ground line. using GROUND_Y here was the bug: it meant jumping never actually
  // moved the hitbox, so obstacles could "hit" hello even while airborne above them
  const charTop = hello.y - charH + T.HITBOX_PAD;
  const charBottom = hello.y - T.HITBOX_PAD;
  for(const ob of obstacles){
    const ox = ob.x - scrollX;
    if(!ob.passed && ox + ob.w < hx){ ob.passed = true; }
    const overlapX = (ox < hx + T.HITBOX_MARGIN_X) && (ox + ob.w > hx - T.HITBOX_MARGIN_X);
    if(!overlapX) continue;
    if(ob.type==='air'){
      const obBottom = GROUND_Y - T.AIR_GAP;
      const obTop = obBottom - ob.h;
      if(charTop < obBottom && charBottom > obTop){ gameOver(); }
    } else {
      const obTop = GROUND_Y - ob.h + T.GROUND_OVERLAP;
      if(charBottom > obTop){ gameOver(); }
    }
  }
  obstacles = obstacles.filter(o => (o.x + o.w) - scrollX > -20);
}

function gameOver(){
  if(state!=='playing') return;
  state = 'gameover';
  sfxHit();
  stopRunSound();
  if(displayM > bestToday){
    bestToday = displayM;
    localStorage.setItem('hr_best_today', String(bestToday));
  }
  document.getElementById('gameoverPanel').style.display = 'flex';
}

function roundRectPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

// 공유카드 배경 + 캐릭터 스티커(대표가 직접 그려서/생성해서 준 것들) — 카드를 만들 때만
// 필요해서, 페이지 로딩을 막지 않게 백그라운드로 조용히 불러온다. 다만 사람이 게임을
// 짧게 하고 바로 공유를 누르면 아직 다 안 불러와졌을 수도 있어서(특히 용량 큰 배경 이미지),
// shareCardBgReady로 "로딩 끝났다"는 신호를 만들어 shareCard()에서 잠깐 기다려준다.
const shareCardBg = new Image();
const shareCardBgReady = new Promise((resolve)=>{
  shareCardBg.onload = ()=>resolve(true);
  shareCardBg.onerror = ()=>resolve(false);
});
shareCardBg.src = './assets/share-card-bg.jpg';
const SHARE_CHAR_COUNT = 10;
const shareCharImages = Array.from({length: SHARE_CHAR_COUNT}, (_, i) => {
  const img = new Image();
  img.src = './assets/share_char_' + (i+1) + '.png';
  return img;
});
let lastShareCharIndex = -1;
function pickRandomShareChar(){
  const loaded = shareCharImages.filter(img => img.complete && img.naturalWidth>0);
  if(loaded.length===0) return null;
  let img;
  do { img = loaded[Math.floor(Math.random()*loaded.length)]; } while(loaded.length>1 && img===shareCharImages[lastShareCharIndex]);
  lastShareCharIndex = shareCharImages.indexOf(img);
  return img;
}

function buildShareCard(){
  const cw = 640, ch = 800;
  const sc = document.createElement('canvas');
  sc.width = cw; sc.height = ch;
  const sctx = sc.getContext('2d');

  // 카드 전체를 둥근 사각형으로 자르고, 그 안에서만 그린다
  const cardR = 28;
  roundRectPath(sctx, 0, 0, cw, ch, cardR);
  sctx.save();
  sctx.clip();

  // 대표가 만든 카드 배경(방조제·등대·관람차 일러스트) — 못 불러왔으면 기존 방식(게임 화면
  // 블러)으로 조용히 폴백해서 카드 생성 자체는 항상 되게 한다
  if(shareCardBg.complete && shareCardBg.naturalWidth>0){
    sctx.drawImage(shareCardBg, 0, 0, cw, ch);
  } else {
    sctx.filter = 'blur(14px) brightness(0.5) saturate(1.15)';
    sctx.drawImage(canvas, 0, 0, cw, ch);
    sctx.filter = 'none';
    sctx.fillStyle = 'rgba(8,10,20,0.4)';
    sctx.fillRect(0, 0, cw, ch);
  }

  sctx.textAlign = 'center';

  // 큰 기록 숫자 — 강렬한 빨간색 + 흰 테두리 + 글로우로 시선을 확 붙잡게
  sctx.save();
  sctx.shadowColor = 'rgba(255,30,30,0.85)';
  sctx.shadowBlur = 30;
  sctx.font = '900 108px sans-serif';
  sctx.lineWidth = 8;
  sctx.strokeStyle = '#ffffff';
  sctx.strokeText(displayM+'m', cw/2, 245);
  sctx.fillStyle = '#ff2020';
  sctx.fillText(displayM+'m', cw/2, 245);
  sctx.restore();

  // 정보 텍스트: 장소 · 시간대 · 날씨 — 배경에 이미 그려진 알약 모양 위에 얹는다
  const wIcon = weatherMode==='rain' ? '🌧️' : (weatherMode==='snow' ? '❄️' : '☀️');
  const wLabel = weatherMode==='rain' ? '비' : (weatherMode==='snow' ? '눈' : '맑음');
  const todIcon = timeOfDay==='night' ? '🌙' : (timeOfDay==='sunset' ? '🌇' : '🌤️');
  const todLabel = timeOfDay==='night' ? '밤' : (timeOfDay==='sunset' ? '노을' : '낮');
  const chipText = '📍 '+station.name+'   '+todIcon+' '+todLabel+'   '+wIcon+' '+wLabel;
  sctx.font = '600 21px sans-serif';
  sctx.fillStyle = '#3a2a12';
  sctx.fillText(chipText, cw/2, 318);

  // 캐릭터 — 배경의 동그란 노을 원 안에, 매번 다른 포즈(대표가 준 10종 중 랜덤)로
  const charImg = pickRandomShareChar();
  if(charImg){
    const cs = 246;
    sctx.drawImage(charImg, cw/2-cs/2, 511-cs/2, cs, cs);
  }

  // 오늘 최고 기록 — 하단 남색 바 안, CTA 버튼 위쪽 작은 줄
  sctx.font = '600 16px sans-serif';
  sctx.fillStyle = 'rgba(255,255,255,0.85)';
  sctx.fillText('🏆 오늘 최고 '+bestToday+'m', cw/2, 714);

  // 하단 CTA — "링크"가 그냥 텍스트가 아니라 딱 눌러볼 만한 버튼처럼, 더 크고 확실하게
  const ctaText = '👉  daebugame.com 놀러가기';
  sctx.font = '800 26px sans-serif';
  const ctaW = Math.min(cw-48, sctx.measureText(ctaText).width + 60);
  const ctaY = 736, ctaH = 56;
  sctx.save();
  // 바깥쪽에 은은한 흰 링을 한 겹 더 둘러서 배지처럼 확실히 도드라지게
  roundRectPath(sctx, cw/2-ctaW/2-5, ctaY-5, ctaW+10, ctaH+10, (ctaH+10)/2);
  sctx.fillStyle = 'rgba(255,255,255,0.35)';
  sctx.fill();
  roundRectPath(sctx, cw/2-ctaW/2, ctaY, ctaW, ctaH, ctaH/2);
  sctx.shadowColor = 'rgba(0,0,0,0.4)';
  sctx.shadowBlur = 14;
  sctx.shadowOffsetY = 4;
  sctx.fillStyle = '#ffc857';
  sctx.fill();
  sctx.restore();
  sctx.fillStyle = '#2a1c00';
  sctx.fillText(ctaText, cw/2, ctaY+ctaH/2+9);

  sctx.restore(); // 클리핑 해제

  // 카드 테두리 — 금색 프레임
  roundRectPath(sctx, 2, 2, cw-4, ch-4, cardR);
  sctx.lineWidth = 4;
  sctx.strokeStyle = 'rgba(255,200,87,0.55)';
  sctx.stroke();

  return sc;
}
function blobToBase64(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onloadend = ()=>resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// 눌렀을 때 아무 반응이 없어 보이는 문제 — 실제로는 카드 만들고 업로드하는 동안 몇 초
//걸리는데 화면에 그걸 보여주는 게 없어서 그랬음. 버튼 자체를 로딩 상태로 바꾸고,
// 끝나면 결과(성공/실패)를 화면 아래 토스트 메시지로 짧게 보여준다.
function showToast(msg){
  let t = document.getElementById('toastMsg');
  if(!t){
    t = document.createElement('div');
    t.id = 'toastMsg';
    t.style.cssText = 'position:fixed;left:50%;bottom:46%;transform:translateX(-50%);z-index:200;background:rgba(0,0,0,0.88);color:#fff;padding:11px 20px;border-radius:999px;font-size:13px;font-family:sans-serif;font-weight:bold;box-shadow:0 4px 14px rgba(0,0,0,0.45);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;max-width:88vw;overflow:hidden;text-overflow:ellipsis;';
    document.body.appendChild(t);
  }
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(()=>{ t.style.opacity = '0'; }, 2500);
}

function setShareBtnLoading(loading){
  const btn = document.getElementById('shareBtn');
  if(loading){
    btn.dataset.origText = btn.dataset.origText || btn.textContent;
    btn.textContent = '⏳ 카드 만드는 중...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
  } else {
    btn.textContent = btn.dataset.origText || '📤 친구에게 자랑하기!';
    btn.disabled = false;
    btn.style.opacity = '1';
  }
}

async function shareCard(){
  setShareBtnLoading(true);
  // 배경 이미지가 아직 안 불러와졌으면 최대 3초까지 기다렸다가 만든다 — 이게 없으면
  // 게임을 짧게 하고 바로 공유 눌렀을 때 옛날 방식(화면 블러)으로 조용히 폴백되어버림
  await Promise.race([shareCardBgReady, new Promise(r=>setTimeout(r, 3000))]);
  const sc = buildShareCard();
  sc.toBlob(async (blob)=>{
    if(!blob){
      setShareBtnLoading(false);
      showToast('카드 생성에 실패했어요 😢 다시 시도해주세요');
      return;
    }
    try{
      // B안(개인화 카드 이미지): 카카오 SDK가 초기화돼 있으면 이 카드 이미지를
      // /api/kakao-upload로 잠깐 업로드(24h 후 자동 정리)한 뒤, 그 URL을 카톡 피드
      // 템플릿에 넣어 실제 결과가 담긴 이미지가 카톡 미리보기에 뜨게 한다.
      if(window.Kakao && window.Kakao.isInitialized && window.Kakao.isInitialized()){
        try{
          const base64 = await blobToBase64(blob);
          const uploadRes = await fetch('/api/kakao-upload', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ imageBase64: base64 })
          });
          if(uploadRes.ok){
            const { url } = await uploadRes.json();
            window.Kakao.Share.sendDefault({
              objectType: 'feed',
              content: {
                title: '헬로런에서 ' + displayM + 'm 달렸어요!',
                description: '오늘의 ' + station.name + ' · daebugame.com',
                imageUrl: url,
                link: { mobileWebUrl: 'https://daebugame.com', webUrl: 'https://daebugame.com' }
              },
              buttons: [{ title: '나도 도전하기', link: { mobileWebUrl: 'https://daebugame.com', webUrl: 'https://daebugame.com' } }]
            });
            showToast('카카오톡 공유창을 열었어요! 📤');
            return;
          }
        }catch(e){
          // 업로드나 카카오 SDK 호출이 실패하면 아래 기본 공유 흐름으로 자연스럽게 폴백
        }
      }
      const file = new File([blob], 'hello-run-'+displayM+'m.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'헬로런 '+displayM+'m', text:'헬로런에서 '+displayM+'m 기록했어요! daebugame.com'});
          showToast('공유했어요! 🎉');
          return;
        }catch(e){
          // 사용자가 공유 시트에서 직접 취소한 경우(AbortError)는 실패가 아니라 그냥
          // 취소한 것 — 이 경우엔 다운로드로 넘어가지 않고 조용히 끝낸다
          if(e && e.name === 'AbortError'){ return; }
        }
      }
      // plain <a download> is inert inside a published Claude artifact page — use the
      // platform's downloads capability instead. on the real deployed site (daebugame.com)
      // this whole branch is unnecessary; the <a download> fallback below would just work there.
      try{
        if(window.claude && window.claude.use){
          const downloads = await window.claude.use('downloads');
          if(downloads){
            await downloads.save({ filename: 'hello-run-'+displayM+'m.png', data: blob });
            showToast('이미지로 저장했어요! 📥');
            return;
          }
        }
      }catch(e){}
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'hello-run-'+displayM+'m.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
      showToast('이미지로 저장했어요! 📥');
    } finally {
      setShareBtnLoading(false);
    }
  }, 'image/png');
}
document.getElementById('shareBtn').addEventListener('click', (e)=>{
  e.stopPropagation();
  shareCard();
});


// ---------- draw ----------

function drawSeaLayer(img, localScroll){
  if(!img || !img.complete) return;
  const dispH = BG.SEA_H;
  const scale = dispH / img.naturalHeight;
  const w = img.naturalWidth * scale;
  const topY = H - dispH - BG.SEA_OFFSET_Y;
  const baseX = (W - w) / 2 + BG.SEA_OFFSET_X;
  ctx.save();
  if(BG.SEA_BLUR>0) ctx.filter = 'blur('+BG.SEA_BLUR+'px)';
  const off = (localScroll*BG.SEA_SCROLL) % w;
  for(let x = baseX - off - w; x < W + w; x += w){ ctx.drawImage(img, x, topY, w, dispH); }
  ctx.restore();
}
function drawLandmarkLayer(img, localScroll){
  if(!img || !img.complete) return;
  const dispH = BG.LANDMARK_H;
  const scale = dispH / img.naturalHeight;
  const w = img.naturalWidth * scale;
  const topY = H - dispH - BG.LANDMARK_OFFSET_Y;
  const x = BG.LANDMARK_WORLD_X - localScroll*BG.LANDMARK_SCROLL + BG.LANDMARK_OFFSET_X;
  if(x + w < -50 || x > W + 50) return;
  ctx.save();
  if(BG.LANDMARK_BLUR>0) ctx.filter = 'blur('+BG.LANDMARK_BLUR+'px)';
  ctx.drawImage(img, x, topY, w, dispH);
  ctx.restore();
}
function drawTiledLayer(img, dispH, speedFactor, offsetY, blur, localScroll){
  if(!img || !img.complete || dispH<=0) return;
  const scale = dispH / img.naturalHeight;
  const w = img.naturalWidth * scale;
  const topY = H - dispH - offsetY;
  const off = (localScroll*speedFactor) % w;
  ctx.save();
  if(blur>0) ctx.filter = 'blur('+blur+'px)';
  for(let x = -off - w; x < W + w; x += w){ ctx.drawImage(img, x, topY, w, dispH); }
  ctx.restore();
}

// time-of-day + weather both affect which sky is shown. weather (rain/snow) takes
// priority over time-of-day when active — real rain/snow sky art can slot in later
// (images['sky_rain']/'sky_snow'), falling back to the day/sunset/night sky + a dark
// placeholder tint until then, so nothing looks broken while art is pending
let timeOfDay = 'day'; // 'day' | 'sunset' | 'night'
function currentSkyImage(){
  if(weatherMode==='rain' && images['sky_rain'] && images['sky_rain'].complete) return images['sky_rain'];
  if(weatherMode==='snow' && images['sky_snow'] && images['sky_snow'].complete) return images['sky_snow'];
  if(timeOfDay==='sunset' && images['sky_sunset'] && images['sky_sunset'].complete) return images['sky_sunset'];
  if(timeOfDay==='night' && images['sky_night'] && images['sky_night'].complete) return images['sky_night'];
  return images[station.key+'_sky'];
}
function drawBg(){
  ctx.fillStyle = '#a0d7fa';
  ctx.fillRect(0,0,W,H);
  const skyImg = currentSkyImage();
  if(skyImg && skyImg.complete) ctx.drawImage(skyImg, 0, 0, W, H);
  // placeholder darkening for night until the real dedicated sky art (already have it now,
  // this just stays as a no-op safety net) — skipped once sky_night is loaded
  if(timeOfDay==='night' && !(images['sky_night'] && images['sky_night'].complete)){
    ctx.fillStyle = 'rgba(10,15,40,0.45)';
    ctx.fillRect(0,0,W,H);
  }
  // sky_rain / sky_snow are single fixed images with no time-of-day baked in, so day vs
  // night looked identical during bad weather. layering time-of-day darkness on top fixes
  // that without needing 3x more sky art (day-rain/sunset-rain/night-rain etc.)
  if(weatherMode==='rain' || weatherMode==='snow'){
    if(timeOfDay==='night'){
      ctx.fillStyle = 'rgba(8,12,30,0.55)';
      ctx.fillRect(0,0,W,H);
    } else if(timeOfDay==='sunset'){
      ctx.fillStyle = 'rgba(30,20,35,0.28)';
      ctx.fillRect(0,0,W,H);
    }
  }
  drawSeaLayer(images[station.key+'_sea'], scrollX);
  if(station.hasLandmark) drawLandmarkLayer(images[station.key+'_landmark'], scrollX);
  drawTiledLayer(images[station.key+'_mid'], BG.MID_H, BG.MID_SCROLL, BG.MID_OFFSET_Y, BG.MID_BLUR, scrollX);
}
function drawGroundLayer(){
  // drawn AFTER obstacles/hello so it overlaps their base the same way GROUND_OVERLAP does —
  // closest foreground layer, fastest scroll
  drawTiledLayer(images[station.key+'_ground'], BG.GROUND_H, BG.GROUND_SCROLL, BG.GROUND_OFFSET_Y, BG.GROUND_BLUR, scrollX);
}
function setStation(i){
  stationIndex = ((i % STATIONS.length) + STATIONS.length) % STATIONS.length;
  station = STATIONS[stationIndex];
  BG = station.bg;
  playStationBgm(station.key);
}

function drawGroundShadow(cx, width, liftFromGround){
  // soft contact shadow — without this, everything reads as pasted-on stickers rather
  // than objects actually standing in the scene. shrinks/fades as the thing lifts off
  // the ground (jumping), so it doesn't look like it's dragging the shadow up with it
  const fade = Math.max(0.15, 1 - liftFromGround/140);
  const w = width * fade;
  ctx.save();
  ctx.globalAlpha = 0.28 * fade;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(cx, GROUND_Y+2, w/2, w*0.16, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawHello(){
  const charH = currentHeloHeight();
  const cx = HELLO_X;
  const cy = hello.y;
  let img = null;
  drawGroundShadow(cx, T.HELLO_SIZE*0.9, GROUND_Y - hello.y);
  if(state==='gameover'){
    // hit reaction face, frozen in place — replaces whatever pose was mid-motion at impact
    const img2 = images['hello_hit'];
    const w = T.JUMP_DRAW_W * 1.05;
    const h = w / (img2.naturalWidth/img2.naturalHeight);
    ctx.drawImage(img2, cx-w/2, cy-h, w, h);
    return;
  }
  if(pendingJump){
    // ground-squash windup, held in place before actually launching
    const img2 = images['hello_jump_ready'];
    const w = T.JUMP_DRAW_W;
    ctx.drawImage(img2, cx-w/2, cy-charH, w, charH);
    return;
  }
  if(!grounded){
    if(hello.vy < -3) img = images['hello_jump_rise'];
    else if(hello.vy > 3) img = images['hello_jump_land'];
    else img = images['hello_jump_peak'];
    const w = T.JUMP_DRAW_W; // fixed across all 4 poses — see JUMP_DRAW_W comment
    ctx.drawImage(img, cx-w/2, cy-charH, w, charH);
  } else if(crouching){
    const img = images[CROUCH_FRAMES[crouchFrame]];
    // sized by WIDTH (not the small hitbox height), so the character reads as flattened-low
    // rather than shrunken. the hitbox for duck-under judging still uses T.CROUCH_HEIGHT —
    // draw size and hitbox size are allowed to differ, same as HITBOX_PAD already does elsewhere
    const w = T.CROUCH_DRAW_W;
    const h = w / (img.naturalWidth/img.naturalHeight);
    ctx.drawImage(img, cx-w/2, cy-h, w, h);
  } else {
    img = images[RUN_FRAMES[runFrame]];
    const baseW = charH * (img.naturalWidth/img.naturalHeight);
    // landing squash: briefly shorter + wider right after touchdown, springs back over ~10 frames
    const squash = squashTimer>0 ? (squashTimer/10)*0.18 : 0;
    const drawH = charH * (1-squash);
    const drawW = baseW * (1+squash*0.6);
    const bounce = Math.abs(Math.sin(runPhase)) * T.RUN_BOUNCE; // continuous stride bob
    ctx.drawImage(img, cx-drawW/2, cy-bounce-drawH, drawW, drawH);
  }
}

// offscreen buffer reused for masking weather effects to each obstacle's real silhouette,
// instead of a generic shape that ignores the sprite's actual transparent areas
const _wxCanvas = document.createElement('canvas');
const _wxCtx = _wxCanvas.getContext('2d');

function drawObstacleWithWeather(img, ox, obTop, w, h){
  ctx.drawImage(img, ox, obTop, w, h);
  if(weatherMode==='clear') return;
  const cw = Math.max(1, Math.ceil(w)), ch = Math.max(1, Math.ceil(h));
  _wxCanvas.width = cw; _wxCanvas.height = ch;
  _wxCtx.clearRect(0,0,cw,ch);
  _wxCtx.drawImage(img, 0, 0, cw, ch);
  _wxCtx.globalCompositeOperation = 'source-atop'; // only paints where the sprite itself is opaque
  if(weatherMode==='snow'){
    const grad = _wxCtx.createLinearGradient(0,0,0,ch*0.5);
    grad.addColorStop(0, 'rgba(255,255,255,0.92)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    _wxCtx.fillStyle = grad;
  } else { // rain — wet darkening, following the real silhouette instead of a bounding box
    _wxCtx.fillStyle = 'rgba(20,30,55,0.28)';
  }
  _wxCtx.fillRect(0,0,cw,ch);
  ctx.drawImage(_wxCanvas, ox, obTop, w, h);
}

function drawObstacles(){
  for(const ob of obstacles){
    const ox = ob.x - scrollX;
    if(ox + ob.w < -20 || ox > W+150) continue;
    if(ob.type==='air'){
      const img = images[ob.img];
      const obBottom = GROUND_Y - T.AIR_GAP;
      const obTop = obBottom - ob.h;
      drawGroundShadow(ox+ob.w/2, ob.w*0.8, GROUND_Y - obBottom);
      drawObstacleWithWeather(img, ox, obTop, ob.w, ob.h);
    } else {
      const img = images[ob.img];
      const obTop = GROUND_Y - ob.h + T.GROUND_OVERLAP;
      drawGroundShadow(ox+ob.w/2, ob.w*0.85, 0);
      drawObstacleWithWeather(img, ox, obTop, ob.w, ob.h);
    }
  }
}

function drawUI(){
  // small always-on label at the ground line — the ground texture itself already reads as
  // a visually distinct zone, so this is just a one-line explanation of what it does,
  // not a highlight overlay
  if(state==='playing' && showCrouchHint){
    ctx.save();
    const bounce = Math.sin(performance.now()/260) * 6;
    // 캐릭터가 서 있을 때(978 근처)는 물론, 점프 정점(대략 717 근처)까지도 절대 안 겹치게
    // 훨씬 위쪽(하늘 영역)에 띄운다 — 예전엔 바닥 바로 위라 캐릭터/장애물을 가려서 플레이가
    // 안 될 정도였음
    const hintY = 560;
    const hintText = '아래 바닥 터치 = 숙이기';
    ctx.textAlign = 'center';
    ctx.font = '900 27px sans-serif';
    const tw = ctx.measureText(hintText).width;
    // 배경 알약을 깔아서 어떤 배경(밤하늘/낮하늘) 위에서도 확실히 도드라지게
    roundRectPath(ctx, W/2-tw/2-24, hintY-36, tw+48, 48, 24);
    ctx.fillStyle = 'rgba(255,200,87,0.94)';
    ctx.fill();
    ctx.fillStyle = '#2a1c00';
    ctx.fillText(hintText, W/2, hintY-4);
    // 아래쪽으로 통통 튀는 화살표 — 바닥 쪽으로 시선을 유도
    ctx.font = '900 30px sans-serif';
    ctx.fillStyle = 'rgba(255,200,87,0.95)';
    ctx.strokeStyle = 'rgba(0,0,0,0.45)'; ctx.lineWidth = 3;
    ctx.strokeText('▼', W/2, hintY+40+bounce);
    ctx.fillText('▼', W/2, hintY+40+bounce);
    ctx.restore();
  }
  ctx.textAlign='left';
  // stopwatch-style distance dial, top-center only — deliberately narrow so the left/right
  // top corners stay free for the ad-balloon space planned later. bigger + glowing now,
  // and pulses on every 5m milestone so it reads as the main "how am I doing" readout —
  // other runners usually put this dead-center since the character sits mid-screen; ours
  // sits low, so the dial needs to carry more visual weight to compensate
  const milePulse = milestoneTimer>0 ? Math.sin((milestoneTimer/50)*Math.PI) : 0;
  ctx.save();
  const cx2 = W/2, cy2 = T.STOPWATCH_Y, r2 = T.STOPWATCH_R + milePulse*6;
  ctx.shadowColor = 'rgba(255,200,87,'+(0.5+milePulse*0.5)+')';
  ctx.shadowBlur = 18 + milePulse*20;
  ctx.beginPath(); ctx.arc(cx2, cy2, r2, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(15,20,32,0.68)';
  ctx.fill();
  ctx.lineWidth = 5;
  ctx.strokeStyle = '#ffc857';
  ctx.stroke();
  ctx.shadowBlur = 0;
  for(let i=0;i<12;i++){
    const ang = (i/12)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx2+Math.cos(ang)*(r2-5), cy2+Math.sin(ang)*(r2-5));
    ctx.lineTo(cx2+Math.cos(ang)*(r2-11), cy2+Math.sin(ang)*(r2-11));
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  ctx.fillStyle = '#ffc857'; // stopwatch crown nub
  ctx.fillRect(cx2-7, cy2-r2-12, 14, 12);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = 'bold '+(32+milePulse*6)+'px sans-serif';
  ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeText(displayM+'m', cx2, cy2-6);
  ctx.fillStyle = milePulse>0.3 ? '#ffd76a' : '#fff';
  ctx.fillText(displayM+'m', cx2, cy2-6);
  ctx.font = '11px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.fillText('최고 '+bestToday+'m', cx2, cy2+20);
  ctx.restore();
  // weather badge — bigger, with a short text label so "this game reacts to real weather"
  // actually reads, not just a tiny icon easy to miss
  ctx.save();
  const wx = cx2+T.WEATHER_BADGE_OFFSET_X, wy = cy2;
  ctx.beginPath(); ctx.arc(wx, wy, T.WEATHER_BADGE_R, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(15,20,32,0.6)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.font = Math.round(T.WEATHER_BADGE_R*0.92)+'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const wIcon = weatherMode==='rain' ? '🌧' : (weatherMode==='snow' ? '❄️' : '☀️');
  ctx.fillText(wIcon, wx, wy-T.WEATHER_BADGE_R*0.1);
  ctx.font = 'bold '+Math.round(T.WEATHER_BADGE_R*0.4)+'px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  const wLabel = weatherMode==='rain' ? '비' : (weatherMode==='snow' ? '눈' : '맑음');
  ctx.fillText(wLabel, wx, wy+T.WEATHER_BADGE_R*0.75);
  ctx.restore();
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // milestone pop — now a much bigger, punchier burst: overshoots huge on entry, settles,
  // then blows up further while fading out, with a glow behind it for extra weight
  if(milestoneTimer>0){
    ctx.save();
    const elapsed = 50 - milestoneTimer;
    let scale, alpha;
    if(elapsed<9){ const p=elapsed/9; scale=3.2-p*2.0; alpha=p; } // huge overshoot punching in
    else if(elapsed<32){ scale=1.2; alpha=1; }                     // settle bigger than before (was 1.0)
    else { const p=(elapsed-32)/18; scale=1.2+p*1.0; alpha=1-p; }  // blow up while fading
    ctx.globalAlpha = Math.max(0,alpha);
    ctx.translate(W/2, H*0.32);
    ctx.scale(scale,scale);
    ctx.textAlign='center';
    ctx.shadowColor = 'rgba(255,183,3,0.9)';
    ctx.shadowBlur = 30;
    ctx.font='bold 64px sans-serif'; // was 38px
    ctx.lineWidth=10; ctx.strokeStyle='#fff';
    ctx.strokeText(displayM+'M!!', 0, 0);
    ctx.fillStyle='#ffb703';
    ctx.fillText(displayM+'M!!', 0, 0);
    ctx.restore();
  }

  // weather-change announcement banner
  if(weatherAnnounceTimer>0){
    ctx.save();
    const elapsed = 100 - weatherAnnounceTimer;
    let alpha = 1, ty = 130;
    if(elapsed<12){ alpha = elapsed/12; ty = 110 + (1-elapsed/12)*20; }
    else if(elapsed>80){ alpha = Math.max(0,(100-elapsed)/20); }
    const label = weatherMode==='rain' ? '🌧 비가 내리기 시작했어요'
                : weatherMode==='snow' ? '❄️ 눈이 내리기 시작했어요'
                : '☀️ 날씨가 갰어요';
    ctx.globalAlpha = alpha;
    ctx.textAlign='center';
    ctx.font='bold 16px sans-serif';
    const tw = ctx.measureText(label).width;
    ctx.fillStyle='rgba(15,20,32,0.6)';
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(W/2-tw/2-16, ty-16, tw+32, 32, 16) : ctx.rect(W/2-tw/2-16, ty-16, tw+32, 32);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.fillText(label, W/2, ty+5);
    ctx.restore();
  }

  if(state==='start'){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    ctx.font='bold 28px sans-serif';
    ctx.fillText('헬로런 프로토타입', W/2, H/2-50);
    ctx.font='16px sans-serif';
    ctx.fillText('탭 = 점프(공중에서 한번 더 = 이단점프)', W/2, H/2-10);
    ctx.fillText('화면 아래쪽 탭 = 숙이기', W/2, H/2+20);
    ctx.fillText('탭해서 시작', W/2, H/2+60);
    ctx.restore();
  } else if(state==='gameover'){
    ctx.save();
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    // 최종 기록은 강렬하게 — 빨간색 + 굵은 글씨 + 은은한 글로우로 눈에 확 띄게
    ctx.save();
    ctx.shadowColor='rgba(255,40,40,0.85)';
    ctx.shadowBlur=22;
    ctx.font='900 44px sans-serif';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(0,0,0,0.55)';
    ctx.strokeText(displayM+'m', W/2, H/2-10);
    ctx.fillStyle='#ff3b3b';
    ctx.fillText(displayM+'m', W/2, H/2-10);
    ctx.restore();
    ctx.fillStyle='#fff';
    ctx.font='16px sans-serif';
    ctx.fillText('오늘 최고 '+bestToday+'m', W/2, H/2+24);
    ctx.restore();
  }
}

function draw(){
  drawBg();
  drawGroundLayer();
  drawParticles();
  drawObstacles();
  drawHello();
  drawWeatherParticles();
  // unifying color-grade pass — the background (Hello Bird's original art) and the
  // obstacles (drawn separately, each with their own saturated colors) don't share a
  // palette, so everything fights for attention at once. a soft warm-to-cool gradient +
  // gentle vignette ties them into one scene instead of looking like pasted stickers
  const grade = ctx.createLinearGradient(0,0,0,H);
  grade.addColorStop(0, 'rgba(255,236,200,0.10)');
  grade.addColorStop(0.55, 'rgba(255,255,255,0)');
  grade.addColorStop(1, 'rgba(20,30,50,0.16)');
  ctx.fillStyle = grade;
  ctx.fillRect(0,0,W,H);
  const vignette = ctx.createRadialGradient(W/2,H*0.45,H*0.35, W/2,H*0.45,H*0.75);
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0,0,W,H);
  drawUI();
}

function loop(ts){
  let dt = 1;
  if(lastTs !== null){
    dt = (ts-lastTs)/(1000/60);
    dt = Math.max(0, Math.min(dt,3));
  }
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- live conditions (weather API / date-seeded station / sunset-based time-of-day) ----------
// 서버리스 함수(/api/weather)에서 기상청 실황 + 일몰 계산 결과를 한 번에 받아온다.
// 실패하거나 응답이 느릴 경우(3초 타임아웃) 기본값(맑음/낮)으로 조용히 진행 — 게임 시작을 막지 않음.
async function applyLiveConditions(){
  // 날짜 시드 기반 장소 로테이션: 하루 단위로 장소가 자동으로 바뀜(대표가 요청한 방식)
  const dayIndex = Math.floor(Date.now() / 86400000);
  setStation(dayIndex % STATIONS.length);

  try{
    const controller = new AbortController();
    const timer = setTimeout(()=>controller.abort(), 3000);
    const res = await fetch('/api/weather?station=' + encodeURIComponent(station.key), {signal: controller.signal, cache: 'no-store'});
    clearTimeout(timer);
    if(res.ok){
      const data = await res.json();
      if(data.weatherMode && ['clear','rain','snow'].includes(data.weatherMode)){
        weatherMode = data.weatherMode;
        spawnWeatherParticles();
      }
      if(data.timeOfDay && ['day','sunset','night'].includes(data.timeOfDay)){
        timeOfDay = data.timeOfDay;
      }
    }
  }catch(e){
    // 네트워크 실패/타임아웃: 기본값(맑음/낮) 그대로 진행
  }
}

function onAllLoaded(){
  document.getElementById('loading').style.display='none';
  applyLiveConditions().finally(()=>{
    requestAnimationFrame(loop);
  });
  if(IS_DEV) initDevPanel();
}

    ['캐릭터','LAND_SQUASH_TIME','착지 찌그러짐 유지시간',0,40,2],
    ['입력','CROUCH_ZONE_MARGIN','숙이기 구역 여유(지면 위로 px)',0,60,2],
    ['장애물','AIR_GAP','공중장애물 바닥과의 틈',20,120,2],
    ['장애물','AIR_OBSTACLE_H','공중장애물 높이',30,120,2],
    ['장애물','LOW_OBSTACLE_H','낮은장애물 높이',50,150,2],
    ['장애물','GROUND_OVERLAP','장애물이 지면에 파묻히는 정도',0,30,2],
    ['장애물','LOW_OBSTACLE_W','낮은장애물 폭(고정 규격)',40,150,2],
    ['장애물','MID_OBSTACLE_H','중간장애물 높이',80,220,2],
    ['장애물','MID_OBSTACLE_W','중간장애물 폭(고정 규격)',40,150,2],
    ['장애물','TALL_OBSTACLE_H','높은장애물 높이(2단점프용)',150,400,5],
    ['장애물','TALL_OBSTACLE_W','높은장애물 폭',40,150,2],
    ['장애물','LONG_OBSTACLE_H','긴장애물 높이(2단점프용)',80,220,2],
    ['장애물','LONG_OBSTACLE_W','긴장애물 폭',150,400,5],
    ['장애물','HITBOX_MARGIN_X','판정 좌우 여백',0,30,1],
    ['장애물','OBSTACLE_GAP_MIN','장애물 최소 간격(바닥)',150,400,5],
    ['장애물','JUMP_SAFETY_MULT','점프 착지 안전 여유(클수록 널널함)',1.0,2.0,0.05],
    ['난이도','DIFFICULTY_RAMP','최고난도 도달 거리(m*10)',300,2000,50],
    ['난이도','EASY_TIER_END','쉬움 구간 끝(m) — 높은/긴 0%',5,80,1],
    ['난이도','MEDIUM_TIER_END','중간 구간 끝(m) — 이후 어려움',20,150,1],
  ];
  let html = '<button id="closeBtn" style="position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#c0392b;color:#fff;border:none;font-size:14px;">✕</button>';
  let curGroup = '';
  for(const [group,key,label,min,max,step] of META){
    if(group!==curGroup){ html += '<h4>'+group+'</h4>'; curGroup = group; }
    html += '<label>'+label+' <span id="val_'+key+'">'+T[key]+'</span>'+
            '<input type="range" min="'+min+'" max="'+max+'" step="'+step+'" value="'+T[key]+'" data-key="'+key+'"></label>';
  }
  html += '<button id="resetBtn">기본값으로 리셋</button>';
  html += '<button id="copyBtn" style="background:#2ec4b6;margin-top:6px;">현재 값 복사</button>';
  html += '<button id="stationBtn" style="background:#ffb703;margin-top:6px;">장소 전환: <span id="stationName">'+station.name+'</span></button>';
  html += '<button id="weatherBtn" style="background:#4a90e2;margin-top:6px;">날씨 테스트: <span id="weatherName">맑음</span></button>';
  html += '<button id="todBtn" style="background:#9b59b6;margin-top:6px;">시간대 테스트: <span id="todName">낮</span></button>';
  html += '<textarea id="copyArea" readonly style="width:100%;height:120px;margin-top:6px;font-size:10px;background:#0a0e18;color:#fff;border:1px solid #444;display:none;"></textarea>';
  panel.innerHTML = html;
  panel.querySelectorAll('input[type=range]').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      const k = inp.dataset.key;
      T[k] = parseFloat(inp.value);
      document.getElementById('val_'+k).textContent = T[k];
      saveTune();
    });
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    T = Object.assign({}, DEFAULTS);
    saveTune();
    panel.querySelectorAll('input[type=range]').forEach(inp=>{
      const k = inp.dataset.key;
      inp.value = T[k];
      document.getElementById('val_'+k).textContent = T[k];
    });
  });
  document.getElementById('copyBtn').addEventListener('click', ()=>{
    const text = JSON.stringify(T, null, 2);
    const area = document.getElementById('copyArea');
    area.value = text;
    area.style.display = 'block';
    area.focus(); area.select();
    let copied = false;
    try{ if(navigator.clipboard) { navigator.clipboard.writeText(text); copied = true; } }catch(e){}
    if(!copied){ try{ document.execCommand('copy'); copied = true; }catch(e){} }
    const btn2 = document.getElementById('copyBtn');
    btn2.textContent = copied ? '복사됨! (안 되면 아래 텍스트 길게 눌러 복사)' : '아래 텍스트 길게 눌러 복사';
    setTimeout(()=>{ btn2.textContent = '현재 값 복사'; }, 2500);
  });
  document.getElementById('stationBtn').addEventListener('click', ()=>{
    setStation(stationIndex+1);
    document.getElementById('stationName').textContent = station.name;
  });
  document.getElementById('weatherBtn').addEventListener('click', ()=>{
    const order = ['clear','rain','snow'];
    weatherMode = order[(order.indexOf(weatherMode)+1) % order.length];
    spawnWeatherParticles();
    const names = {clear:'맑음', rain:'비', snow:'눈'};
    document.getElementById('weatherName').textContent = names[weatherMode];
    announceWeather();
  });
  document.getElementById('todBtn').addEventListener('click', ()=>{
    const order = ['day','sunset','night'];
    timeOfDay = order[(order.indexOf(timeOfDay)+1) % order.length];
    const names = {day:'낮', sunset:'노을', night:'밤'};
    document.getElementById('todName').textContent = names[timeOfDay];
  });
  let open = false;
  btn.addEventListener('click', ()=>{
    open = !open;
    panel.style.display = open ? 'block' : 'none';
  });
  document.getElementById('closeBtn').addEventListener('click', ()=>{
    open = false;
    panel.style.display = 'none';
  });
}
</script>
</body>
</html>

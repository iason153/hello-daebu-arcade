  #tunePanel input[type=range]{width:100%;}
  #tunePanel .btnrow{display:flex;gap:6px;margin-top:10px;}
  #tunePanel button{flex:1;padding:8px;border:none;border-radius:6px;background:#3d8bfd;color:#fff;
    font-size:12px;cursor:pointer;}
  #tunePanel button.reset{background:#8a4d4d;}
  #tuneOut{width:100%;height:90px;margin-top:8px;font-size:11px;background:#111;color:#9f9;

const canvas = document.getElementById('game');
function fixCanvasSize(){
  // don't trust vw/vh CSS units at all (they behave inconsistently across mobile
  // browsers and especially third-party in-app webviews) — measure the real
  // visible pixel size in JS and set the canvas's on-screen size explicitly,
  // scaled to fit while preserving its native 480x1038 aspect ratio
  const vw = window.innerWidth;
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const scale = Math.min(vw / canvas.width, vh / canvas.height) * 0.94; // small safety margin so odd browser-chrome quirks never crop the edges
  canvas.style.width = Math.floor(canvas.width * scale) + 'px';
  canvas.style.height = Math.floor(canvas.height * scale) + 'px';
}
fixCanvasSize();

}

function checkStationTransition(){
  const next = STATIONS[stationIndex+1];

  // stop spawning new obstacles 2 obstacles before the actual threshold, so the
  // approach to the shop is clear instead of overlapping the last couple of pillars

    : score >= next.startScore - 2;
  if(reached){
    gatePending = true; // this alone halts new obstacle spawns (see the spawn loop)
  }
}

function stationProgress(){
  return Math.min(1, Math.max(0, (score - stationStartScore) / Math.max(1, station.gap.DIFFICULTY_RAMP)));
}
function rollGap(){
  const g = station.gap;
  const progress = stationProgress();
  // full random range every time (so consecutive gaps never look "samey"), but skewed
  // toward the tighter end as progress rises — a gentle, random difficulty increase,
  // not a hard deterministic ramp
  let r = Math.random();
  r = Math.pow(r, 1 + progress*(g.SKEW_POWER||0));
  let gapH = g.GAP_H_MIN + r*(g.GAP_H_MAX - g.GAP_H_MIN);
  const minGapY = g.GAP_MARGIN_TOP;
  const maxGapY = H - station.bg.GROUND_H - g.GAP_MARGIN_BOTTOM - gapH;
  const gapY = minGapY + Math.random()*Math.max(20,(maxGapY-minGapY));
  return {gapY, gapH};
}
function spawnObstacle(x){
  const {gapY, gapH} = rollGap();
  const themes = station.themes;
  const topTheme = themes[Math.floor(Math.random()*themes.length)];
  const botTheme = themes[Math.floor(Math.random()*themes.length)];
  const bobAmp = station.gap.BOB_AMP || 0;
  obstacles.push({x, gapY, gapH, baseGapY: gapY, bobSeed: Math.random()*Math.PI*2, bobAmp,
                  topTheme, botTheme, passed:false, stKey: station.key});
}
function spawnCrow(x){
  const minY = 120, maxY = H - station.bg.GROUND_H - 160;
  const y = minY + Math.random()*(maxY-minY);
  const speedMul = 1.2 + Math.random()*1.0; // each crow drifts a bit faster than the scenery
  crows.push({x, y, wingTimer:0, wingFrame:0, speedMul});
}
function regenGaps(){
  for(const ob of obstacles){
    const {gapY, gapH} = rollGap();
    ob.gapH = gapH; ob.gapY = gapY; ob.passed = false;
  }
  if(obstacles.length === 0){ spawnObstacle(scrollX + 160); spawnObstacle(scrollX + 160 + OBSTACLE_GAP_X); }
}

function flap(){
  startBgmIfNeeded();
  if(state==='start'||state==='gameover'){ resetGame(); return; }
  if(state==='dialogue'){
    dialogueCut++;
    if(dialogueCut > 3){
      // advance past the shop dialogue -> queue the actual station switch + arrival flash
      gate = null;
      gatePending = false;
      pendingStationIndex = stationIndex+1;
      stationTransitionTimer = 90;
      transitionScoreSnapshot = score;
      nextObstacleX = scrollX + 500; // give a clear runway into the new station instead of a stale catch-up burst
      duckBgm();
      state = 'playing';
    }
    return;
  }
  hello.vy = T.FLAP;
  flapTimer = 10;
  playSfx('sfx_jump');
}
const NEXT_BTN = { x: W/2-115, y: H-70, w: 230, h: 40 };
function getCanvasPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if(e.touches && e.touches[0]){ clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
  else if(e.changedTouches && e.changedTouches[0]){ clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
  else { clientX = e.clientX; clientY = e.clientY; }
  return { x: (clientX-rect.left)*scaleX, y: (clientY-rect.top)*scaleY };
}
function handleInput(e){
  if(e.cancelable) e.preventDefault();
  if(state==='dialogue'){
    const p = getCanvasPos(e);
    const b = NEXT_BTN;
    if(p.x>=b.x && p.x<=b.x+b.w && p.y>=b.y && p.y<=b.y+b.h) flap();
    return; // ignore taps anywhere else while a dialogue cut is showing
  }
  flap();
}
// a single pointerdown covers mouse, touch and pen in one unified event —
// registering mousedown/touchstart too would double- or triple-fire per tap
canvas.addEventListener('pointerdown', handleInput);
window.addEventListener('keydown', e=>{ if(e.code==='Space'){ e.preventDefault(); flap(); } });

function update(dt){
  if(bgmDuckTimer>0){
    bgmDuckTimer = Math.max(0, bgmDuckTimer - dt);
    if(bgmStarted){
      const elapsed = 70 - bgmDuckTimer; // 0 -> 70
      let vol;
      if(elapsed<15){ vol = T.BGM_VOLUME * (1 - (elapsed/15)*0.85); }       // duck down to a 15% floor
      else if(elapsed<45){ vol = T.BGM_VOLUME * 0.15; }                     // hold low through the swap
      else { const p=(elapsed-45)/25; vol = T.BGM_VOLUME*(0.15 + p*0.85); } // recover back to full
      audio.bgm.volume = Math.max(0, Math.min(T.BGM_VOLUME, vol));
      if(bgmDuckTimer<=0) audio.bgm.volume = T.BGM_VOLUME; // guarantee it's fully restored
    }
  }
  if(stationTransitionTimer>0){
    const wasAbove45 = stationTransitionTimer > 45;
    stationTransitionTimer = Math.max(0, stationTransitionTimer - dt);
    if(wasAbove45 && stationTransitionTimer<=45 && pendingStationIndex>=0){
      stationIndex = pendingStationIndex;
      station = STATIONS[stationIndex];
      stationStartScore = score;
      stationScrollAnchor = scrollX;
      pendingStationIndex = -1;
      // fresh runway measured from the new station's own scroll position, so the first
      // obstacle the player meets is rolled at stationProgress()==0 (the safe, wide end
      // of the new station's gap range) instead of inheriting the old station's difficulty
      nextObstacleX = scrollX + 450;
    }
  }
  if(dialogueFadeTimer>0) dialogueFadeTimer = Math.max(0, dialogueFadeTimer - dt);
  if(state!=='playing') return;
  // order matters here: update position with the OLD velocity plus the exact half-step
  // acceleration term first, THEN update velocity. This is the closed-form solution for
  // constant acceleration over a timestep, so the fall/jump arc comes out identical no
  // matter how big or small dt is (60Hz vs 90Hz vs 120Hz, or a device stuttering to 30fps)
  // — the previous order (velocity first, then position) is a cruder approximation whose
  // error grows with dt, so the arc could genuinely look/feel different device to device
  hello.y += hello.vy * dt + 0.5 * T.GRAVITY * dt * dt;
  hello.vy += T.GRAVITY * dt;
  if(flapTimer>0) flapTimer = Math.max(0, flapTimer - dt);

  scrollX += station.gap.OBSTACLE_SPEED * (1 + stationProgress()*station.gap.SPEED_RAMP_MAX) * dt;
  // also paused for the whole stationTransitionTimer window — otherwise an obstacle could
  // spawn (and get its gap rolled) using the OLD station's already-ramped-up difficulty
  // in the few frames between "gate hit" and the station actually swapping over
  while(nextObstacleX < scrollX + W + 400 && !gatePending && stationTransitionTimer<=0){ spawnObstacle(nextObstacleX); nextObstacleX += OBSTACLE_GAP_X; }
  if(station.hasCrows){
    while(nextCrowX < scrollX + W + 600){ spawnCrow(nextCrowX); nextCrowX += 650 + Math.random()*700; }
  }

  const hx = HELLO_X, hy = hello.y;
  const PW = station.bg.PILLAR_W;
  for(const ob of obstacles){
    if(ob.bobAmp>0){
      let ny = ob.baseGapY + Math.sin(scrollX/70 + ob.bobSeed) * ob.bobAmp;
      const lo = station.gap.GAP_MARGIN_TOP, hi = H - station.bg.GROUND_H - station.gap.GAP_MARGIN_BOTTOM - ob.gapH;
      ob.gapY = Math.max(lo, Math.min(hi, ny));
    }
    const ox = ob.x - scrollX;
    if(!ob.passed && ox + PW < hx){
      ob.passed = true; score++;
      checkStationTransition();
      if(score % 5 === 0 && score !== lastMilestone){
        lastMilestone = score;
        milestoneTimer = 60;
        milestoneText = score + 'M!!';
        playSfx(MILESTONE_SFX[milestoneSfxIndex]);
        milestoneSfxIndex = (milestoneSfxIndex + 1) % MILESTONE_SFX.length;
      }
    }
    if(ox < hx + HITBOX && ox + PW > hx - HITBOX){
      if(hy - HITBOX < ob.gapY || hy + HITBOX > ob.gapY + ob.gapH){
        if(hitTimer<=0){ energy -= 34; hitTimer = 55; hello.vy = -4; shakeTimer = 18; flashTimer = 22; playSfx('sfx_hit'); }
      }
    }
  }
  const CROW_W = 46, CROW_H = 36;
  for(const cw of crows){
    cw.wingTimer += dt;
    if(cw.wingTimer>8){ cw.wingTimer=0; cw.wingFrame = 1-cw.wingFrame; }
    cw.x -= station.gap.OBSTACLE_SPEED * (cw.speedMul - 1) * dt; // extra drift on top of the shared world scroll
    const cx = cw.x - scrollX;
    if(cx < hx+HITBOX && cx+CROW_W > hx-HITBOX && Math.abs(cw.y-hy) < (CROW_H/2+HITBOX)){
      if(hitTimer<=0){ energy -= 34; hitTimer = 55; hello.vy = -4; shakeTimer = 18; flashTimer = 22; playSfx('sfx_hit'); }
    }
  }
  crows = crows.filter(c=> c.x - scrollX > -100);

  if(gatePending && !gate && obstacles.every(o=>o.passed)){
    const minY = 140, maxY = H - station.bg.GROUND_H - 220;
    const baseY = minY + Math.random()*(maxY-minY);
    // spawns much closer to on-screen (was W+150) so it doesn't feel like a long
    // empty gap after the last obstacle — see also GATE_SPEED default below
    gate = { screenX: W + 40, baseY, y: baseY, bobSeed: Math.random()*Math.PI*2, w: T.GATE_W, h: T.GATE_W*1.25, hit:false,
             img: 'gate_' + station.key };
  }
  if(gate && !gate.hit){
    gate.screenX -= T.GATE_SPEED * dt; // moves at its own independent speed, decoupled from world scroll
    gate.y = gate.baseY + Math.sin(Date.now()/500 + gate.bobSeed) * 13; // gentle floating bob (real-time based already)
    const gx = gate.screenX;
    if(hx+HITBOX > gx-gate.w/2 && hx-HITBOX < gx+gate.w/2 && hy > gate.y-gate.h/2 && hy < gate.y+gate.h/2){
      gate.hit = true;
      // ad-ization deferred (see SHOPS comment above) — flying into the gate now goes
      // straight into the station transition instead of the old shop dialogue cutscene
      gate = null;
      gatePending = false;
      pendingStationIndex = stationIndex+1;
      stationTransitionTimer = 90;
      transitionScoreSnapshot = score;
      duckBgm();
    }
  }
  if(hitTimer>0) hitTimer = Math.max(0, hitTimer - dt);
  if(shakeTimer>0) shakeTimer = Math.max(0, shakeTimer - dt);
  if(flashTimer>0) flashTimer = Math.max(0, flashTimer - dt);
  if(milestoneTimer>0) milestoneTimer = Math.max(0, milestoneTimer - dt);
  if(healTimer>0) healTimer = Math.max(0, healTimer - dt);

  if(hy > H + 60 || hy < -80 || energy<=0){
    if(state !== 'gameover'){ playSfx('sfx_die'); }
    state = 'gameover';
  }
  obstacles = obstacles.filter(o=> o.x - scrollX > -260);
}

// ---------- drawing helpers ----------
function drawTiledBottom(img, dispH, speedFactor, offsetY, blur, height, localScroll){
  if(!img || !img.complete || !img.naturalWidth || dispH<=0) return;
  const scale = dispH / img.naturalHeight;
  const w = img.naturalWidth * scale;
  const topY = height - dispH - offsetY;
  const off = (localScroll*speedFactor) % w;
  ctx.save();
  if(blur>0) ctx.filter = 'blur('+blur+'px)';
  for(let x = -off - w; x < W + w; x += w){ ctx.drawImage(img, x, topY, w, dispH); }
  ctx.restore();
}
function drawSea(bg, seaImg, localScroll){
  if(!seaImg || !seaImg.complete) return;
  const dispH = bg.SEA_H;
  const scale = dispH / seaImg.naturalHeight;
  const w = seaImg.naturalWidth * scale;
  const topY = GROUND_Y - dispH - bg.SEA_OFFSET_Y;
  const baseX = (W - w) / 2 + bg.SEA_OFFSET_X;
  ctx.save();
  if(bg.SEA_BLUR>0) ctx.filter = 'blur('+bg.SEA_BLUR+'px)';
  if(bg.SEA_SCROLL > 0){
    const off = (localScroll*bg.SEA_SCROLL) % w;
    for(let x = baseX - off - w; x < W + w; x += w){ ctx.drawImage(seaImg, x, topY, w, dispH); }
  } else { ctx.drawImage(seaImg, baseX, topY, w, dispH); }
  ctx.restore();
}
function drawLandmark(bg, img, localScroll){
  if(!img || !img.complete || !bg.LANDMARK_H) return;
  const dispH = bg.LANDMARK_H;
  const scale = dispH / img.naturalHeight;
  const w = img.naturalWidth * scale;
  const topY = GROUND_Y - dispH - bg.LANDMARK_OFFSET_Y;
  const x = bg.LANDMARK_WORLD_X - localScroll*bg.LANDMARK_SCROLL + bg.LANDMARK_OFFSET_X;
  if(x + w < -50 || x > W + 50) return;
  ctx.save();
  if(bg.LANDMARK_BLUR>0) ctx.filter = 'blur('+bg.LANDMARK_BLUR+'px)';
  ctx.drawImage(img, x, topY, w, dispH);
  ctx.restore();
}
function drawImgFlippedV(img, x, y, w, h){
  ctx.save(); ctx.translate(x, y+h); ctx.scale(1,-1); ctx.drawImage(img, 0, 0, w, h); ctx.restore();
}
function drawVTileUp(img, cx, bottomY, topY, w){
  if(!img || !img.complete || !img.naturalWidth) return;
  if(bottomY <= topY) return;
  const scale = w / img.naturalWidth;
  const th = img.naturalHeight * scale;
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - w/2, topY, w, bottomY - topY); ctx.clip();
  let y = bottomY;
  while(y > topY){ ctx.drawImage(img, cx - w/2, y - th, w, th); y -= th; }
  ctx.restore();
}
function drawVTileDown(img, cx, topY, bottomY, w){
  // like drawVTileUp but anchors the tile pattern to the TOP edge instead —
  // used for the bottom pillar so its pattern rides along with the moving
  // gap-side cap, the same way the top pillar's pattern already does
  if(!img || !img.complete || !img.naturalWidth) return;
  if(bottomY <= topY) return;
  const scale = w / img.naturalWidth;
  const th = img.naturalHeight * scale;
  ctx.save();
  ctx.beginPath(); ctx.rect(cx - w/2, topY, w, bottomY - topY); ctx.clip();
  let y = topY;
  while(y < bottomY){ ctx.drawImage(img, cx - w/2, y, w, th); y += th; }
  ctx.restore();
}
function drawBottomPillar(cx, gapBottomY, theme, stKey){
  const tileImg = images[stKey+'_tile_'+theme];
  const capBot = images.cap_bottom, capTop = images.cap_top;
  const CAP_W = station.bg.CAP_W;
  const capBotH = CAP_W * (capBot.naturalHeight/capBot.naturalWidth);
  const capTopH = CAP_W * (capTop.naturalHeight/capTop.naturalWidth);
  ctx.drawImage(capBot, cx-CAP_W/2, GROUND_Y-capBotH, CAP_W, capBotH);
  // anchor the tile pattern to the TOP edge (the moving gap-side cap) instead of the
  // ground — this is the fix for the "cap and body don't move together" bug: the old
  // drawVTileUp call anchored to the ground (fixed), so the pattern's phase drifted
  // relative to the cap every time the gap bobbed up/down
  drawVTileDown(tileImg, cx, gapBottomY+capTopH, GROUND_Y-capBotH, station.bg.PILLAR_W);
  ctx.drawImage(capTop, cx-CAP_W/2, gapBottomY, CAP_W, capTopH);
}
function drawTopPillar(cx, gapTopY, theme, stKey){
  const tileImg = images[stKey+'_tile_'+theme];
  const capTop = images.cap_top;
  const CAP_W = station.bg.CAP_W;
  const capTopH = CAP_W * (capTop.naturalHeight/capTop.naturalWidth);
  drawVTileUp(tileImg, cx, gapTopY-capTopH, 0, station.bg.PILLAR_W);
  drawImgFlippedV(capTop, cx-CAP_W/2, gapTopY-capTopH, CAP_W, capTopH);
}
function drawObstacles(){
  for(const ob of obstacles){
    const ox = ob.x - scrollX;
    const cx = ox + station.bg.PILLAR_W/2;
    drawTopPillar(cx, ob.gapY, ob.topTheme, ob.stKey);
    drawBottomPillar(cx, ob.gapY+ob.gapH, ob.botTheme, ob.stKey);
  }
}
function drawCrows(){
  const w = 70, h = w * (54/75); // approx aspect from the source art
  for(const cw of crows){
    const img = images[cw.wingFrame===0 ? 'crow_wing_up' : 'crow_wing_down'];
    if(!img || !img.complete) continue;
    const cx = cw.x - scrollX;
    const dh = w * (img.naturalHeight/img.naturalWidth);
    ctx.drawImage(img, cx-w/2, cw.y-dh/2, w, dh);
  }
}
function drawGate(){
  if(!gate || gate.hit) return;
  const gx = gate.screenX;
  if(gx < -200 || gx > W+200) return;
  ctx.save();
  const img = images[gate.img];
  if(img && img.complete){
    const scale = gate.w / img.naturalWidth;
    const dh = img.naturalHeight * scale;
    ctx.drawImage(img, gx-gate.w/2, gate.y-dh/2, gate.w, dh);
  } else {
    ctx.fillStyle = '#fff8e1';
    roundRect(ctx, gx-gate.w/2, gate.y-gate.h/2, gate.w, gate.h, 14); ctx.fill();
  }
  // pulsing red target ring above it pointing the way
  const pulse = 1 + 0.15*Math.sin(Date.now()/150);
  ctx.strokeStyle = 'rgba(230,30,30,0.9)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(gx, gate.y-gate.h/2-30, 16*pulse, 0, Math.PI*2); ctx.stroke();
  ctx.fillStyle = 'rgba(230,30,30,0.9)';
  ctx.beginPath();
  ctx.moveTo(gx-8, gate.y-gate.h/2-8); ctx.lineTo(gx+8, gate.y-gate.h/2-8); ctx.lineTo(gx, gate.y-gate.h/2+4);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawDialogue(){
  const shop = gate ? gate.shop : SHOPS[0];
  ctx.save();

  let img, headline, body;
  if(dialogueCut===0){
    img = images[shop.img]; headline=null; body=null;
  } else if(dialogueCut===1){
    img = images[shop.introImg] || images[shop.img]; headline=shop.name; body=shop.tagline;
  } else if(dialogueCut===2){
    img = images[shop.illust1] || images[shop.img] || images.hello_happy; headline=null; body=shop.line1;
  } else {
    img = images[shop.illust2] || images[shop.img] || images.hello_flap_up; headline=null; body=shop.line2;
  }

  if(img && img.complete) drawFitWidth(img, W, H, '#1a2a3a');
  else { ctx.fillStyle='#223'; ctx.fillRect(0,0,W,H); }

  if(headline || body){
    const boxH = headline && body ? 150 : 110;
    ctx.fillStyle='rgba(0,0,0,0.58)';
    roundRect(ctx, 30, H/2-boxH/2, W-60, boxH, 16); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center';
    let y = H/2 - boxH/2 + 40;
    if(headline){ ctx.font='bold 22px sans-serif'; ctx.fillText(headline, W/2, y); y += 34; }
    if(body){ ctx.font='16px sans-serif'; wrapText(body, W/2, y+8, W-110, 22); }
  }

  ctx.fillStyle='#ffb703';
  roundRect(ctx, W/2-115, H-70, 230, 40, 20); ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2;
  roundRect(ctx, W/2-115, H-70, 230, 40, 20); ctx.stroke();
  ctx.fillStyle='#3a2a00'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center';
  ctx.fillText(dialogueCut<3 ? '다음 ▶' : '다음 스테이션으로 ▶', W/2, H-45);

  if(dialogueFadeTimer>0){
    ctx.fillStyle = 'rgba(0,0,0,'+(dialogueFadeTimer/30)+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}
function wrapText(text, cx, startY, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '', y = startY;
  const lines = [];
  for(const w of words){
    const test = line ? line+' '+w : w;
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = w; }
    else line = test;
  }
  if(line) lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l, cx, y + i*lineHeight));
}
function drawHello(){
  let pose = 'hello_neutral';
  if(hitTimer > 35) pose = 'hello_hit';
  else if(healTimer > 0) pose = 'hello_happy';
  else if(flapTimer > 0) pose = 'hello_flap_up';
  else if(hello.vy > 3) pose = 'hello_flap_down';

  if(img && img.complete){
    ctx.drawImage(img, HELLO_X - T.HELLO_SIZE/2, hello.y - T.HELLO_SIZE/2, T.HELLO_SIZE, T.HELLO_SIZE);
  }
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawUI(){
  ctx.save();
  const HEART_COUNT = 3, perHeart = 100/HEART_COUNT;

    ctx.fillStyle='rgba(0,0,0,0.6)'; roundRect(ctx, W/2-58,50,116,26,13); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='13px sans-serif'; ctx.textAlign='center';

  if(state==='start'){ drawStartScreen(); }
  else if(state==='gameover'){ drawGameOverScreen(); }

function drawCover(img, w, h){
  // draws img covering a w x h box, centered, cropping overflow (like CSS background-size:cover)
  const scale = Math.max(w/img.naturalWidth, h/img.naturalHeight);
  const dw = img.naturalWidth*scale, dh = img.naturalHeight*scale;
  ctx.drawImage(img, (w-dw)/2, (h-dh)/2, dw, dh);
}
function drawFitWidth(img, w, h, bgColor){
  // fits img to the full width, never cropping left/right — any leftover
  // top/bottom space is filled with bgColor instead of cutting off the sides
  ctx.fillStyle = bgColor || '#1a2a3a';
  ctx.fillRect(0,0,w,h);
  const scale = w/img.naturalWidth;
  const dh = img.naturalHeight*scale;
  ctx.drawImage(img, 0, (h-dh)/2, w, dh);
}
function drawStartScreen(){

function drawStationTransition(){
  if(stationTransitionTimer<=0) return;
  const elapsed = 90 - stationTransitionTimer; // 0->90
  const nextName = (pendingStationIndex>=0 ? STATIONS[pendingStationIndex] : station).name;
  // white/gold flash, strongest right at the swap point (elapsed ~45)
  const dist = Math.abs(elapsed-45);
  const flashA = Math.max(0, 1 - dist/45);
  if(flashA>0){
    ctx.save();
    ctx.fillStyle = 'rgba(255,250,220,'+(flashA*0.85)+')';
    ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  // banner text, pop in then out around the swap
  let scale, alpha;
  if(elapsed<20){ const p=elapsed/20; scale=1.8-p*0.8; alpha=p; }
  else if(elapsed<70){ scale=1.0; alpha=1; }
  else { const p=(elapsed-70)/20; scale=1.0+p*0.3; alpha=1-p; }
  ctx.save();
  ctx.globalAlpha = Math.max(0,alpha);
  ctx.translate(W/2, H*0.4);
  ctx.scale(scale,scale);
  ctx.textAlign='center';
  ctx.font='bold 40px sans-serif';
  ctx.lineWidth=8; ctx.strokeStyle='#fff';
  ctx.strokeText(nextName+' 도착!', 0, 0);
  ctx.fillStyle='#ffb703';
  ctx.fillText(nextName+' 도착!', 0, 0);
  if(elapsed>=15){
    ctx.font='bold 20px sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('총 '+transitionScoreSnapshot+'m', 0, 42);
  }
  ctx.restore();
}

function draw(){
  const bg = station.bg;
  const localScroll = scrollX - stationScrollAnchor;
  ctx.save();
  if(shakeTimer>0){
    const mag = 6 * (shakeTimer/18);
    ctx.translate((Math.random()-0.5)*mag*2, (Math.random()-0.5)*mag*2);
  }
  ctx.fillStyle = '#a0d7fa'; ctx.fillRect(0,0,W,H);
  const skyImg = images[station.key+'_sky'];
  if(skyImg && skyImg.complete) ctx.drawImage(skyImg, 0, 0, W, H);
  drawSea(bg, images[station.key+'_sea'], localScroll);
  if(station.hasLandmark) drawLandmark(bg, images[station.key+'_landmark'], localScroll);
  drawTiledBottom(images[station.key+'_mid'], bg.MID_H, bg.MID_SCROLL, bg.MID_OFFSET_Y, bg.MID_BLUR, GROUND_Y, localScroll);
  drawObstacles();
  drawCrows();
  drawGate();
  drawTiledBottom(images[station.key+'_ground'], bg.GROUND_H, bg.GROUND_SCROLL, bg.GROUND_OFFSET_Y, bg.GROUND_BLUR, GROUND_Y, localScroll);
  drawHello();
  if(flashTimer>0){
    ctx.fillStyle = 'rgba(255,40,40,'+(0.35*(flashTimer/22))+')';
    ctx.fillRect(-20,-20,W+40,H+40);
  }
  ctx.restore();

  if(milestoneTimer>0){
    ctx.save();
    const elapsed = 60 - milestoneTimer;
    let scale, alpha = 1;
    if(elapsed < 8){ const p = elapsed/8; scale = 2.0 - p*0.85; }
    else if(elapsed < 45){ const beat = Math.abs(Math.sin((elapsed-8)*0.4)); scale = 1.15 + beat*0.22; }
    else { const p=(elapsed-45)/15; scale = 1.15+p*0.35; alpha = 1-p; }
    ctx.globalAlpha = alpha;
    ctx.translate(W/2, H*0.32); ctx.scale(scale,scale);
    ctx.textAlign='center'; ctx.font='bold 72px sans-serif';
    ctx.lineWidth=9; ctx.strokeStyle='#fff'; ctx.strokeText(milestoneText,0,0);
    ctx.fillStyle='#ff2d3a'; ctx.fillText(milestoneText,0,0);
    ctx.restore();
  }

  drawStationTransition();
  drawUI();
}

let lastTs = null;
function loop(ts){
  let dt = 1;
  if(lastTs !== null){
    dt = (ts - lastTs) / (1000/60); // 1.0 == exactly one 60fps frame's worth of time
    dt = Math.max(0, Math.min(dt, 3)); // clamp so a tab coming back from background doesn't jump wildly
  }
  lastTs = ts;
  if(!paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
</script>
